name: Deploy OpenEvolve

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          cd api/gateway
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run backend tests
        run: |
          cd api/gateway
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=html

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: BubbleLab/apps/bubble-studio/package-lock.json

      - name: Install Node dependencies
        run: |
          cd BubbleLab/apps/bubble-studio
          npm ci

      - name: Run frontend tests
        run: |
          cd BubbleLab/apps/bubble-studio
          npm run test -- --coverage --watchAll=false

      - name: Run E2E tests
        run: |
          cd BubbleLab/apps/bubble-studio
          npm run build
          npm run test:e2e

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./api/gateway/coverage.xml,./BubbleLab/apps/bubble-studio/coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

      - name: Check test coverage
        run: |
          backend_coverage=$(cd api/gateway && python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(root.attrib['line-rate'])")
          echo "Backend coverage: $backend_coverage"
          if (( $(echo "$backend_coverage < 0.87" | bc -l) )); then
            echo "Backend coverage below 87% threshold"
            exit 1
          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Bandit security linter (Python)
        run: |
          pip install bandit[toml]
          bandit -r api/gateway -f json -o bandit-report.json || true

      - name: Run npm audit (JavaScript)
        run: |
          cd BubbleLab/apps/bubble-studio
          npm audit --audit-level=moderate --production || true

  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python linting tools
        run: |
          pip install black flake8 mypy pylint

      - name: Run Black (Python formatter check)
        run: |
          black --check api/gateway

      - name: Run Flake8 (Python linter)
        run: |
          flake8 api/gateway --max-line-length=100 --extend-ignore=E203,W503

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install ESLint
        run: |
          cd BubbleLab/apps/bubble-studio
          npm install

      - name: Run ESLint (JavaScript linter)
        run: |
          cd BubbleLab/apps/bubble-studio
          npm run lint

  build-staging:
    name: Build & Push Staging Images
    needs: [test, security-scan, lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api/gateway
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/api-gateway:staging
            ${{ env.REGISTRY }}/${{ github.repository }}/api-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./BubbleLab/apps/bubble-studio
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/bubblelab-frontend:staging
            ${{ env.REGISTRY }}/${{ github.repository }}/bubblelab-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: build-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: http://staging.openevolve.ai
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/openevolve
            git pull origin main
            docker-compose -f deploy/staging/docker-compose.staging.yml pull
            docker-compose -f deploy/staging/docker-compose.staging.yml up -d
            sleep 30

      - name: Run health checks
        run: |
          bash deploy/scripts/health-check.sh staging http://staging.openevolve.ai

      - name: Run smoke tests
        run: |
          bash deploy/scripts/smoke-tests.sh staging http://staging.openevolve.ai

      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Staging deployment ${{ job.status }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  build-production:
    name: Build & Push Production Images
    needs: [test, security-scan, lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API Gateway (Production)
        uses: docker/build-push-action@v5
        with:
          context: ./api/gateway
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/api-gateway:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/api-gateway:production
            ${{ env.REGISTRY }}/${{ github.repository }}/api-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENVIRONMENT=production

      - name: Build and push Frontend (Production)
        uses: docker/build-push-action@v5
        with:
          context: ./BubbleLab/apps/bubble-studio
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/bubblelab-frontend:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/bubblelab-frontend:production
            ${{ env.REGISTRY }}/${{ github.repository }}/bubblelab-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=https://openevolve.ai
            VITE_WS_BASE_URL=wss://openevolve.ai

  deploy-production:
    name: Deploy to Production
    needs: [build-production, deploy-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://openevolve.ai
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create production backup
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/openevolve
            bash deploy/scripts/backup-production.sh

      - name: Deploy to production (blue-green deployment)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/openevolve
            docker-compose -f deploy/production/docker-compose.production.yml pull
            docker-compose -f deploy/production/docker-compose.production.yml up -d --no-deps --build
            docker-compose -f deploy/production/docker-compose.production.yml up -d --scale api-gateway=3
            sleep 60

      - name: Run health checks
        run: |
          bash deploy/scripts/health-check.sh production https://openevolve.ai

      - name: Run smoke tests
        run: |
          bash deploy/scripts/smoke-tests.sh production https://openevolve.ai

      - name: Verify deployment
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Production deployment ${{ job.status }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            URL: https://openevolve.ai
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/openevolve
            bash deploy/scripts/rollback.sh
