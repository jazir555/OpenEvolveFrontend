name: Infrastructure Health Check

on:
  push:
    branches: [main, develop, feature/*]
    paths:
      - 'docker-compose.infrastructure.yml'
      - 'scripts/**'
      - '.env.infrastructure.example'
      - '.github/workflows/infrastructure-health.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docker-compose.infrastructure.yml'
      - 'scripts/**'
      - '.env.infrastructure.example'
      - '.github/workflows/infrastructure-health.yml'
  schedule:
    # Run health checks daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.infrastructure.yml
  ENV_FILE: .env.infrastructure

jobs:
  validate-compose-files:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose syntax
        run: |
          docker compose -f $COMPOSE_FILE config --quiet

      - name: Check for deprecated features
        run: |
          echo "Checking for deprecated Docker Compose features..."
          if grep -q "version:" $COMPOSE_FILE; then
            echo "⚠️ WARNING: 'version' attribute is deprecated"
            echo "Consider removing it from $COMPOSE_FILE"
          fi

  validate-environment:
    name: Validate Environment Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check .env.infrastructure.example exists
        run: |
          if [ ! -f ".env.infrastructure.example" ]; then
            echo "❌ .env.infrastructure.example not found"
            exit 1
          fi
          echo "✓ .env.infrastructure.example exists"

      - name: Validate environment variables in compose file
        run: |
          echo "Checking for required environment variables..."
          required_vars=(
            "POSTGRES_DB"
            "POSTGRES_USER"
            "POSTGRES_PASSWORD"
          )

          for var in "${required_vars[@]}"; do
            if grep -q "\${$var}" $COMPOSE_FILE; then
              echo "✓ $var is referenced in compose file"
            else
              echo "⚠️ $var not found in compose file"
            fi
          done

  validate-scripts:
    name: Validate Infrastructure Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check script permissions
        run: |
          echo "Checking script permissions..."
          for script in scripts/dev-start.sh scripts/dev-stop.sh scripts/verify-infrastructure.sh; do
            if [ -f "$script" ]; then
              if [ -x "$script" ]; then
                echo "✓ $script is executable"
              else
                echo "⚠️ $script is not executable"
                chmod +x "$script"
              fi
            else
              echo "❌ $script not found"
              exit 1
            fi
          done

      - name: Validate bash scripts
        run: |
          echo "Validating bash scripts..."
          for script in scripts/*.sh; do
            if [ -f "$script" ]; then
              echo "Checking $script..."
              bash -n "$script" || exit 1
              echo "✓ $script syntax is valid"
            fi
          done

      - name: Check for required script functions
        run: |
          echo "Checking dev-start.sh for required functions..."
          required_functions=(
            "check_docker"
            "check_env_file"
            "start_services"
            "run_health_checks"
          )

          for func in "${required_functions[@]}"; do
            if grep -q "$func()" scripts/dev-start.sh; then
              echo "✓ Function $func() found"
            else
              echo "❌ Function $func() not found"
              exit 1
            fi
          done

  validate-database-schema:
    name: Validate Database Initialization Script
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test database initialization script
        run: |
          echo "Testing database initialization..."
          docker exec ${{ job.services.postgres.id }} \
            psql -U test_user -d test_db -f /dev/stdin < scripts/init-db.sql

      - name: Verify database schema
        run: |
          echo "Verifying created tables..."
          tables=$(docker exec ${{ job.services.postgres.id }} \
            psql -U test_user -d test_db -tAc "
              SELECT table_name FROM information_schema.tables
              WHERE table_schema = 'public'
              ORDER BY table_name;
            ")

          expected_tables="users projects tasks"
          for table in $expected_tables; do
            if echo "$tables" | grep -q "^$table$"; then
              echo "✓ Table '$table' exists"
            else
              echo "❌ Table '$table' not found"
              exit 1
            fi
          done

      - name: Verify extensions
        run: |
          echo "Verifying extensions..."
          extensions=$(docker exec ${{ job.services.postgres.id }} \
            psql -U test_user -d test_db -tAc "
              SELECT extname FROM pg_extension ORDER BY extname;
            ")

          required_extensions="uuid-ossp pg_trgm"
          for ext in $required_extensions; do
            if echo "$extensions" | grep -q "$ext"; then
              echo "✓ Extension '$ext' is installed"
            else
              echo "⚠️ Extension '$ext' not found (may be optional)"
            fi
          done

      - name: Verify indexes
        run: |
          echo "Verifying indexes..."
          indexes=$(docker exec ${{ job.services.postgres.id }} \
            psql -U test_user -d test_db -tAc "
              SELECT indexname FROM pg_indexes
              WHERE schemaname = 'public'
              ORDER BY indexname;
            ")

          if [ -n "$indexes" ]; then
            echo "✓ Indexes created:"
            echo "$indexes"
          else
            echo "⚠️ No indexes found"
          fi

  test-infrastructure-startup:
    name: Test Infrastructure Startup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create environment file
        run: |
          cp .env.infrastructure.example .env.infrastructure

      - name: Start infrastructure services
        run: |
          docker compose -f $COMPOSE_FILE --env-file $ENV_FILE up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services..."
          sleep 30

          # Check PostgreSQL
          echo "Checking PostgreSQL..."
          timeout 60 bash -c 'until docker exec openevolve-postgres pg_isready -U openevolve -d openevolve; do sleep 2; done'
          echo "✓ PostgreSQL is ready"

          # Check Qdrant
          echo "Checking Qdrant..."
          timeout 60 bash -c 'until curl -sf http://localhost:6333/health; do sleep 2; done'
          echo "✓ Qdrant is ready"

          # Check Redis
          echo "Checking Redis..."
          timeout 60 bash -c 'until docker exec openevolve-redis redis-cli ping | grep -q PONG; do sleep 2; done'
          echo "✓ Redis is ready"

      - name: Run verification script
        run: |
          bash scripts/verify-infrastructure.sh

      - name: View container logs
        if: always()
        run: |
          echo "=== PostgreSQL Logs ==="
          docker logs openevolve-postgres || true

          echo "=== Qdrant Logs ==="
          docker logs openevolve-qdrant || true

          echo "=== Redis Logs ==="
          docker logs openevolve-redis || true

      - name: Cleanup
        if: always()
        run: |
          docker compose -f $COMPOSE_FILE --env-file $ENV_FILE down -v

  security-scan-infrastructure:
    name: Security Scan Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy on Docker Compose file
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'docker-compose.infrastructure.yml'
          format: 'sarif'
          output: 'trivy-compose-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-compose-results.sarif'

      - name: Check for hardcoded secrets
        run: |
          echo "Checking for hardcoded secrets..."
          if grep -r -i -E "(password|secret|key)\s*=\s*['\"][^'\"]+['\"]" \
            docker-compose.infrastructure.yml \
            .env.infrastructure.example 2>/dev/null; then
            echo "⚠️ WARNING: Possible hardcoded secrets found"
            echo "Please ensure these are placeholder values"
          else
            echo "✓ No hardcoded secrets found"
          fi

  generate-report:
    name: Generate Infrastructure Report
    runs-on: ubuntu-latest
    needs: [validate-compose-files, validate-environment, validate-scripts, validate-database-schema, test-infrastructure-startup, security-scan-infrastructure]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          echo "Infrastructure Health Check Summary"
          echo "=================================="
          echo ""
          echo "Compose File Validation: ${{ needs.validate-compose-files.result }}"
          echo "Environment Validation: ${{ needs.validate-environment.result }}"
          echo "Scripts Validation: ${{ needs.validate-scripts.result }}"
          echo "Database Schema Validation: ${{ needs.validate-database-schema.result }}"
          echo "Infrastructure Startup Test: ${{ needs.test-infrastructure-startup.result }}"
          echo "Security Scan: ${{ needs.security-scan-infrastructure.result }}"
          echo ""

          if [ "${{ needs.validate-compose-files.result }}" != "success" ] || \
             [ "${{ needs.validate-environment.result }}" != "success" ] || \
             [ "${{ needs.validate-scripts.result }}" != "success" ] || \
             [ "${{ needs.validate-database-schema.result }}" != "success" ] || \
             [ "${{ needs.test-infrastructure-startup.result }}" != "success" ]; then
            echo "❌ Infrastructure health check failed"
            exit 1
          else
            echo "✅ All infrastructure health checks passed"
          fi
