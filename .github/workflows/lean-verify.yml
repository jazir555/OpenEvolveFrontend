name: Lean4 Proof Verification

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'lean_workspace/mathlib_project/**'
      - '.github/workflows/lean-verify.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'lean_workspace/mathlib_project/**'
      - '.github/workflows/lean-verify.yml'
  workflow_dispatch:

env:
  LAKE_VERSION: "4.12.0"

jobs:
  verify-lean-proofs:
    name: Verify Lean4 Proofs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Elan (Lean toolchain installer)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Lake
        run: |
          curl -L https://github.com/leanprover/lake/releases/download/v${{ env.LAKE_VERSION }}/lake-x86_64-unknown-linux-gnu.tar.gz -o lake.tar.gz
          tar -xzf lake.tar.gz
          chmod +x lake
          echo "$GITHUB_WORKSPACE" >> $GITHUB_PATH

      - name: Verify toolchain versions
        run: |
          echo "Elan version:"
          elan --version || true
          echo "Lake version:"
          lake --version || true

      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: lean_workspace/mathlib_project/.lake
          key: ${{ runner.os }}-lake-${{ hashFiles('lean_workspace/mathlib_project/lakefile.lean') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      - name: Build Lean4 project
        working-directory: ./lean_workspace/mathlib_project
        run: |
          echo "Building Lean4 project..."
          lake build
        timeout-minutes: 60

      - name: Run Lean4 tests
        working-directory: ./lean_workspace/mathlib_project
        run: |
          echo "Running Lean4 tests..."
          lake test || echo "Note: Some tests may require additional setup"
        timeout-minutes: 30

      - name: Verify no incomplete proofs
        working-directory: ./lean_workspace/mathlib_project
        run: |
          echo "Checking for 'sorry' tactics (incomplete proofs)..."
          if grep -r "sorry" --include="*.lean" .; then
            echo "::error::Found incomplete proofs (sorry tactics) in the codebase"
            exit 1
          else
            echo "No incomplete proofs found - all proofs are complete!"
          fi

      - name: Verify no temporary files
        working-directory: ./lean_workspace
        run: |
          echo "Checking for temporary Lean files..."
          if ls tmp*.lean 2>/dev/null; then
            echo "::warning::Found temporary Lean files (tmp*.lean) that should be cleaned"
          else
            echo "No temporary files found - directory is clean!"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lean-build-logs
          path: |
            lean_workspace/mathlib_project/.lake/build/
            lean_workspace/mathlib_project/*.olean
          retention-days: 7

  lint-lean-code:
    name: Lint Lean4 Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Check file organization
        working-directory: ./lean_workspace/mathlib_project
        run: |
          echo "Verifying file organization..."
          # Check that all core files exist
          required_files=(
            "MathlibProject.lean"
            "MathlibProject/Core/SSVTypes.lean"
            "MathlibProject/Core/ArithmeticSafety.lean"
            "MathlibProject/Core/OperatorFees.lean"
            "MathlibProject/Core/ClusterLiquidation.lean"
            "MathlibProject/Core/InsolvencyTheorem.lean"
            "MathlibProject/Utils/SSVHelpers.lean"
            "MathlibProject/Tests/PropertyTests.lean"
          )

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file exists"
            else
              echo "::error::Required file $file not found"
              exit 1
            fi
          done

  proof-statistics:
    name: Generate Proof Statistics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count theorems and proofs
        working-directory: ./lean_workspace/mathlib_project
        run: |
          echo "# Lean4 Proof Statistics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Theorem and Proof Counts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "- **Theorems:** $(grep -r "^theorem " --include="*.lean" . | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **Definitions:** $(grep -r "^def " --include="*.lean" . | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **Structures:** $(grep -r "^structure " --include="*.lean" . | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "- **Incomplete proofs:** $(grep -r "sorry" --include="*.lean" . | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## File Breakdown" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for file in MathlibProject*.lean $(find MathlibProject -name "*.lean"); do
            if [ -f "$file" ]; then
              echo "### $file" >> $GITHUB_STEP_SUMMARY
              theorems=$(grep -c "^theorem " "$file" 2>/dev/null || echo "0")
              sorries=$(grep -c "sorry" "$file" 2>/dev/null || echo "0")
              echo "- Theorems: $theorems" >> $GITHUB_STEP_SUMMARY
              echo "- Incomplete proofs: $sorries" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done
