name: RESE Framework - Scheduled Nightly Pipeline

on:
  schedule:
    # Run at 2 AM UTC every night
    - cron: '0 2 * * *'
  workflow_dispatch:

# Concurrency group - allow only one nightly run at a time
concurrency:
  group: rese-nightly
  cancel-in-progress: false

env:
  RESE_ENV: production
  RESE_LOG_LEVEL: INFO

jobs:
  # ============================================================================
  # Job 1: Full Test Suite
  # ============================================================================
  full-test-suite:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-xdist pytest-timeout
          pip install pydantic pydantic-settings numpy
          pip install flake8 black mypy pylint bandit safety

      - name: Run unit tests
        run: |
          echo "Running unit tests with pytest..."
          pytest glue/adapters/rese-*/tests/ \
            -v \
            --tb=short \
            --cov=glue/adapters/rese-phase1/src \
            --cov=glue/adapters/rese-phase2/src \
            --cov=glue/adapters/rese-phase3/src \
            --cov=glue/adapters/rese-phase4/src \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --junitxml=unit-test-results.xml \
            -n auto || exit 1

      - name: Run integration tests
        run: |
          echo "Running integration tests..."
          python test_rese_end_to_end.py || exit 1
        env:
          RESE_CORRELATION_ID: nightly-${{ github.run_id }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Include all other required env vars
          PHASE1_TIMEOUT_MS: 30000
          PHASE1_MAX_ASSUMPTIONS: 100
          PHASE1_MIN_ASSUMPTION_CONFIDENCE: 0.3
          PHASE1_CIRCUIT_BREAKER_THRESHOLD: 5
          PHASE1_ENABLE_TACIT_MINING: true
          PHASE1_ENABLE_RED_TEAM: true
          PHASE1_ENABLE_LEAN4_INTEGRATION: false
          PHASE2_TIMEOUT_MS: 60000
          PHASE2_IMECH_THRESHOLD: 0.7
          PHASE2_MAX_TARGET_DOMAINS: 10
          PHASE2_PATTERN_THRESHOLD: 0.6
          PHASE2_MAX_MAPPINGS: 50
          PHASE2_ENABLE_CONSTRAINT_INVERSION: true
          PHASE2_SEARCH_DEPTH: 5
          PHASE3_TIMEOUT_MS: 120000
          PHASE3_ITERATIONS: 1000
          PHASE3_UCB1_C: 1.41
          PHASE3_CONVERGENCE_THRESHOLD: 0.001
          PHASE3_ACI_WINDOW: 100
          PHASE3_SIG_THRESHOLD: 0.05
          PHASE3_PARALLEL_WORKERS: 4
          PHASE4_TIMEOUT_MS: 60000
          PHASE4_BEAM_WIDTH: 10
          PHASE4_VALIDATION_LEVEL: 1
          PHASE4_INTEGRATION_STRATEGY: balanced
          PHASE4_MIN_CONFIDENCE_THRESHOLD: 0.5
          LLTL_ENCODING_DIM: 128
          LLTL_DEFAULT_LOSS_TYPE: cross_entropy
          LLTL_CONTRADICTION_THRESHOLD: 0.3
          LLTL_TIMEOUT_MS: 3000
          OPENAI_MODEL: gpt-4
          REDIS_URL: redis://localhost:6379
          REDIS_KEY_TTL: 3600
          ENABLE_METRICS: true
          ENABLE_TRACING: false
          ENABLE_CIRCUIT_BREAKERS: true
          CIRCUIT_BREAKER_RESET_TIMEOUT_MS: 60000
          ENABLE_RETRY: true
          MAX_RETRY_ATTEMPTS: 3
          RETRY_BASE_DELAY_MS: 1000
          ENABLE_DLQ: true
          MAX_MEMORY_MB: 2048

      - name: Run all probes
        run: |
          echo "Running all probe tests..."
          find glue/adapters/rese-*/probes -name "*.sh" -exec chmod +x {} \;
          bash glue/adapters/rese-integration/probes/check_full_pipeline.sh || exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results
          path: |
            unit-test-results.xml
            coverage.xml
            htmlcov/
            END_TO_END_TEST_RESULTS.json
            *.log
          retention-days: 30

  # ============================================================================
  # Job 2: Performance Benchmarks
  # ============================================================================
  performance-benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pydantic-settings
          pip install pytest-benchmark memory-profiler

      - name: Run Phase I benchmark
        run: |
          python -c "
          import time
          import sys
          sys.path.insert(0, 'glue/adapters/rese-phase1/src')

          from phase1_executor import EpistemicAuditExecutor, Phase1Config
          from datetime import datetime, timezone

          print('Phase I Performance Benchmark')
          print('='*80)

          config = Phase1Config.from_env()
          executor = EpistemicAuditExecutor(config=config)

          # Test with varying problem sizes
          test_cases = [
              ('Small', 100, 10, 5),
              ('Medium', 500, 50, 25),
              ('Large', 1000, 100, 50)
          ]

          results = []
          for size, problem_len, patterns, max_assumptions in test_cases:
              start = time.time()
              # Simulate audit execution
              time.sleep(0.1)  # Placeholder
              elapsed = (time.time() - start) * 1000

              results.append({
                  'size': size,
                  'elapsed_ms': elapsed,
                  'throughput': patterns / (elapsed / 1000) if elapsed > 0 else 0
              })
              print(f'{size}: {elapsed:.2f}ms ({results[-1][\"throughput\"]:.2f} patterns/sec)')

          # Save results
          import json
          with open('phase1-benchmark.json', 'w') as f:
              json.dump({
                  'timestamp': datetime.now(timezone.utc).isoformat(),
                  'results': results
              }, f, indent=2)
          "

      - name: Run Phase II benchmark
        run: |
          python -c "
          import time
          import sys
          import json
          from datetime import datetime, timezone

          sys.path.insert(0, 'glue/adapters/rese-phase2/src')

          from phase2_executor import IsomorphicMappingExecutor

          print('Phase II Performance Benchmark')
          print('='*80)

          executor = IsomorphicMappingExecutor()

          test_cases = [
              ('Small', 5, 10),
              ('Medium', 10, 25),
              ('Large', 20, 50)
          ]

          results = []
          for size, domains, mappings in test_cases:
              start = time.time()
              # Simulate mapping execution
              time.sleep(0.1)  # Placeholder
              elapsed = (time.time() - start) * 1000

              results.append({
                  'size': size,
                  'elapsed_ms': elapsed,
                  'domains_per_sec': domains / (elapsed / 1000) if elapsed > 0 else 0
              })
              print(f'{size}: {elapsed:.2f}ms ({results[-1][\"domains_per_sec\"]:.2f} domains/sec)')

          with open('phase2-benchmark.json', 'w') as f:
              json.dump({
                  'timestamp': datetime.now(timezone.utc).isoformat(),
                  'results': results
              }, f, indent=2)
          "

      - name: Run Phase III benchmark
        run: |
          python -c "
          import time
          import sys
          import json
          from datetime import datetime, timezone

          sys.path.insert(0, 'glue/adapters/rese-phase3/src')

          from phase3_executor import MCTSSearchExecutor, Phase3Config

          print('Phase III Performance Benchmark')
          print('='*80)

          config = Phase3Config.from_env()
          executor = MCTSSearchExecutor(config=config)

          test_cases = [
              ('Small', 100),
              ('Medium', 1000),
              ('Large', 5000)
          ]

          results = []
          for size, iterations in test_cases:
              start = time.time()
              # Simulate MCTS execution
              time.sleep(0.1)  # Placeholder
              elapsed = (time.time() - start) * 1000

              results.append({
                  'size': size,
                  'iterations': iterations,
                  'elapsed_ms': elapsed,
                  'iterations_per_sec': iterations / (elapsed / 1000) if elapsed > 0 else 0
              })
              print(f'{size}: {elapsed:.2f}ms ({results[-1][\"iterations_per_sec\"]:.2f} iterations/sec)')

          with open('phase3-benchmark.json', 'w') as f:
              json.dump({
                  'timestamp': datetime.now(timezone.utc).isoformat(),
                  'results': results
              }, f, indent=2)
          "

      - name: Run Phase IV benchmark
        run: |
          python -c "
          import time
          import sys
          import json
          from datetime import datetime, timezone

          sys.path.insert(0, 'glue/adapters/rese-phase4/src')

          from phase4_executor import ArchitectureAssemblyExecutor, Phase4Config

          print('Phase IV Performance Benchmark')
          print('='*80)

          config = Phase4Config.from_env()
          executor = ArchitectureAssemblyExecutor(config=config)

          test_cases = [
              ('Simple', 10, 5),
              ('Moderate', 50, 25),
              ('Complex', 100, 50)
          ]

          results = []
          for size, beam_width, components in test_cases:
              start = time.time()
              # Simulate assembly execution
              time.sleep(0.1)  # Placeholder
              elapsed = (time.time() - start) * 1000

              results.append({
                  'size': size,
                  'elapsed_ms': elapsed,
                  'components_per_sec': components / (elapsed / 1000) if elapsed > 0 else 0
              })
              print(f'{size}: {elapsed:.2f}ms ({results[-1][\"components_per_sec\"]:.2f} components/sec)')

          with open('phase4-benchmark.json', 'w') as f:
              json.dump({
                  'timestamp': datetime.now(timezone.utc).isoformat(),
                  'results': results
              }, f, indent=2)
          "

      - name: Generate benchmark report
        run: |
          python -c "
          import json
          from pathlib import Path

          print('# RESE Performance Benchmark Report')
          print('')
          print(f'**Date:** $(date -u +\"%Y-%m-%dT%H:%M:%SZ\")')
          print('**Environment:** GitHub Actions (ubuntu-latest)')
          print('')
          print('## Phase Benchmarks')
          print('')

          for phase in ['phase1', 'phase2', 'phase3', 'phase4']:
              filename = f'{phase}-benchmark.json'
              if Path(filename).exists():
                  with open(filename) as f:
                      data = json.load(f)
                  print(f'### {phase.upper()}')
                  print('')
                  for result in data['results']:
                      print(f'- {result[\"size\"]}: {result[\"elapsed_ms\"]:.2f}ms')
                  print('')
          " > BENCHMARK_REPORT.md
          cat BENCHMARK_REPORT.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmarks
          path: |
            phase*-benchmark.json
            BENCHMARK_REPORT.md
          retention-days: 90

  # ============================================================================
  # Job 3: Security Scanning
  # ============================================================================
  security-scan:
    name: Comprehensive Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety safety-db
          pip install pip-audit

      - name: Run Bandit security linter
        run: |
          echo "Running Bandit..."
          bandit -r glue/adapters/rese-*/src/ \
                 -f json \
                 -o bandit-nightly.json \
                 -ll \
                 -x */tests/ || true

          # Generate human-readable report
          if [ -f bandit-nightly.json ]; then
            bandit -r glue/adapters/rese-*/src/ -ll -x */tests/ || true
          fi

      - name: Run Safety check
        run: |
          echo "Running Safety..."
          find glue/adapters/rese-*/ -name "requirements.txt" -exec cat {} \; > all-requirements.txt || true
          if [ -s all-requirements.txt ]; then
            safety check --json --output safety-nightly.json || true
            safety check || true
          else
            echo "No requirements files to check"
          fi

      - name: Run pip-audit
        run: |
          echo "Running pip-audit..."
          if [ -s all-requirements.txt ]; then
            pip-audit --desc --format json --output pip-audit-nightly.json || true
            pip-audit --desc || true
          fi

      - name: Check for secrets
        run: |
          echo "Scanning for secrets..."
          # Install trufflehog
          wget -qO - https://github.com/trufflesecurity/trufflehog/releases/latest/download/trufflehog_0.0.0_linux_amd64.tar.gz | tar -xzf -
          ./trufflehog filesystem --directory glue/adapters/rese-*/ --json || true

      - name: Generate security report
        run: |
          cat > SECURITY_REPORT.md << 'EOF'
          # RESE Security Scan Report

          **Scan Date:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Scan Type:** Comprehensive Nightly Security Scan

          ## Scan Results

          ### Bandit (Python Security Linter)
          - Report: bandit-nightly.json
          - Status: See attached artifacts

          ### Safety (Dependency Vulnerability Scanner)
          - Report: safety-nightly.json
          - Status: See attached artifacts

          ### pip-audit (Dependency Audit)
          - Report: pip-audit-nightly.json
          - Status: See attached artifacts

          ### TruffleHog (Secret Scanner)
          - Status: See attached artifacts

          ## Summary
          All security reports have been generated and archived.
          Please review the artifacts for detailed findings.

          EOF
          cat SECURITY_REPORT.md

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            bandit-nightly.json
            safety-nightly.json
            pip-audit-nightly.json
            SECURITY_REPORT.md
          retention-days: 90

  # ============================================================================
  # Job 4: Dependency Updates Check
  # ============================================================================
  dependency-check:
    name: Dependency Updates Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install pip-tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools pip-upgrade

      - name: Check for outdated dependencies
        run: |
          echo "Checking for outdated dependencies..."
          find glue/adapters/rese-*/ -name "requirements.txt" | while read req; do
            echo "Checking $req..."
            pip list --outdated --format=json || true
          done > outdated-deps.json || true

      - name: Generate dependency report
        run: |
          cat > DEPENDENCY_REPORT.md << 'EOF'
          # RESE Dependency Report

          **Report Date:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          ## Outdated Dependencies
          See outdated-deps.json for full details.

          ## Recommendations
          - Review outdated dependencies
          - Test updates in development environment
          - Update to stable versions only
          - Monitor breaking changes

          EOF
          cat DEPENDENCY_REPORT.md

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: |
            outdated-deps.json
            DEPENDENCY_REPORT.md
          retention-days: 30

  # ============================================================================
  # Job 5: Generate Nightly Summary
  # ============================================================================
  nightly-summary:
    name: Generate Nightly Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [full-test-suite, performance-benchmarks, security-scan, dependency-check]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate comprehensive summary
        run: |
          cat > NIGHTLY_SUMMARY.md << 'EOF'
          # RESE Framework - Nightly Build Summary

          **Date:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Run ID:** ${{ github.run_id }}
          **Commit:** ${{ github.sha }}

          ## Job Status

          | Job | Status | Duration |
          |-----|--------|----------|
          | Full Test Suite | ${{ needs.full-test-suite.result }} | ~60 min |
          | Performance Benchmarks | ${{ needs.performance-benchmarks.result }} | ~45 min |
          | Security Scan | ${{ needs.security-scan.result }} | ~30 min |
          | Dependency Check | ${{ needs.dependency-check.result }} | ~15 min |

          ## Test Results
          - Unit tests: See nightly-test-results artifact
          - Integration tests: See nightly-test-results artifact
          - Coverage report: See nightly-test-results artifact

          ## Performance Metrics
          - Phase benchmarks: See performance-benchmarks artifact
          - Benchmark trends: Compare with previous runs

          ## Security Findings
          - Bandit report: See security-scan-results artifact
          - Safety report: See security-scan-results artifact
          - pip-audit report: See security-scan-results artifact

          ## Dependencies
          - Outdated packages: See dependency-report artifact

          ## Action Items
          - Review failed tests
          - Address security vulnerabilities
          - Update outdated dependencies
          - Monitor performance trends

          ## Artifacts
          All reports and logs are available for 30-90 days.

          EOF
          cat NIGHTLY_SUMMARY.md

      - name: Upload nightly summary
        uses: actions/upload-artifact@v4
        with:
          name: nightly-summary
          path: NIGHTLY_SUMMARY.md
          retention-days: 90

      - name: Create issue on failure
        if: |
          needs.full-test-suite.result == 'failure' ||
          needs.security-scan.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('NIGHTLY_SUMMARY.md', 'utf8');

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly Build Failed - ${new Date().toISOString().split('T')[0]}`,
              body: summary,
              labels: ['nightly-build', 'bug', 'automated']
            });
