# =============================================================================
# OpenEvolve Pre-Commit Hooks Configuration
# =============================================================================
# This file defines git hooks that run automatically before each commit.
# These hooks ensure code quality and consistency.
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#
# Usage:
#   Run on all files: pre-commit run --all-files
#   Update hooks: pre-commit autoupdate
#   Skip hooks (temporary): git commit --no-verify -m "message"
# =============================================================================

repos:
  # ===========================================================================
  # General Hooks
  # ===========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^(node_modules/|.git/)

      - id: end-of-file-fixer
        exclude: ^(node_modules/|.git/)

      - id: check-yaml
        args: [--unsafe]
        exclude: ^(node_modules/)

      - id: check-toml
        exclude: ^(node_modules/)

      - id: check-json
        exclude: ^(node_modules/)

      - id: check-added-large-files
        args: ['--maxkb=1000']
        exclude: ^(node_modules/)

      - id: check-merge-conflict
        exclude: ^(node_modules/)

      - id: check-case-conflict
        exclude: ^(node_modules/)

      - id: detect-private-key
        exclude: ^(node_modules/)

      - id: mixed-line-ending
        args: ['--fix=lf']
        exclude: ^(node_modules/)

  # ===========================================================================
  # Python Hooks
  # ===========================================================================
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.10
        args: [--line-length=100]
        exclude: ^(node_modules/|\.git/)

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]
        exclude: ^(node_modules/|\.git/)

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [
          --max-line-length=100,
          --extend-ignore=E203,W503,
          --exclude=(node_modules,.git,build,dist)
        ]
        exclude: ^(node_modules/|\.git/)

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [
          --ignore-missing-imports,
          --no-strict-optional,
          --warn-unused-ignores,
        ]
        exclude: ^(node_modules/|\.git/|tests/|setup.py)
        additional_dependencies:
          - types-PyYAML
          - types-requests

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: [
          -c,
          pyproject.toml,
          --skip,
          "B101,B601",
        ]
        exclude: ^(node_modules/|\.git/|tests/)

  # ===========================================================================
  # JavaScript/TypeScript Hooks
  # ===========================================================================
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        types: [javascript, jsx, ts, tsx]
        args: [--fix]
        exclude: ^(node_modules/|\.git/)
        additional_dependencies:
          - eslint@8.56.0
          - "@typescript-eslint/eslint-plugin@6.19.0"
          - "@typescript-eslint/parser@6.19.0"

  # ===========================================================================
  # Docker Hooks
  # ===========================================================================
  - repo: https://github.com/AleksaC/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        args: [--ignore=DL3008, --ignore=DL3013]
        exclude: ^(node_modules/)

  # ===========================================================================
  # Shell Script Hooks
  # ===========================================================================
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        exclude: ^(node_modules/)

  # ===========================================================================
  # YAML Hooks
  # ===========================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-d, {extends: default, rules: {line-length: {max: 120}}}]
        exclude: ^(node_modules/)

  # ===========================================================================
  # Markdown Hooks
  # ===========================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: [--fix]
        exclude: ^(node_modules/)

# =============================================================================
# CI Configuration
# =============================================================================
# Pre-commit automatically runs in CI via GitHub Actions
# See .github/workflows/infrastructure-health.yml
# =============================================================================
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks
  autofix_prs: true
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
