syntax = "proto3";

package openevolve.grpc;

option go_package = "github.com/openevolve/grpc-go";
option java_package = "com.openevolve.grpc";
option csharp_namespace = "OpenEvolve.Grpc";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/any.proto";

// Common metadata for all requests
message RequestMetadata {
  string request_id = 1;
  string correlation_id = 2;
  google.protobuf.Timestamp timestamp = 3;
  string client_version = 4;
  map<string, string> headers = 5;
}

// Common metadata for all responses
message ResponseMetadata {
  string request_id = 1;
  string correlation_id = 2;
  google.protobuf.Timestamp timestamp = 3;
  int32 processing_time_ms = 4;
  string server_version = 5;
}

// Pagination parameters
message Pagination {
  int32 page = 1;
  int32 page_size = 2;
  string cursor = 3;
}

// Pagination info in responses
message PaginationInfo {
  int32 total_count = 1;
  int32 page = 2;
  int32 page_size = 3;
  bool has_next = 4;
  string next_cursor = 5;
}

// Health status for services
enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_HEALTHY = 1;
  HEALTH_STATUS_DEGRADED = 2;
  HEALTH_STATUS_UNHEALTHY = 3;
  HEALTH_STATUS_UNKNOWN = 4;
}

// Service health information
message ServiceHealth {
  string service_name = 1;
  HealthStatus status = 2;
  string message = 3;
  google.protobuf.Timestamp last_check = 4;
  int32 response_time_ms = 5;
  map<string, google.protobuf.Value> metrics = 6;
}

// Execution state for long-running operations
enum ExecutionState {
  EXECUTION_STATE_UNSPECIFIED = 0;
  EXECUTION_STATE_PENDING = 1;
  EXECUTION_STATE_RUNNING = 2;
  EXECUTION_STATE_PAUSED = 3;
  EXECUTION_STATE_COMPLETED = 4;
  EXECUTION_STATE_FAILED = 5;
  EXECUTION_STATE_CANCELLED = 6;
  EXECUTION_STATE_TIMEOUT = 7;
}

// Progress information for streaming operations
message Progress {
  int32 percent = 1;  // 0-100
  string message = 2;
  string stage = 3;
  google.protobuf.Timestamp timestamp = 4;
  map<string, google.protobuf.Value> metrics = 5;
}

// Structured error information
message ErrorDetails {
  string error_code = 1;
  string message = 2;
  string stack_trace = 3;
  map<string, google.protobuf.Value> context = 4;
  bool retryable = 5;
  int32 retry_after_seconds = 6;
}

// Empty request/response for simple operations
message Empty {}

// Version information
message VersionInfo {
  string version = 1;
  string commit_hash = 2;
  string build_date = 3;
  map<string, string> dependencies = 4;
}
