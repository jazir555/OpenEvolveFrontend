# Cloud-Specific Configurations
cloud_development:
  extends: development
  strategies:
    direct:
      timeout_ms: 45000  # 1.5x for cloud latency
    mdap_light:
      timeout_ms: 90000
    mdap_medium:
      timeout_ms: 135000
    maker_full:
