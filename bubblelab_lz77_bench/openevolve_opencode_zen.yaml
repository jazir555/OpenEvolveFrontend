llm:
  api_base: "https://opencode.ai/zen/v1"
  api_key: "${OPENCODE_API_KEY}"
  primary_model: "muse-spark-1.3-contributor-free"
  secondary_model: "muse-spark-1.3-contributor-free"
  models:
    - name: "muse-spark-1.3-contributor-free"
      weight: 1.0
      provider: "openai"
      extra_headers:
        X-Session-ID: "openevolve-session"
        User-Agent: "opencode/0.0.55"
        X-OpenCode-Version: "0.0.55"
    - name: "muse-spark-1.3-contributor-free"
      weight: 1.0
      provider: "openai"
      extra_headers:
        X-Session-ID: "openevolve-session"
        User-Agent: "opencode/0.0.55"
        X-OpenCode-Version: "0.0.55"
  temperature: 0.7
  max_tokens: 4096
  random_seed: 42

database:
  path: "openevolve_output/openevolve.db"

evaluator:
  timeout: 60

checkpoint:
  interval: 10