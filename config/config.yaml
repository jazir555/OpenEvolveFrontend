default:
  openevolve_base_url: "http://localhost:8000"
  openevolve_api_key: "your-api-key"
  model_name: "gpt-4"
  api_base: "https://api.openai.com/v1"
  temperature: 0.7
  top_p: 0.95
  max_tokens: 4096
  max_iterations: 100
  population_size: 10
  num_islands: 1
  migration_interval: 50
  migration_rate: 0.1
  archive_size: 100
  elite_ratio: 0.1
  exploration_ratio: 0.2
  exploitation_ratio: 0.7
  checkpoint_interval: 10
  language: "python"
  file_suffix: ".py"
  reasoning_effort: "medium"
  feature_dimensions: ["complexity", "diversity"]
  feature_bins: 10
  diversity_metric: "edit_distance"
  frequency_penalty: 0.0
  presence_penalty: 0.0
  seed: 42

  # Lean 4 / LeanAide Configuration
  lean_aide:
    enabled: true
    lean_executable: "lean"
    lake_executable: "lake"
    auto_verify_proofs: true
    verification_depth: 100
    timeout_seconds: 120.0
    mathlib_path: null  # Auto-detected if null
    mathlib_auto_detect: true
    domains:
      - "mathlib"
      - "analysis"
      - "algebra"
      - "topology"
      - "number_theory"
    stage_3c_enabled: true
    stage_5_enabled: true
    server_host: "localhost"
    server_port: 7654
    server_auto_start: true
    enable_caching: true
    cache_ttl_seconds: 3600
    max_concurrent_requests: 4
    memory_limit_mb: 4096

  performance_optimization:
    caching:
      enabled: true
      cache_dir: "./llm_cache"
      ttl_hours: 24
      max_cache_size_mb: 100
    parallelization:
      enabled: true
      max_workers: 8
    async_processing:
      enabled: true
      max_concurrent_tasks: 100
    memory_management:
      enabled: true
      max_pool_size: 100
      memory_threshold_mb: 100
      gc_frequency: 10

  reliability:
    retry:
      enabled: true
      max_attempts: 3
      initial_delay: 1.0
      max_delay: 60.0
      exponential_base: 2.0
      jitter: true
    circuit_breaker:
      enabled: true
      failure_threshold: 5
      timeout: 60.0
    rate_limiter:
      enabled: true
      max_requests: 10
      time_window: 60.0

production:
  openevolve_base_url: "https://api.openevolve.com"
  openevolve_api_key: "your-production-api-key"
  
  lean_aide:
    enabled: true
    auto_verify_proofs: true
    verification_depth: 200
    timeout_seconds: 300.0
    server_auto_start: false  # Assume production server is manually managed
    enable_caching: true
    cache_ttl_seconds: 7200
    max_concurrent_requests: 8

staging:
  openevolve_base_url: "https://staging.openevolve.com"
  openevolve_api_key: "your-staging-api-key"
  
  lean_aide:
    enabled: true
    auto_verify_proofs: true
    verification_depth: 150
    timeout_seconds: 180.0
    server_auto_start: true

development:
  lean_aide:
    enabled: true
    auto_verify_proofs: true
    verification_depth: 50
    timeout_seconds: 60.0
    server_auto_start: true
    enable_caching: false  # Disable caching in dev for faster iteration

testing:
  lean_aide:
    enabled: true
    auto_verify_proofs: false  # Skip verification in tests for speed
    verification_depth: 10
    timeout_seconds: 30.0
    server_auto_start: false
    enable_caching: false
