# Aggressive Profile - Favor cost over quality
# Use higher thresholds to save more on API costs

classifier:
  embedding_model: "all-MiniLM-L6-v2"
  feature_weights:
    text_length: 0.3  # Higher weight on text length
    domain_rarity: 0.1
    depth: 0.2
    historical_error: 0.1
    dependency: 0.3  # Higher weight on dependencies
  cache_dir: ".cache/adaptive_mdap"
  cache_ttl_hours: 24

allocator:
  # Higher thresholds = more aggressive
  # More problems will use DIRECT or MDAP_LIGHT
  thresholds: [0.4, 0.8]
  enable_learning: false
  default_strategy: "mdap_light"  # Fallback to lighter strategy

strategies:
  direct:
    n_agents: 1
    k_ahead: 0
    max_retries: 1
    timeout_ms: 20000  # Shorter timeout
  
  mdap_light:
    n_agents: 3
    k_ahead: 1
    max_retries: 2
    timeout_ms: 40000  # Shorter timeout
  
  maker_full:
    n_agents: 5
    k_ahead: 2
    max_retries: 3
    timeout_ms: 90000  # Shorter timeout

monitoring:
  enabled: true
  metrics_export_format: "json"
  log_level: "INFO"
  enable_structured_logging: true
