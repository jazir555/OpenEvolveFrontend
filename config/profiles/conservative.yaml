# Conservative Profile - Favor quality over cost
# Use lower thresholds to be more conservative with resource allocation

classifier:
  embedding_model: "all-MiniLM-L6-v2"
  feature_weights:
    text_length: 0.2
    domain_rarity: 0.2
    depth: 0.2
    historical_error: 0.3  # Higher weight on historical errors
    dependency: 0.1
  cache_dir: ".cache/adaptive_mdap"
  cache_ttl_hours: 24

allocator:
  # Lower thresholds = more conservative
  # More problems will use MAKER_FULL
  thresholds: [0.2, 0.5]
  enable_learning: false
  default_strategy: "maker_full"

strategies:
  direct:
    n_agents: 1
    k_ahead: 0
    max_retries: 1
    timeout_ms: 30000
  
  mdap_light:
    n_agents: 3
    k_ahead: 1
    max_retries: 2
    timeout_ms: 60000
  
  maker_full:
    n_agents: 5
    k_ahead: 3  # Higher k for more voting
    max_retries: 3
    timeout_ms: 180000  # Longer timeout

monitoring:
  enabled: true
  metrics_export_format: "json"
  log_level: "INFO"
  enable_structured_logging: true
