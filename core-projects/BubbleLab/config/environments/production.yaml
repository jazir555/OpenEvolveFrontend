################################################################################
# OpenEvolve BubbleLab Integration - Production Environment Configuration
################################################################################
# This file contains all configuration parameters for the production environment.
# Following the LAW OF CONFIGURATION EXPLICITNESS: no magic defaults allowed.
#
# ENVIRONMENT: Production
# LAST_UPDATED: 2026-01-17T00:00:00Z
# VERSION: 1.0.0
#
# CRITICAL: All environment variables MUST be provided. The application will
# fail to start if any required variable is missing.
################################################################################

# =============================================================================
# ENVIRONMENT METADATA
# =============================================================================
environment:
  name: production
  short_name: prod
  description: "Production environment with maximum performance and security"
  timezone: UTC
  debug_mode: false
  log_level: warn

# =============================================================================
# OPENEVOLVE API ENDPOINTS
# =============================================================================
openevolve:
  # Core API
  api_base_url: "${OPENEVOLVE_API_URL}"  # REQUIRED
  api_version: v1
  api_timeout_ms: 30000
  api_retries: 3
  api_retry_delay_ms: 1000

  # Service-specific endpoints
  services:
    # LeanAide Continuous Math Service
    leanaide_continuous:
      base_url: "${LEANAIDE_CONTINUOUS_URL}"
      health_check: "${LEANAIDE_CONTINUOUS_URL}/health"
      timeout_ms: 45000
      enabled: true

    # LeanAide Client (Formal Verification)
    leanaide_client:
      base_url: "${LEANAIDE_CLIENT_URL}"
      health_check: "${LEANAIDE_CLIENT_URL}/health"
      timeout_ms: 60000
      enabled: true

    # Knowledge Engine
    knowledge_engine:
      base_url: "${KNOWLEDGE_ENGINE_URL}"
      health_check: "${KNOWLEDGE_ENGINE_URL}/health"
      timeout_ms: 30000
      enabled: true
      indexer_url: "${KNOWLEDGE_ENGINE_URL}/indexer"
      query_url: "${KNOWLEDGE_ENGINE_URL}/query"

    # ACE MCP Tools (Advanced Code Evolution)
    ace_mcp_tools:
      base_url: "${ACE_MCP_TOOLS_URL}"
      health_check: "${ACE_MCP_TOOLS_URL}/health"
      timeout_ms: 30000
      enabled: true

    # Decomposition Engine
    decomposition_engine:
      base_url: "${DECOMPOSITION_ENGINE_URL}"
      health_check: "${DECOMPOSITION_ENGINE_URL}/health"
      timeout_ms: 60000
      enabled: true

    # Adversarial Testing System
    adversarial_testing:
      base_url: "${ADVERSARIAL_TESTING_URL}"
      health_check: "${ADVERSARIAL_TESTING_URL}/health"
      timeout_ms: 120000
      enabled: true

    # Evolutionary Optimization
    evolutionary_optimization:
      base_url: "${EVOLUTIONARY_OPTIMIZATION_URL}"
      health_check: "${EVOLUTIONARY_OPTIMIZATION_URL}/health"
      timeout_ms: 90000
      enabled: true

    # MDAP Engine (Multi-Domain Adaptive Planning)
    mdap_engine:
      base_url: "${MDAP_ENGINE_URL}"
      health_check: "${MDAP_ENGINE_URL}/health"
      timeout_ms: 60000
      enabled: true

    # Maker Engine (Invention Planning)
    maker_engine:
      base_url: "${MAKER_ENGINE_URL}"
      health_check: "${MAKER_ENGINE_URL}/health"
      timeout_ms: 90000
      enabled: true

    # Hybrid Maker Integration
    hybrid_maker:
      base_url: "${HYBRID_MAKER_URL}"
      health_check: "${HYBRID_MAKER_URL}/health"
      timeout_ms: 90000
      enabled: true

    # ROMA (Read-Only Memory Architecture)
    roma:
      base_url: "${ROMA_URL}"
      health_check: "${ROMA_URL}/health"
      timeout_ms: 30000
      enabled: true

    # CrewAI Integration (Delegation System)
    crewai:
      base_url: "${CREWAI_URL}"
      health_check: "${CREWAI_URL}/health"
      timeout_ms: 45000
      enabled: true
      mcp_server_url: "${CREWAI_URL}/mcp"

    # Generic Knowledge Extraction
    generic_ke:
      base_url: "${GENERIC_KE_URL}"
      health_check: "${GENERIC_KE_URL}/health"
      timeout_ms: 60000
      enabled: true

    # FRM (Formal Reasoning Mode)
    frm:
      base_url: "${FRM_URL}"
      health_check: "${FRM_URL}/health"
      timeout_ms: 120000
      enabled: true

    # Research Quest
    research_quest:
      base_url: "${RESEARCH_QUEST_URL}"
      health_check: "${RESEARCH_QUEST_URL}/health"
      timeout_ms: 45000
      enabled: true

    # DeepKE Integration
    deepke:
      base_url: "${DEEPKE_URL}"
      health_check: "${DEEPKE_URL}/health"
      timeout_ms: 60000
      enabled: true

    # End-to-End Invention
    e2e_invention:
      base_url: "${E2E_INVENTION_URL}"
      health_check: "${E2E_INVENTION_URL}/health"
      timeout_ms: 120000
      enabled: true

    # RAGBits Document Processor
    ragbits:
      base_url: "${RAGBITS_URL}"
      health_check: "${RAGBITS_URL}/health"
      timeout_ms: 45000
      enabled: true

    # RESE (Rare and Subtle Events)
    rese:
      base_url: "${RESE_URL}"
      health_check: "${RESE_URL}/health"
      timeout_ms: 60000
      enabled: true

    # Neural KG (Knowledge Graph)
    neural_kg:
      base_url: "${NEURAL_KG_URL}"
      health_check: "${NEURAL_KG_URL}/health"
      timeout_ms: 45000
      enabled: true

# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================
database:
  # Primary Database (BubbleLab)
  primary:
    type: postgres
    connection_string: "${DATABASE_URL}"  # REQUIRED
    pool_size: 50
    timeout_seconds: 30
    enable_foreign_keys: true
    ssl_mode: require

  # Knowledge Graph Database
  knowledge_graph:
    type: postgres
    connection_string: "${KNOWLEDGE_GRAPH_DATABASE_URL}"  # REQUIRED
    pool_size: 50
    timeout_seconds: 30
    ssl_mode: require

  # Cache Database
  cache:
    type: redis
    connection_string: "${REDIS_URL}"  # REQUIRED
    pool_size: 50
    timeout_seconds: 5
    default_ttl_seconds: 3600
    ssl_enabled: true

  # Analytics Database
  analytics:
    type: postgres
    connection_string: "${ANALYTICS_DATABASE_URL}"  # REQUIRED
    pool_size: 20
    timeout_seconds: 30
    ssl_mode: require

# =============================================================================
# AUTHENTICATION & AUTHORIZATION
# =============================================================================
authentication:
  # Clerk Authentication
  clerk:
    enabled: true  # REQUIRED in production
    publishable_key: "${CLERK_PUBLISHABLE_KEY}"  # REQUIRED
    secret_key: "${CLERK_SECRET_KEY}"  # REQUIRED
    issuer_dev: "${CLERK_ISSUER_DEV}"
    issuer_prod: "${CLERK_ISSUER_PROD}"  # REQUIRED
    jwt_expiry_seconds: 86400

  # API Keys
  api_keys:
    enable_api_key_auth: true
    header_name: X-API-Key
    validation_enabled: true

  # OAuth2 Integration
  oauth:
    google:
      enabled: true
      client_id: "${GOOGLE_OAUTH_CLIENT_ID}"  # REQUIRED
      client_secret: "${GOOGLE_OAUTH_CLIENT_SECRET}"  # REQUIRED
      redirect_uri: "${APP_BASE_URL}/auth/google/callback"  # REQUIRED
      scopes:
        - openid
        - profile
        - email

# =============================================================================
# WORKFLOW CONFIGURATION
# =============================================================================
workflow:
  # Execution Settings
  execution:
    max_concurrent_workflows: 20
    timeout_seconds: 1200
    retry_max_attempts: 3
    retry_delay_seconds: 30
    heartbeat_interval_seconds: 120

  # Bubble Flow Settings
  bubble_flow:
    max_bubbles_per_flow: 200
    max_connections_per_bubble: 100
    validation_strict_mode: true
    enable_auto_save: true
    auto_save_interval_seconds: 120

  # Template System
  templates:
    enabled: true
    cache_enabled: true
    auto_update_check: true
    custom_templates_path: ./config/templates

# =============================================================================
# LEANAIDE CONFIGURATION (37 params)
# =============================================================================
leanaide:
  # Continuous Math (10 params)
  continuous_math:
    enabled: true
    ode_detection_threshold: 0.90
    pde_detection_threshold: 0.85
    integration_method: adaptive
    step_size: 0.001
    max_iterations: 10000
    tolerance: 1e-8
    cache_results: true
    cache_ttl_seconds: 7200
    parallel_processing: true

  # MCTS/MDAP (15 params)
  mcts_mdap:
    enabled: true
    simulations_per_step: 5000
    exploration_weight: 1.41
    depth_limit: 20
    rollout_depth: 10
    discount_factor: 0.99
    learning_rate: 0.001
    batch_size: 64
    memory_size: 100000
    target_network_update_freq: 1000
    warmup_steps: 10000
    save_replay_buffer: true
    replay_buffer_path: /data/openevolve/replay_buffer
    enable_gpu: true
    gpu_device: 0

  # Red Flagging (8 params)
  red_flagging:
    enabled: true
    confidence_threshold: 0.85
    check_mathematical_validity: true
    check_logical_consistency: true
    check_formal_correctness: true
    auto_fix_attempts: 5
    generate_explanations: true
    severity_levels: critical, high, medium, low

  # Client Integration (4 params)
  client:
    timeout_seconds: 300
    max_retries: 10
    lean_path: /usr/local/bin/lean
    workspace_path: /data/openevolve/lean_workspace

# =============================================================================
# KNOWLEDGE ENGINE CONFIGURATION (42 params)
# =============================================================================
knowledge_engine:
  # Core Settings (8 params)
  core:
    enabled: true
    embedding_model: text-embedding-3-large
    embedding_dimension: 3072
    max_chunk_size: 2000
    chunk_overlap: 400
    batch_size: 50
    parallel_processing: true
    cache_embeddings: true

  # Indexer (12 params)
  indexer:
    enabled: true
    update_interval_seconds: 1800
    incremental_indexing: true
    index_type: hierarchical
    vector_index_type: hnsw
    hnsw_m: 32
    hnsw_ef_construction: 400
    hnsw_ef_search: 100
    compression_level: high
    deduplication_enabled: true
    dedup_threshold: 0.98
    index_persistence_path: /data/openevolve/indexes

  # Query Engine (10 params)
  query:
    enabled: true
    max_results: 50
    similarity_threshold: 0.80
    reranking_enabled: true
    reranking_model: cross-encoder-large
    hybrid_search_alpha: 0.5
    context_window: 20
    citation_enabled: true
    query_cache_enabled: true
    query_cache_ttl_seconds: 7200

  # Knowledge Artifacts (12 params)
  artifacts:
    enabled: true
    artifact_types:
      - code_snippet
      - theorem
      - proof
      - definition
      - example
      - counterexample
    version_control: true
    max_versions_per_artifact: 50
    artifact_ttl_days: 1825  # 5 years
    relation_extraction: true
    relation_types:
      - depends_on
      - refines
      - contradicts
      - generalizes
    storage_backend: s3
    storage_path: "${ARTIFACTS_S3_BUCKET}"
    backup_enabled: true
    backup_interval_hours: 6

# =============================================================================
# DECOMPOSITION ENGINE CONFIGURATION (28 params)
# =============================================================================
decomposition:
  # Core Settings (10 params)
  core:
    enabled: true
    max_decomposition_depth: 10
    min_task_size: 5
    max_task_size: 240
    parallelism: 16
    strategy: adaptive
    quality_threshold: 0.90
    enable_caching: true
    cache_ttl_seconds: 7200
    checkpoint_interval: 1000

  # Task Analysis (8 params)
  task_analysis:
    complexity_metric: combined
    dependency_detection: true
    circular_dependency_check: true
    prerequisite_detection: true
    effort_estimation_method: ml
    risk_analysis: true
    priority_weighting: quality
    domain_detection: true

  # CrewAI Integration (10 params)
  crewai:
    enabled: true
    mcp_server_url: "${CREWAI_URL}/mcp"
    delegation_timeout_seconds: 600
    max_parallel_delegations: 20
    retry_on_failure: true
    max_retries: 5
    heartbeat_interval_seconds: 60
    result_validation: true
    result_cache_enabled: true
    result_cache_ttl_seconds: 3600
    fallback_to_local: false

# =============================================================================
# ADVERSARIAL TESTING CONFIGURATION (35 params)
# =============================================================================
adversarial:
  # Core Settings (8 params)
  core:
    enabled: true
    test_suite_size: 10000
    max_iterations: 50000
    convergence_threshold: 0.98
    diversity_metric: entropy
    random_seed: null  # No fixed seed in production
    parallel_execution: true
    save_test_cases: true
    test_output_path: /data/openevolve/adversarial_tests

  # Evolutionary Settings (12 params)
  evolutionary:
    population_size: 500
    generations: 100
    mutation_rate: 0.15
    crossover_rate: 0.75
    selection_method: tournament
    tournament_size: 5
    elitism_count: 10
    fitness_function: combined
    adaptive_mutation: true
    crossover_method: uniform
    niching_enabled: true
    niche_radius: 0.05

  # MDAP Integration (15 params)
  mdap:
    enabled: true
    coevolution: true
    domain_count: 10
    domain_mutation_rate: 0.03
    knowledge_transfer: true
    transfer_learning_rate: 0.2
    multi_objective_optimization: true
    objectives:
      - maximize_coverage
      - minimize_false_positives
      - maximize_diversity
    pareto_front_size: 50
    adaptive_domains: true
    domain_merge_threshold: 0.85
    domain_split_threshold: 0.4
    knowledge_graph_integration: true
    kg_similarity_threshold: 0.75

# =============================================================================
# EVOLUTIONARY OPTIMIZATION CONFIGURATION (32 params)
# =============================================================================
evolutionary:
  # Core Settings (10 params)
  core:
    enabled: true
    algorithm: nsga2
    population_size: 500
    generations: 200
    convergence_threshold: 1e-8
    random_seed: null
    parallel_evaluation: true
    checkpoint_interval: 50
    checkpoint_path: /data/openevolve/evolution_checkpoints
    log_population_statistics: true

  # Genetic Operators (10 params)
  operators:
    mutation_type: adaptive
    mutation_rate: 0.15
    mutation_strength: 0.3
    crossover_type: simulated_binary
    crossover_rate: 0.85
    crossover_distribution_index: 20
    selection_type: tournament
    tournament_size: 5
    elitism_count: 10
    adaptive_operators: true

  # MDP Integration (12 params)
  mdp:
    enabled: true
    state_representation: feature_vector
    action_space: continuous
    reward_shaping: true
    discount_factor: 0.995
    planning_horizon: 20
    value_iteration_method: policy_iteration
    convergence_tolerance: 1e-6
    max_iterations: 10000
    enable_gpu: true
    batch_planning: true
    batch_size: 500
    parallel_rollouts: 16

# =============================================================================
# MAKER ENGINE CONFIGURATION (38 params)
# =============================================================================
maker:
  # Core Settings (10 params)
  core:
    enabled: true
    planning_horizon: 30
    max_inventions: 10000
    creativity_threshold: 0.85
    novelty_metric: combined
    random_seed: null
    parallel_invention: true
    save_inventions: true
    invention_path: /data/openevolve/inventions
    enable_caching: true
    cache_ttl_seconds: 14400

  # Problem Analysis (10 params)
  problem_analysis:
    domain_detection: true
    difficulty_estimation: true
    constraint_detection: true
    objective_extraction: true
    requirement_analysis: true
    stakeholder_analysis: true
    context_analysis: true
    feasibility_check: true
    impact_assessment: true
    risk_analysis: true

  # Solution Generation (10 params)
  solution_generation:
    method: hybrid
    brainstorming_enabled: true
    analogical_reasoning: true
    cross_domain_inspiration: true
    constraint_satisfaction: true
    multi_objective: true
    pareto_optimization: true
    solution_diversity: true
    novelty_enforcement: true
    practicality_filter: true

  # Evaluation (8 params)
  evaluation:
    criteria_count: 20
    weighting_method: hybrid
    feasibility_weight: 0.3
    novelty_weight: 0.3
    impact_weight: 0.2
    practicality_weight: 0.2
    peer_review_enabled: true
    automated_testing: true
    user_feedback_integration: true

# =============================================================================
# MDAP ENGINE CONFIGURATION (44 params)
# =============================================================================
mdap:
  # Core Settings (10 params)
  core:
    enabled: true
    domain_count: 20
    adaptive_domains: true
    domain_merge_threshold: 0.85
    domain_split_threshold: 0.35
    min_domain_size: 50
    max_domain_size: 500
    knowledge_transfer: true
    transfer_learning_rate: 0.2
    parallel_domains: true
    checkpoint_interval: 500

  # Multi-Objective Optimization (12 params)
  optimization:
    objectives:
      - maximize_quality
      - minimize_time
      - minimize_cost
      - maximize_reliability
    pareto_front_size: 100
    dominance_method: pareto
    preference_elicitation: active
    aggregation_method: tchebycheff
    normalization_method: vector
    constraint_handling: stochastic
    penalty_coefficient: 10000
    convergence_tolerance: 1e-8
    max_iterations: 10000
    adaptive_weights: true

  # Coevolution (10 params)
  coevolution:
    enabled: true
    coevolution_type: mixed
    population_ratio: 1.0
    fitness_sharing: true
    sharing_sigma: 0.05
    niche_count: 20
    partner_selection: fitness_based
    tournament_size: 7
    collaboration_protocol: nash
    evaluation_interval: 20
    knowledge_graph_guided: true

  # Knowledge Integration (12 params)
  knowledge:
    knowledge_graph_enabled: true
    graph_embedding: true
    embedding_model: gcn
    embedding_dimension: 512
    walk_length: 160
    walks_per_node: 40
    context_size: 20
    semantic_similarity: true
    similarity_threshold: 0.75
    knowledge_reuse: true
    reuse_strategy: hybrid
    knowledge_decay: true
    decay_rate: 0.98

# =============================================================================
# ROMA CONFIGURATION (18 params)
# =============================================================================
roma:
  # Core Settings (8 params)
  core:
    enabled: true
    architecture: event_sourcing
    event_store_type: postgres
    query_model_enabled: true
    materialized_view: true
    view_update_strategy: async
    snapshot_interval: 10000
    snapshot_compression: true

  # Read Optimization (5 params)
  read_optimization:
    cache_enabled: true
    cache_type: redis
    cache_ttl_seconds: 7200
    query_optimization: true
    index_hints_enabled: true

  # Event Sourcing (5 params)
  event_sourcing:
    event_versioning: true
    event_validation: true
    event_schema_validation: strict
    event_replay_enabled: true
    event_replay_parallel: true

# =============================================================================
# CREDENTIAL MANAGEMENT
# =============================================================================
credentials:
  # Encryption Settings
  encryption:
    algorithm: AES-256-GCM
    key_length: 32
    key_derivation: PBKDF2
    iterations: 1000000
    salt_length: 32

  # Storage
  storage:
    backend: aws_secrets_manager  # Using AWS Secrets Manager in production
    connection_string: "${AWS_SECRETS_MANAGER_ENDPOINT}"
    encryption_enabled: true
    backup_enabled: true
    backup_path: "${CREDENTIALS_BACKUP_S3_BUCKET}"
    backup_retention_days: 90

  # Validation
  validation:
    validate_on_load: true
    validate_periodically: true
    validation_interval_hours: 6
    strict_validation: true

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================
logging:
  # Log Levels
  levels:
    root: error
    api: warn
    workflow: warn
    database: error
    integration: warn

  # Log Format
  format: json
  include_timestamp: true
  include_level: true
  include_correlation_id: true
  include_stack_trace: false

  # Log Outputs
  outputs:
    - type: console
      enabled: false
      colorize: false
    - type: file
      enabled: true
      path: /var/log/openevolve/openevolve.log
      rotation: daily
      retention_days: 90
      max_size_mb: 1000
    - type: cloudwatch
      enabled: true
      log_group: "${AWS_CLOUDWATCH_LOG_GROUP}"
      log_stream: "${AWS_CLOUDWATCH_LOG_STREAM}"
      region: "${AWS_REGION}"

  # Structured Logging
  structured:
    service_name: openevolve-bubblelab
    environment: production
    enable_performance_logging: true
    enable_access_logging: true
    enable_error_logging: true
    correlation_id_header: X-Correlation-ID

# =============================================================================
# MONITORING & METRICS
# =============================================================================
monitoring:
  # Metrics Collection
  metrics:
    enabled: true
    provider: cloudwatch  # Using AWS CloudWatch
    port: 9090
    path: /metrics
    interval_seconds: 60

  # Health Checks
  health_checks:
    enabled: true
    endpoint: /health
    check_interval_seconds: 30
    timeout_seconds: 10
    detailed_results: false

  # Performance Monitoring
  performance:
    enabled: true
    trace_requests: true
    sampling_rate: 0.01  # 1% sampling in production
    slow_query_threshold_ms: 10000
    profile_memory: false
    memory_interval_seconds: 600

  # Alerting
  alerting:
    enabled: true
    webhook_url: "${ALERT_WEBHOOK_URL}"  # REQUIRED
    alert_on_errors: true
    alert_on_slow_queries: true
    alert_on_high_memory: true
    alert_on_circuit_breaker: true
    alert_on_auth_failures: true

# =============================================================================
# RATE LIMITING
# =============================================================================
rate_limiting:
  # API Rate Limiting
  api:
    enabled: true  # REQUIRED in production
    requests_per_minute: "${RATE_LIMIT_RPM}"  # REQUIRED
    burst_size: "${RATE_LIMIT_BURST}"  # REQUIRED
    storage: redis

  # Workflow Rate Limiting
  workflow:
    enabled: true
    max_concurrent_per_user: 20
    queue_size: 1000
    timeout_seconds: 1200

  # Service-Specific Limits
  service_limits:
    leanaide_continuous:
      requests_per_minute: 120
    knowledge_engine:
      requests_per_minute: 300
    decomposition_engine:
      requests_per_minute: 60
    adversarial_testing:
      requests_per_minute: 20
    maker_engine:
      requests_per_minute: 40

# =============================================================================
# CIRCUIT BREAKER SETTINGS
# =============================================================================
circuit_breaker:
  # Global Settings
  enabled: true
  failure_threshold: 10
  success_threshold: 3
  timeout_seconds: 120
  half_open_max_calls: 5

  # Service-Specific Breakers
  services:
    leanaide_continuous:
      enabled: true
      failure_threshold: 10
      timeout_seconds: 120
    knowledge_engine:
      enabled: true
      failure_threshold: 10
      timeout_seconds: 120
    decomposition_engine:
      enabled: true
      failure_threshold: 10
      timeout_seconds: 120
    adversarial_testing:
      enabled: true
      failure_threshold: 5
      timeout_seconds: 240

# =============================================================================
# FEATURE FLAGS
# =============================================================================
features:
  # Core Features
  workflow_automation: true
  template_system: true
  credential_management: true
  api_access: true

  # OpenEvolve Integrations
  leanaide_integration: true
  knowledge_engine_integration: true
  decomposition_integration: true
  adversarial_testing_integration: true
  evolutionary_optimization_integration: true
  mdap_integration: true
  maker_integration: true
  roma_integration: true
  crewai_integration: true

  # Experimental Features
  experimental_features: false
  beta_features: false
  debug_mode: false
  verbose_logging: false

  # Performance Features
  caching: true
  parallel_processing: true
  batch_processing: true

# =============================================================================
# TIMEZONE & DATE/TIME SETTINGS
# =============================================================================
datetime:
  timezone: UTC
  date_format: ISO-8601
  time_format: ISO-8601
  parse_strict: true
  convert_to_utc: true
  dst_handling: fail

# =============================================================================
# CACHE CONFIGURATION
# =============================================================================
cache:
  # Local Cache
  local:
    enabled: true
    type: lru
    max_size_mb: 2000
    ttl_seconds: 7200
    cleanup_interval_seconds: 600

  # Distributed Cache
  distributed:
    enabled: true
    type: redis
    connection_string: "${REDIS_URL}"
    ttl_seconds: 7200
    key_prefix: "openevolve:production:"

  # Cache Strategies
  strategies:
    workflow_results: true
    api_responses: true
    knowledge_embeddings: true
    decomposition_results: true
    maker_inventions: true

# =============================================================================
# BACKGROUND PROCESSING
# =============================================================================
background:
  # Job Queue
  queue:
    enabled: true
    type: bull
    max_concurrent_jobs: 50
    job_timeout_seconds: 1200
    retry_attempts: 5
    retry_delay_seconds: 120

  # Scheduled Tasks
  scheduled:
    enabled: true
    timezone: UTC
    tasks:
      - name: cache_cleanup
        schedule: "0 */6 * * *"
        enabled: true
      - name: log_rotation
        schedule: "0 0 * * *"
        enabled: true
      - name: metrics_flush
        schedule: "*/15 * * * *"
        enabled: true
      - name: health_check
        schedule: "* * * * *"
        enabled: true
      - name: backup_credentials
        schedule: "0 0 * * 0"  # Weekly
        enabled: true

# =============================================================================
# API RATE LIMITS & QUOTAS
# =============================================================================
quotas:
  # User Quotas
  user:
    max_workflows_per_day: "${USER_WORKFLOW_QUOTA}"  # REQUIRED
    max_api_calls_per_day: "${USER_API_QUOTA}"  # REQUIRED
    max_storage_mb: "${USER_STORAGE_QUOTA_MB}"  # REQUIRED

  # System Quotas
  system:
    max_concurrent_requests: 500
    max_request_size_mb: 500
    max_response_size_mb: 500
    max_execution_time_seconds: 1800

# =============================================================================
# TESTING CONFIGURATION
# =============================================================================
testing:
  # Test Settings
  enabled: false  # Disabled in production
  test_mode: false
  mock_external_services: false
  use_test_database: false
  test_database_connection: ""

  # Test Data
  generate_test_data: false
  test_data_size: small
  seed_random: false
  random_seed: null

  # Coverage
  coverage_threshold: 95
  coverage_report: false
  coverage_report_path: ./coverage

# =============================================================================
# SECURITY SETTINGS (Production)
# =============================================================================
security:
  # TLS/SSL
  tls_enabled: true
  tls_cert_path: "${TLS_CERT_PATH}"  # REQUIRED
  tls_key_path: "${TLS_KEY_PATH}"  # REQUIRED
  tls_ca_path: "${TLS_CA_PATH}"  # REQUIRED
  tls_min_version: TLSv1.3
  tls_cipher_suites: "${TLS_CIPHER_SUITES}"

  # CORS
  cors_enabled: true
  cors_origins:
    - "${APP_BASE_URL}"  # REQUIRED
  cors_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  cors_headers:
    - Content-Type
    - Authorization
    - X-Correlation-ID
    - X-Request-ID

  # CSRF
  csrf_enabled: true
  csrf_secret: "${CSRF_SECRET}"  # REQUIRED
  csrf_token_length: 32

  # Rate Limiting
  rate_limit_enabled: true

  # Input Validation
  validation_enabled: true
  strict_validation: true
  sanitize_input: true

  # Additional Security
  enable_security_headers: true
  enable_hsts: true
  hsts_max_age: 31536000  # 1 year
  enable_csp: true
  csp_policy: "${CSP_POLICY}"  # REQUIRED

# =============================================================================
# VALIDATION CONFIGURATION
# =============================================================================
validation:
  # Schema Validation
  schema_validation: true
  validation_level: strict
  fail_on_validation_error: true

  # Data Validation
  validate_on_ingest: true
  validate_on_transform: true
  validate_on_output: true

  # Custom Validators
  custom_validators_enabled: true
  validators_path: ./config/validators

# =============================================================================
# MIGRATION & ROLLOUT
# =============================================================================
migration:
  # Database Migration
  auto_migration: false  # Manual migrations in production
  migration_path: ./migrations
  migration_table: schema_migrations
  require_manual_approval: true

  # Feature Rollout
  gradual_rollout_enabled: true
  rollout_percentage: 100
  canary_deployment: true
  canary_percentage: 10

# =============================================================================
# DOCUMENTATION
# =============================================================================
documentation:
  # API Documentation
  api_docs_enabled: false  # Disabled in production
  api_docs_path: /docs
  swagger_enabled: false
  swagger_path: /swagger.json

  # Guides
  quick_start_enabled: false
  tutorial_enabled: false
  example_code_enabled: false

# =============================================================================
# DISASTER RECOVERY & BACKUP
# =============================================================================
disaster_recovery:
  # Backup Configuration
  backup_enabled: true
  backup_interval_hours: 6
  backup_retention_days: 90
  backup_location: "${BACKUP_S3_BUCKET}"  # REQUIRED

  # Replication
  enable_replication: true
  replication_lag_seconds: 60

  # Failover
  enable_automatic_failover: true
  failover_timeout_seconds: 30
  health_check_interval_seconds: 10

################################################################################
# END OF PRODUCTION CONFIGURATION
################################################################################
