################################################################################
# OpenEvolve BubbleLab Integration - Service Discovery Configuration
################################################################################
# This file defines all OpenEvolve services, their endpoints, health checks,
# dependencies, circuit breaker thresholds, and timeout configurations.
#
# This configuration follows the LAW OF CONFIGURATION EXPLICITNESS:
# - No magic defaults
# - All endpoints must be explicitly configured
# - Health checks are mandatory
# - Circuit breakers protect against cascading failures
#
# SECURITY WARNINGS:
# ⚠️  TLS certificates must be validated before production deployment
# ⚠️  All endpoint URLs must use HTTPS in production (except localhost)
# ⚠️  Example domains (openevolve.example.com) must be replaced
# ⚠️  Run validate-config.js before deploying to any environment
#
# LAST_UPDATED: 2026-01-17T00:00:00Z
# VERSION: 1.0.0
################################################################################

# =============================================================================
# SERVICE DISCOVERY METADATA
# =============================================================================
metadata:
  version: "1.0.0"
  last_updated: "2026-01-17T00:00:00Z"
  discovery_method: static  # Options: static, consul, etcd, kubernetes
  refresh_interval_seconds: 60
  health_check_interval_seconds: 30
  service_timeout_seconds: 10

# =============================================================================
# GLOBAL SERVICE SETTINGS
# =============================================================================
global_settings:
  # Default timeouts (can be overridden per service)
  default_timeouts:
    connect_seconds: 5
    read_seconds: 30
    write_seconds: 30
    health_check_seconds: 5

  # Circuit breaker defaults
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    success_threshold: 2
    timeout_seconds: 60
    half_open_max_calls: 3
    rolling_window_size: 100
    call_timeout: 30000  # milliseconds

  # Retry defaults
  retry:
    max_attempts: 3
    backoff_multiplier: 2
    initial_delay_ms: 1000
    max_delay_ms: 10000
    jitter: true

  # Health check defaults
  health_check:
    enabled: true
    interval_seconds: 30
    timeout_seconds: 5
    unhealthy_threshold: 3
    healthy_threshold: 2
    deregister_critical_service_after: 300

# =============================================================================
# OPENEVOLVE CORE SERVICES
# =============================================================================
services:
  # =============================================================================
  # LEANAIDE CONTINUOUS MATH SERVICE
  # =============================================================================
  - id: leanaide_continuous
    name: LeanAide Continuous Math Service
    description: Detects and solves ODEs/PDEs using continuous mathematics
    category: ai_services
    version: "1.5.0"
    status: active

    # Service endpoints
    endpoints:
      - environment: development
        url: http://localhost:8001
        protocol: http
        port: 8001
      - environment: staging
        url: https://staging-leanaide-continuous.openevolve.example.com
        protocol: https
        port: 443
      - environment: production
        url: "${LENAIDE_CONTINUOUS_URL}"
        protocol: https
        port: 443

    # Health check configuration
    health_check:
      enabled: true
      path: /health
      method: GET
      expected_status: 200
      expected_body: '{"status":"healthy"}'
      interval_seconds: 30
      timeout_seconds: 5

    # Circuit breaker configuration
    circuit_breaker:
      enabled: true
      failure_threshold: 3
      success_threshold: 2
      timeout_seconds: 30
      half_open_max_calls: 2

    # Timeouts
    timeouts:
      connect_seconds: 5
      read_seconds: 45
      write_seconds: 45

    # Retry configuration
    retry:
      max_attempts: 3
      initial_delay_ms: 1000
      max_delay_ms: 5000

    # Dependencies (services this service depends on)
    dependencies: []

    # Tags for service discovery
    tags:
      - ai
      - mathematics
      - ode
      - pde
      - continuous

