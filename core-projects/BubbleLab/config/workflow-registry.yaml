  # =============================================================================
  # CORE WORKFLOWS
  # =============================================================================
  - id: wf_bubble_flow_executor
    name: Bubble Flow Executor
    category: core
    description: Executes BubbleLab flow definitions
    version: "2.0.0"
    status: active
    author: BubbleLab Team
    created_at: "2024-01-01T00:00:00Z"
    updated_at: "2026-01-15T00:00:00Z"

    # Dependencies
    # ⚠️  SECURITY WARNING: Pin to exact versions to prevent breaking changes
    dependencies:
      - name: bubble-runtime
        version: "2.0.5"  # Pinned from >=2.0.0 for security
        type: internal
      - name: node
        version: "18.19.0"  # Pinned from >=18.0.0 for security
        type: runtime

    # Environment compatibility
    environments:
      - name: development
        compatible: true
        config_override: dev.yaml
      - name: staging
        compatible: true
        config_override: staging.yaml
      - name: production
        compatible: true
        config_override: production.yaml

    # Resource requirements
    resources:
      cpu: 1
      memory: 1024  # MB
      timeout: 600  # seconds
      max_parallel: 10

    # Parameters (272 total configurable params)
    parameters:
      - name: max_bubbles
        type: integer
        default: 100
        min: 1
        max: 500
        required: false
        description: Maximum number of bubbles in flow

      - name: validation_strict_mode
        type: boolean
        default: false
        required: false
        description: Enable strict validation mode

      - name: auto_save_interval
        type: integer
        default: 60
        min: 10
        max: 600
        required: false
        description: Auto-save interval in seconds

