# Docker Compose configuration for Jaeger
# Run with: docker-compose -f docker-compose.jaeger.yml up -d

version: '3.8'

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: bubble-lab-jaeger
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "5775:5775/udp"       # accept zipkin.thrift over compact thrift protocol
      - "6831:6831/udp"       # accept jaeger.thrift over compact thrift protocol
      - "6832:6832/udp"       # accept jaeger.thrift over binary thrift protocol
      - "5778:5778"           # serve configs
      - "16686:16686"         # Jaeger UI
      - "14268:14268"         # accept jaeger.thrift directly from clients
      - "14250:14250"         # accept model.proto
      - "9411:9411"           # Zipkin compatible endpoint
    restart: unless-stopped
    networks:
      - bubble-lab-network

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: bubble-lab-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    networks:
      - bubble-lab-network

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: bubble-lab-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    restart: unless-stopped
    networks:
      - bubble-lab-network

networks:
  bubble-lab-network:
    driver: bridge

volumes:
  grafana-storage:
