# pytest configuration for the openevolve-grpc Python integration.
#
# `pythonpath`/`--import-mode=importlib` keep the test modules importable without
# pytest walking up into the (unrelated, currently broken) `BubbleLab/__init__.py`
# package chain above this directory.
#
# `-p no:pytest_ethereum` disables an unrelated, broken global pytest plugin
# (web3's pytest_ethereum) that otherwise aborts pytest startup in this
# environment. It is a no-op where that plugin is absent.

[pytest]
testpaths = python
pythonpath = python
addopts = -p no:pytest_ethereum --import-mode=importlib
markers =
    integration: end-to-end tests that need external services
asyncio_mode = auto
