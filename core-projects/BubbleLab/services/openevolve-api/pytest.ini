[pytest]
# Anchor pytest's rootdir to this service.
#
# Without this, rootdir resolves to the repository root and pytest builds a
# `Package` collector for `core-projects/BubbleLab` (it has an `__init__.py`
# whose imports are unrelated to this service and fail), which breaks
# collection of every test in this directory.
testpaths = tests
asyncio_mode = auto
markers =
    integration: Integration tests (require running service)
    unit: Unit tests (no external dependencies)
    slow: Slow-running tests
