# AI-Knowledge-Graph Integration Configuration
# This file configures the entity standardization, relationship inference,
# and visualization features from ai-knowledge-graph

# Entity Standardization Configuration
standardization:
  # Enable or disable entity standardization
  enabled: true

  # Use LLM for advanced entity resolution
  # Note: Requires LLM client to be configured
  use_llm_for_entities: false

  # Remove stopwords during text normalization
  stopword_removal: true

  # Use root word analysis for entity grouping
  root_word_analysis: true

  # Filter self-referential triples (subject == object)
  self_reference_filtering: true

  # Custom stopwords (in addition to defaults)
  custom_stopwords: []

# Relationship Inference Configuration
inference:
  # Enable or disable relationship inference
  enabled: true

  # Apply transitive inference (A→B, B→C → A→C)
  apply_transitive: true

  # Use LLM for inter-community relationship inference
  # Note: Requires LLM client to be configured
  use_llm_for_inference: true

  # Similarity threshold for lexical inference (0.0 - 1.0)
  # Higher values = more conservative inference
  similarity_threshold: 0.7

  # Maximum depth for transitive inference
  # Avoid setting too high (can cause exponential growth)
  max_inference_depth: 3

  # Enable within-community inference
  enable_within_community: true

  # Enable lexical similarity inference
  enable_lexical_similarity: true

# Visualization Configuration
visualization:
  # Enable or disable visualization generation
  enabled: true

  # Output directory for visualization files
  output_dir: "data/visualizations"

  # Community detection algorithm
  # Options: louvain, leiden, label_propagation
  community_algorithm: "louvain"

  # Node sizing strategy
  # Options: centrality (weighted combination), degree (node degree), uniform (same size)
  node_sizing: "centrality"

  # Differentiate edge types visually
  # True = solid for original, dashed for inferred
  edge_differentiation: true

  # Color scheme for communities
  # Options: colorblind (accessible), default, spectral
  color_scheme: "colorblind"

  # Display options
  width: 1200
  height: 800
  show_labels: true
  enable_zoom: true
  enable_physics: true

  # Centrality weights for node sizing (must sum to 1.0)
  centrality_weights:
    degree: 0.6
    betweenness: 0.3
    eigenvector: 0.1

# Output Configuration
output:
  # Save processed triples to file
  save_triples: true

  # Save processed entities to file
  save_entities: true

  # Save processing statistics
  save_statistics: true

  # Output formats
  # Options: json, html, csv, graphml, gexf
  formats:
    - json
    - html
    - csv

  # Output directory for data files
  data_output_dir: "data/aikg_output"

# LLM Configuration (if using LLM features)
llm:
  # LLM provider (must match KnowledgeEngine config)
  # Options: anthropic, openai, google
  provider: "anthropic"

  # Model to use for entity resolution
  entity_resolution_model: "claude-sonnet-4-20250514"

  # Model to use for relationship inference
  inference_model: "claude-sonnet-4-20250514"

  # Maximum tokens for LLM calls
  max_tokens: 1000

  # Temperature for LLM calls (lower = more deterministic)
  temperature: 0.3

  # System prompt for entity resolution
  entity_resolution_system_prompt: |
    You are an expert in knowledge graph entity resolution.
    Your task is to identify which entity names refer to the same concept
    and select the most canonical/standard name.

  # System prompt for relationship inference
  inference_system_prompt: |
    You are an expert in knowledge graph completion.
    Your task is to identify plausible relationships between concepts
    that may not be explicitly stated in the text.

# Performance Configuration
performance:
  # Maximum number of entities to process
  max_entities: 10000

  # Maximum number of triples to process
  max_triples: 50000

  # Enable parallel processing
  enable_parallel: true

  # Number of worker processes for parallel processing
  # Set to number of CPU cores for best performance
  num_workers: 4

  # Chunk size for batch processing
  batch_size: 1000

# Logging Configuration
logging:
  # Log level
  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"

  # Log file path (empty for stdout only)
  log_file: ""

  # Log format
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Advanced Options
advanced:
  # Minimum entity frequency for standardization
  min_entity_frequency: 2

  # Maximum variants per canonical entity
  max_variants_per_entity: 10

  # Confidence threshold for keeping inferred triples
  min_inference_confidence: 0.5

  # Maximum community size for visualization
  max_community_size: 100

  # Enable caching for expensive operations
  enable_cache: true

  # Cache TTL in seconds
  cache_ttl: 3600
