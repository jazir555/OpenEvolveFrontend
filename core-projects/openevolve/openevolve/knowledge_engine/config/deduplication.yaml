# Unified Deduplication Configuration

# Default strategy to use when 'auto' is specified
default_strategy: auto

# Cache configuration
cache_enabled: true
cache_ttl: 3600  # seconds (1 hour)

# Strategy-specific configurations
strategies:
  # SEMHASH: Fast rule-based deduplication
  semhash:
    enabled: true
    similarity_threshold: 0.95
    use_llm_for_entities: false
    description: "Fastest strategy, best for small datasets (< 100 entities)"

  # LM Cluster: ML-based clustering deduplication
  lm_cluster:
    enabled: true
    cluster_size: 128  # entities per cluster
    num_workers: 64    # parallel workers
    retrieval_model: "sentence-transformers/all-mpnet-base-v2"
    description: "Most accurate for large datasets (> 1000 entities)"

  # Standardization: Entity normalization
  standardization:
    enabled: true
    use_llm_for_resolution: false
    stem_length: 4  # characters for root word extraction
    description: "Best for medium datasets (100-1000 entities)"

  # Semantic: LLM-based semantic matching
  semantic:
    enabled: true
    confidence_threshold: 0.8
    max_entity_batch: 100
    description: "Best for ambiguous entities requiring semantic understanding"

# Auto-selection thresholds
auto_selection:
  small_threshold: 100      # Use semhash below this
  medium_threshold: 1000    # Use standardization below this
  large_threshold: 1000     # Use lm_cluster above this
  ambiguous_check: true     # Check for ambiguous entities

# Performance tuning
performance:
  enable_parallel: true
  max_parallel_workers: 8
  batch_size: 100
  timeout_ms: 30000

# Logging
logging:
  level: INFO
  log_similarity_scores: false
  log_processing_time: true
