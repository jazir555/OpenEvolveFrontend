# KG-Gen Pipeline Configuration
# This file configures the 3-stage knowledge graph generation pipeline

pipeline:
  # Enable or disable the pipeline
  enabled: true

  # Default chunk size for document processing (characters)
  default_chunk_size: 5000

  # Default overlap between chunks (characters)
  default_overlap: 200

  # Number of parallel workers for chunk processing
  parallel_workers: 4

  # Cache size for LRU cache
  cache_size: 100

# Configuration for each pipeline stage
stages:
  # Stage 1: Entity Extraction
  entity_extraction:
    # Model to use for extraction
    model: "openai/gpt-4o"

    # Temperature for generation
    temperature: 0.0

    # Maximum tokens to generate
    max_tokens: 4000

    # Timeout for entity extraction (seconds)
    timeout: 60

    # Number of entities to extract per chunk
    max_entities: 100

  # Stage 2: Relation Extraction
  relation_extraction:
    # Model to use for extraction
    model: "openai/gpt-4o"

    # Temperature for generation
    temperature: 0.0

    # Maximum tokens to generate
    max_tokens: 8000

    # Timeout for relation extraction (seconds)
    timeout: 90

    # Number of relations to extract per chunk
    max_relations: 200

    # Whether to use extracted entities as constraints
    use_entity_constraints: true

  # Stage 3: Deduplication
  deduplication:
    # Deduplication method: 'semhash', 'lm_cluster', or 'full'
    method: full

    # Semantic hash threshold for similarity
    semhash_threshold: 0.95

    # Cluster size for LM-based clustering
    lm_cluster_size: 128

    # Whether to create entity clusters
    create_clusters: true

    # Minimum cluster size
    min_cluster_size: 2

# Neo4j upload configuration
neo4j_upload:
  # Enable or disable Neo4j upload
  enabled: true

  # Batch size for uploads
  batch_size: 100

  # Whether to create indices
  create_indices: true

  # Whether to verify upload after completion
  verify_upload: true

  # Connection settings (can be overridden by environment variables)
  connection:
    uri: "bolt://localhost:7687"
    user: "neo4j"
    password: "password"
    database: "neo4j"

  # Timeout for Neo4j operations (seconds)
  timeout: 30

# Progress tracking configuration
progress_tracking:
  # Enable or disable progress tracking
  enabled: true

  # Log progress interval (seconds)
  log_interval: 10

  # Whether to use progress callbacks
  use_callbacks: true

# Chunking configuration
chunking:
  # Default chunking method: 'sentences', 'size', 'paragraphs', 'semantic'
  default_method: sentences

  # Sentence-based chunking
  sentences:
    preserve_boundaries: true
    min_sentences_per_chunk: 5
    max_sentences_per_chunk: 50

  # Size-based chunking
  size:
    hard_limit: 6000
    soft_limit: 5000

  # Paragraph-based chunking
  paragraphs:
    max_paragraphs_per_chunk: 10
    min_paragraph_length: 50

  # Semantic unit chunking
  semantic:
    unit_markers:
      - "^#+\\s"  # Markdown headers
      - "^Chapter\\s+\\d+"
      - "^Section\\s+\\d+"
      - "^\\d+\\.\\s"

# Parallel processing configuration
parallel:
  # Maximum number of worker threads
  max_workers: 4

  # Batch size for parallel processing
  batch_size: 10

  # Timeout for each chunk (seconds)
  chunk_timeout: 120

  # Retry configuration
  retry:
    max_retries: 3
    retry_delay: 1.0
    backoff_factor: 2.0

# Performance optimization
performance:
  # Enable LRU caching
  enable_cache: true

  # Enable batch processing
  enable_batching: true

  # Enable streaming upload for large graphs
  enable_streaming: true

  # Memory limit (MB)
  memory_limit: 2048

# Logging configuration
logging:
  # Log level: 'DEBUG', 'INFO', 'WARNING', 'ERROR'
  level: INFO

  # Log format: 'text', 'json'
  format: text

  # Log file path (optional, leave empty for stdout only)
  file: ""

  # Whether to include timestamps
  timestamps: true

# Advanced features
advanced:
  # Enable entity type detection
  entity_type_detection: true

  # Enable relationship confidence scoring
  confidence_scoring: true

  # Enable temporal information extraction
  temporal_extraction: true

  # Enable attribute extraction for entities
  attribute_extraction: true

  # Minimum confidence threshold
  min_confidence: 0.7

# Error handling
error_handling:
  # Strategy: 'fail_fast', 'continue', 'retry'
  strategy: continue

  # Whether to log detailed errors
  verbose_errors: true

  # Whether to collect error statistics
  collect_stats: true

  # Maximum consecutive errors before aborting
  max_consecutive_errors: 10
