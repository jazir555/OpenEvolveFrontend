# Prometheus Alert Rules for Neo4j
# OpenEvolve Knowledge Engine - Phase 1.1.1

groups:
  - name: neo4j_alerts
    interval: 30s
    rules:
      # High JVM heap usage
      - alert: Neo4jHighHeapUsage
        expr: (neo4j_jvm_memory_heap_used / neo4j_jvm_memory_heap_max) > 0.9
        for: 5m
        labels:
          severity: warning
          service: neo4j
        annotations:
          summary: "Neo4j high heap usage"
          description: "Neo4j heap usage is above 90% for 5 minutes (current: {{ $value | humanizePercentage }})"

      # Critical JVM heap usage
      - alert: Neo4jCriticalHeapUsage
        expr: (neo4j_jvm_memory_heap_used / neo4j_jvm_memory_heap_max) > 0.95
        for: 2m
        labels:
          severity: critical
          service: neo4j
        annotations:
          summary: "Neo4j critical heap usage"
          description: "Neo4j heap usage is above 95% for 2 minutes (current: {{ $value | humanizePercentage }})"

      # High page cache usage
      - alert: Neo4jHighPageCacheUsage
        expr: (neo4j_page_cache_used / neo4j_page_cache_max) > 0.9
        for: 5m
        labels:
          severity: warning
          service: neo4j
        annotations:
          summary: "Neo4j high page cache usage"
          description: "Neo4j page cache usage is above 90% (current: {{ $value | humanizePercentage }})"

      # High number of open connections
      - alert: Neo4jHighConnectionCount
        expr: neo4j_bolt_connections_open > 400
        for: 5m
        labels:
          severity: warning
          service: neo4j
        annotations:
          summary: "Neo4j high connection count"
          description: "Neo4j has more than 400 open connections (current: {{ $value }})"

      # High transaction latency
      - alert: Neo4jHighTransactionLatency
        expr: histogram_quantile(0.95, neo4j_transaction_latency_seconds) > 1
        for: 5m
        labels:
          severity: warning
          service: neo4j
        annotations:
          summary: "Neo4j high transaction latency"
          description: "95th percentile transaction latency is above 1 second (current: {{ $value | humanizeDuration }})"

      # High number of active transactions
      - alert: Neo4jHighActiveTransactions
        expr: neo4j_transaction_active > 100
        for: 5m
        labels:
          severity: warning
          service: neo4j
        annotations:
          summary: "Neo4j high active transactions"
          description: "Neo4j has more than 100 active transactions (current: {{ $value }})"

      # Database replication lag (for clustering)
      - alert: Neo4jReplicationLag
        expr: neo4j_replication_lag_seconds > 60
        for: 5m
        labels:
          severity: warning
          service: neo4j
        annotations:
          summary: "Neo4j replication lag"
          description: "Neo4j replication lag is above 60 seconds (current: {{ $value | humanizeDuration }})"

      # Disk space low
      - alert: Neo4jDiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/data"} / node_filesystem_size_bytes{mountpoint="/data"}) < 0.1
        for: 5m
        labels:
          severity: critical
          service: neo4j
        annotations:
          summary: "Neo4j disk space low"
          description: "Neo4j data directory has less than 10% free space (current: {{ $value | humanizePercentage }})"

      # High query execution time
      - alert: Neo4jSlowQueries
        expr: histogram_quantile(0.99, neo4j_query_execution_time_seconds) > 5
        for: 5m
        labels:
          severity: warning
          service: neo4j
        annotations:
          summary: "Neo4j slow queries detected"
          description: "99th percentile query execution time is above 5 seconds (current: {{ $value | humanizeDuration }})"

      # Database down
      - alert: Neo4jDatabaseDown
        expr: up{job="neo4j"} == 0
        for: 1m
        labels:
          severity: critical
          service: neo4j
        annotations:
          summary: "Neo4j database is down"
          description: "Neo4j database has been down for more than 1 minute"

      # High number of failed transactions
      - alert: Neo4jHighFailedTransactions
        expr: rate(neo4j_transaction_failed_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          service: neo4j
        annotations:
          summary: "Neo4j high failed transaction rate"
          description: "Neo4j failed transaction rate is above 10 per second (current: {{ $value | humanize }})"
