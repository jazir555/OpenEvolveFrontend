# Prometheus Configuration for Neo4j Monitoring
# OpenEvolve Knowledge Engine - Phase 1.1.1

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'openevolve-knowledge-graph'
    environment: 'production'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files
rule_files:
  - 'neo4j_alerts.yml'

# Scrape configurations
scrape_configs:
  # Neo4j metrics endpoint
  - job_name: 'neo4j'
    static_configs:
      - targets: ['openevolve-neo4j:2004']
    scrape_interval: 30s
    metrics_path: '/metrics'
    honor_labels: true
    honor_timestamps: true

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Docker container metrics (requires cadvisor)
  - job_name: 'docker'
    static_configs:
      - targets: ['cadvisor:8080']
