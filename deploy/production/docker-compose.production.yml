version: '3.8'

services:
  api-gateway:
    build:
      context: ../../api/gateway
      dockerfile: Dockerfile
    image: openevolve/api:${IMAGE_TAG:-latest}
    container_name: openevolve-api-prod
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=https://openevolve.ai,https://www.openevolve.ai
      - LOG_LEVEL=INFO
      - WS_HEARTBEAT_INTERVAL=30
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - openevolve-network
    volumes:
      - api_logs:/app/logs
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: openevolve-db-prod
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres_production_data:/var/lib/postgresql/data
      - ./backup-scripts:/backup
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openevolve-network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: openevolve-redis-prod
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_production_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openevolve-network
    restart: always

  bubblelab-frontend:
    build:
      context: ../../BubbleLab/apps/bubble-studio
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://openevolve.ai
        - VITE_WS_BASE_URL=wss://openevolve.ai
    image: openevolve/frontend:${IMAGE_TAG:-latest}
    container_name: openevolve-frontend-prod
    environment:
      - VITE_API_BASE_URL=https://openevolve.ai
      - VITE_WS_BASE_URL=wss://openevolve.ai
      - NODE_ENV=production
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - openevolve-network
    restart: always

  nginx:
    image: nginx:alpine
    container_name: openevolve-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - openevolve-network
    restart: always

  worker:
    build:
      context: ../../api/gateway
      dockerfile: Dockerfile
    image: openevolve/worker:${IMAGE_TAG:-latest}
    command: python -m celery worker --app=worker.celery_app --loglevel=info --concurrency=4
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
    networks:
      - openevolve-network
    restart: always

volumes:
  postgres_production_data:
    driver: local
  redis_production_data:
    driver: local
  api_logs:
    driver: local
  nginx_logs:
    driver: local

networks:
  openevolve-network:
    driver: bridge
