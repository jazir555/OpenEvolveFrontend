version: '3.8'

services:
  # API Gateway
  api-gateway:
    build:
      context: ../../api/gateway
      dockerfile: Dockerfile
    container_name: openevolve-api-staging
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=staging
      - DATABASE_URL=postgresql://openevolve:${DB_PASSWORD}@postgres:5432/openevolve_staging
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGINS=http://localhost:3000,http://staging.openevolve.ai
      - LOG_LEVEL=DEBUG
      - WS_HEARTBEAT_INTERVAL=30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - openevolve-network
    volumes:
      - ../../api/gateway:/app
      - api_logs:/app/logs

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: openevolve-db-staging
    environment:
      - POSTGRES_USER=openevolve
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=openevolve_staging
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvolve"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openevolve-network

  # Redis for caching & sessions
  redis:
    image: redis:7-alpine
    container_name: openevolve-redis-staging
    command: redis-server --appendonly yes
    volumes:
      - redis_staging_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openevolve-network

  # BubbleLab Frontend (React)
  bubblelab-frontend:
    build:
      context: ../../BubbleLab/apps/bubble-studio
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
        - VITE_WS_BASE_URL=ws://localhost:8000
    container_name: openevolve-frontend-staging
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_BASE_URL=ws://localhost:8000
      - NODE_ENV=production
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - openevolve-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: openevolve-nginx-staging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api-gateway
      - bubblelab-frontend
    restart: unless-stopped
    networks:
      - openevolve-network

  # Worker for background tasks
  worker:
    build:
      context: ../../api/gateway
      dockerfile: Dockerfile
    container_name: openevolve-worker-staging
    command: python -m celery worker --app=worker.celery_app --loglevel=info
    environment:
      - ENVIRONMENT=staging
      - DATABASE_URL=postgresql://openevolve:${DB_PASSWORD}@postgres:5432/openevolve_staging
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - openevolve-network

volumes:
  postgres_staging_data:
    driver: local
  redis_staging_data:
    driver: local
  api_logs:
    driver: local
  nginx_logs:
    driver: local

networks:
  openevolve-network:
    driver: bridge
