version: '3.8'

# =============================================================================
# OpenEvolve Infrastructure - Phase 0 Foundation
# =============================================================================
# This docker-compose file sets up the core infrastructure services needed
# for the Hephaestus → Vibe-Kanban migration and OpenEvolve operations.
#
# Services:
#   - Qdrant: Vector database for embeddings and semantic search
#   - PostgreSQL: Relational database for structured data
#   - Redis: Caching and message broker (optional)
#
# Usage:
#   docker-compose -f docker-compose.infrastructure.yml up -d
# =============================================================================

services:
  # ===========================================================================
  # Qdrant Vector Database
  # ===========================================================================
  # Used for:
  #   - Storing embeddings for semantic search
  #   - Knowledge graph vectorization
  #   - Hephaestus task memory
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: openevolve-qdrant
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - openevolve-network

  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  # Used for:
  #   - Vibe-Kanban application data
  #   - User management and authentication
  #   - Task and project storage
  #   - Structured application data
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: openevolve-postgres
    command: [
      "postgres",
      "-c", "wal_level=logical",
      "-c", "max_connections=200",
      "-c", "shared_buffers=256MB",
      "-c", "effective_cache_size=1GB"
    ]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-openevolve}
      - POSTGRES_USER=${POSTGRES_USER:-openevolve}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - PGDATA=/var/lib/postgresql/data/pgdata
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openevolve} -d ${POSTGRES_DB:-openevolve}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - openevolve-network

  # ===========================================================================
  # Redis Cache & Message Broker
  # ===========================================================================
  # Used for:
  #   - Caching LLM responses
  #   - Session storage
  #   - Message queuing
  #   - Real-time features
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: openevolve-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--maxmemory", "512mb",
      "--maxmemory-policy", "allkeys-lru",
      "--save", "60", "1000"
    ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - openevolve-network

  # ===========================================================================
  # pgAdmin (Optional - PostgreSQL Management UI)
  # ===========================================================================
  # Comment out this service if not needed in production
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: openevolve-pgadmin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@openevolve.local}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-changeme}
      - PGADMIN_CONFIG_SERVER_MODE=False
    restart: unless-stopped
    networks:
      - openevolve-network
    depends_on:
      - postgres
    profiles:
      - tools

  # ===========================================================================
  # Redis Commander (Optional - Redis Management UI)
  # ===========================================================================
  # Comment out this service if not needed in production
  # ===========================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: openevolve-redis-commander
    ports:
      - "8081:8081"
    volumes:
      - ./redis-commander-config.js:/redis-commander/config/local-storage.js
    environment:
      - REDIS_HOSTS=local:redis:6379
    restart: unless-stopped
    networks:
      - openevolve-network
    depends_on:
      - redis
    profiles:
      - tools

# =============================================================================
# Networks
# =============================================================================
networks:
  openevolve-network:
    name: openevolve-network
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  qdrant_data:
    name: openevolve-qdrant-data
  postgres_data:
    name: openevolve-postgres-data
  redis_data:
    name: openevolve-redis-data
  pgadmin_data:
    name: openevolve-pgadmin-data
