version: '3.8'

# Neo4j 5.26+ Production-Ready Deployment for OpenEvolve Knowledge Engine
# Phase 1.1.1 - Graph Database Infrastructure
#
# Features:
# - Neo4j 5.26.0 Enterprise-ready community edition
# - APOC plugin for advanced graph algorithms
# - Vector similarity search support
# - Temporal query capabilities
# - Production memory configuration
# - Health monitoring and backup support
# - Persistent volume storage

services:
  neo4j:
    image: neo4j:5.26.0-community
    container_name: openevolve-neo4j
    hostname: neo4j
    restart: unless-stopped

    # Port Mapping
    ports:
      - "7474:7474"  # HTTP Browser interface
      - "7687:7687"  # Bolt protocol (primary connection)
      - "7473:7473"  # HTTPS (optional, for encrypted HTTP)

    # Environment Configuration
    env_file:
      - knowledge_engine/config/neo4j.dev.env

    environment:
      # Authentication
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-openevolve2026}

      # JVM Memory Configuration (Production-optimized)
      # Formula: Heap size should be ~50% of available RAM
      # Page cache should be ~50% of remaining RAM after heap
      - NEO4J_server_memory_heap_initial__size=2g
      - NEO4J_server_memory_heap_max__size=4g
      - NEO4J_server_memory_pagecache_size=6g

      # Network Configuration
      - NEO4J_server_default__listen__address=0.0.0.0
      - NEO4J_dbms_default__listen__address=0.0.0.0
      - NEO4J_dbms_connector_bolt_advertised__address=:7687
      - NEO4J_dbms_connector_http_advertised__address=:7474

      # Transaction Configuration
      - NEO4J_server.transaction_timeout=60s
      - NEO4J_dbms_transaction_concurrent_maximum=1000

      # Connection Limits
      - NEO4J_dbms_connector_bolt_thread__pool__max__size=400
      - NEO4J_dbms_connector_bolt_thread__pool__min__size=5

      # Logging Configuration
      - NEO4J_server_logs_debug_level=INFO

      # APOC Plugin Configuration
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*

      # Enable APOC Core
      - NEO4J_dbms_security_procedures_unrestricted=gds.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*

      # Feature flags for temporal and vector operations
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,apoc.coll.*,apoc.load.*,apoc.algo.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,apoc.coll.*,apoc.load.*,apoc.algo.*

    # Volume Mounts (Persistent Storage)
    volumes:
      # Data persistence
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins

      # Custom configuration (optional)
      - ./knowledge_engine/config/neo4j.conf:/conf/neo4j.conf:ro

      # Initialization scripts
      - ./knowledge_engine/scripts:/scripts:ro

    # Health Check Configuration
    healthcheck:
      test: |
        wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

    # Resource Limits (Production Safety)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 12G
        reservations:
          cpus: '2'
          memory: 8G

    # Network Configuration
    networks:
      - knowledge_graph_network

  # Neo4j Backup Service (Optional - for automated backups)
  neo4j-backup:
    image: neo4j:5.26.0-community
    container_name: openevolve-neo4j-backup
    restart: "no"
    env_file:
      - knowledge_engine/config/neo4j.dev.env
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-openevolve2026}
    volumes:
      - neo4j_backups:/backups
      - ./knowledge_engine/scripts/backup.sh:/backup.sh:ro
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - knowledge_graph_network
    profiles:
      - backup

  # Neo4j Monitoring Service (Optional - Grafana + Prometheus)
  prometheus:
    image: prom/prometheus:latest
    container_name: openevolve-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./knowledge_engine/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - knowledge_graph_network
    profiles:
      - monitoring

volumes:
  # Neo4j Data Volumes (Named for easy backup)
  neo4j_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/neo4j/data

  neo4j_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/neo4j/logs

  neo4j_import:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/neo4j/import

  neo4j_plugins:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/neo4j/plugins

  neo4j_backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/neo4j/backups

  prometheus_data:
    driver: local

networks:
  knowledge_graph_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
