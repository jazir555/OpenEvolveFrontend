version: '3.8'

# OpenEvolve Docker Compose Configuration
# License: Apache 2.0
# 
# Services:
#   - valkey: Message broker and cache (Apache 2.0)
#   - openevolve: Main application
#   - jaeger: OpenTelemetry collector (Apache 2.0)
#   - prometheus: Metrics collection (Apache 2.0)
#   - grafana: Metrics visualization (Apache 2.0)
#
# Usage:
#   docker-compose up -d
#   docker-compose logs -f
#   docker-compose down

services:
  # ============================================================================
  # Valkey - Message Broker and Cache (Apache 2.0)
  # ============================================================================
  valkey:
    image: valkey/valkey:latest
    container_name: openevolve-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
      - ./config/valkey.conf:/etc/valkey/valkey.conf:ro
    command: valkey-server /etc/valkey/valkey.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - openevolve-network

  # ============================================================================
  # Jaeger - OpenTelemetry Collector (Apache 2.0)
  # ============================================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: openevolve-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    networks:
      - openevolve-network

  # ============================================================================
  # Prometheus - Metrics Collection (Apache 2.0)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: openevolve-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - openevolve-network

  # ============================================================================
  # Grafana - Metrics Visualization (Apache 2.0)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: openevolve-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    networks:
      - openevolve-network
    depends_on:
      - prometheus

  # ============================================================================
  # OpenEvolve - Main Application
  # ============================================================================
  openevolve:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: openevolve-app
    ports:
      - "8000:8000"   # REST API
      - "8001:8001"   # GraphQL API
      - "8080:8080"   # Orchestrator / Gateway
      - "8501:8501"   # Streamlit Dashboard
    environment:
      # Core Configuration
      - OPENEVOLVE_LOG_LEVEL=INFO
      - OPENEVOLVE_ORCHESTRATOR_PORT=8080
      
      # Service Configuration
      - OPENEVOLVE_SERVICES__REST_API=true
      - OPENEVOLVE_SERVICES__GRAPHQL_API=true
      - OPENEVOLVE_SERVICES__EVENT_BUS=true
      - OPENEVOLVE_SERVICES__MCP_SERVER=true
      - OPENEVOLVE_SERVICES__TELEMETRY=true
      
      # REST API Configuration
      - OPENEVOLVE_REST_API__HOST=0.0.0.0
      - OPENEVOLVE_REST_API__PORT=8000
      
      # GraphQL Configuration
      - OPENEVOLVE_GRAPHQL__HOST=0.0.0.0
      - OPENEVOLVE_GRAPHQL__PORT=8001
      
      # Event Bus Configuration
      - OPENEVOLVE_EVENT_BUS__ENABLED=true
      - OPENEVOLVE_EVENT_BUS__BACKEND=valkey
      - OPENEVOLVE_EVENT_BUS__HOST=valkey
      - OPENEVOLVE_EVENT_BUS__PORT=6379
      
      # Telemetry Configuration
      - OPENEVOLVE_TELEMETRY__ENABLED=true
      - OPENEVOLVE_TELEMETRY__SERVICE_NAME=openevolve
      - OPENEVOLVE_TELEMETRY__OTLP_ENDPOINT=http://jaeger:4317
      
      # Valkey Configuration
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      
      # Security (change in production!)
      - SECRET_KEY=${SECRET_KEY:-changeme-in-production}
    volumes:
      - ./integration_config.yaml:/app/integration_config.yaml:ro
      - ./plugins:/app/plugins:ro
      - openevolve_data:/app/data
    depends_on:
      valkey:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped
    networks:
      - openevolve-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # OpenEvolve Worker - Background Task Processor (Optional)
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: openevolve-worker
    environment:
      - OPENEVOLVE_LOG_LEVEL=INFO
      - OPENEVOLVE_EVENT_BUS__ENABLED=true
      - OPENEVOLVE_EVENT_BUS__BACKEND=valkey
      - OPENEVOLVE_EVENT_BUS__HOST=valkey
      - OPENEVOLVE_EVENT_BUS__PORT=6379
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - WORKER_MODE=true
    volumes:
      - ./integration_config.yaml:/app/integration_config.yaml:ro
      - openevolve_data:/app/data
    depends_on:
      - valkey
      - openevolve
    restart: unless-stopped
    networks:
      - openevolve-network
    command: ["python", "-m", "openevolve_cli", "services", "start", "--event-bus"]
    deploy:
      replicas: 2

# ============================================================================
# Networks
# ============================================================================
networks:
  openevolve-network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  valkey_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  openevolve_data:
    driver: local
