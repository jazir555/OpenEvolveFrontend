name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort mypy bandit[toml] flake8

      - name: Check code formatting with Black
        run: black --check src/ tests/ examples/

      - name: Check import sorting with isort
        run: isort --check-only src/ tests/ examples/

      - name: Lint with flake8
        run: flake8 src/ --max-line-length=100 --extend-ignore=E203,W503

      - name: Type check with mypy
        run: mypy src/ || true

      - name: Security check with bandit
        run: bandit -r src/ -f json -o bandit-report.json || true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-report=term

      - name: Run integration tests
        run: pytest tests/integration.test.py -v

      - name: Run contract tests
        run: pytest tests/contract.test.py -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  probe:
    name: Run Probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run smoke test
        run: python smoke_test.py
        env:
          ADAPTIVE_MDAP_TIMEOUT_MS: 5000
          DEEPSEEK_API_KEY: sk-test

      - name: Run all probes
        run: bash probes/check_v2_features.sh
        env:
          ADAPTIVE_MDAP_TIMEOUT_MS: 5000
          DEEPSEEK_API_KEY: sk-test

  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: adaptive-mdap-adapter:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
