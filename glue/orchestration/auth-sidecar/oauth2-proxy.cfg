# OAuth2 Proxy Configuration
# Following CLAUDE.md Federation Constitution - Law of Configuration Explicitness
# All sensitive values injected via environment variables

# Provider configuration
provider = "oidc"
provider_display_name = "OpenEvolve Central IdP"

# OAuth client credentials (from environment)
oidc_issuer_url = "${OIDC_ISSUER}"
redirect_url = "${OIDC_CALLBACK_URL}"
client_id = "${OIDC_CLIENT_ID}"
client_secret = "${OIDC_CLIENT_SECRET}"

# Scopes to request
scope = "${OIDC_SCOPES:-openid profile email}"

# Cookie configuration
cookie_name = "${COOKIE_NAME:-_oauth2_proxy}"
cookie_secret = "${COOKIE_SECRET}"
cookie_expire = "${COOKIE_EXPIRE:-168h}"
cookie_refresh = "${COOKIE_REFRESH:-1h}"
cookie_secure = "${COOKIE_SECURE:-true}"
cookie_httponly = "${COOKIE_HTTPONLY:-true}"
cookie_samesite = "${COOKIE_SAMESITE:-lax}"
cookie_domains = "${COOKIE_DOMAINS:-.openevolve.local}"

# Session configuration
session_cookie_minimal = "${SESSION_MINIMAL:-false}"
cookie_path = "${COOKIE_PATH:-/}"

# Upstream configuration (the protected service)
upstreams = [
    "http://${UPSTREAM_SERVICE}:${UPSTREAM_PORT}"
]

# HTTP server configuration
http_address = "0.0.0.0:${OAUTH2_PROXY_PORT:-4180}"

# Skip auth for health checks (Law of Runtime Truth)
skip_auth_regex = [
    "^/health",
    "^/ping",
    "^/metrics",
]

# Header injection (X-Remote-User strategy)
# Inject user information into headers for the upstream service
pass_access_token = "${PASS_ACCESS_TOKEN:-true}"
pass_authorization_header = "${PASS_AUTHORIZATION_HEADER:-true}"
pass_user_headers = "${PASS_USER_HEADERS:-true}"
set_xauthrequest = "${SET_XAUTHREQUEST:-true}"

# Headers to inject (fallback for services without OIDC support)
set_authorization_header = "${SET_AUTHORIZATION_HEADER:-true}"
set_basic_auth = "${SET_BASIC_AUTH:-false}"

# User header mapping
email_domain = "${EMAIL_DOMAIN:-}"

# Standard headers injected:
# X-Forwarded-User: Username
# X-Forwarded-Email: User email
# X-Forwarded-Preferred-Username: Preferred username
# X-Forwarded-Access-Token: Access token (if pass_access_token=true)
# Authorization: Bearer <token> (if pass_authorization_header=true)

# Skip provider button (go directly to IdP)
skip_provider_button = "${SKIP_PROVIDER_BUTTON:-true}"

# Allow listing email domains (optional)
# comma-separated list of email domains to allow
authenticated_emails_file = "${AUTHENTICATED_EMAILS_FILE:-}"

# SSL configuration (for upstream connections)
ssl_upstream_insecure_skip_verify = "${SSL_INSECURE_SKIP_VERIFY:-false}"
ssl_upstream_ca_files = "${SSL_CA_FILES:-}"

# Timeout configuration (Law of Configuration Explicitness)
timeout = "${REQUEST_TIMEOUT:-30s}"
ping_user_agent_url = "${PING_URL:-}"

# Logging configuration (structured JSON)
standard_logging = "${STANDARD_LOGGING:-true}"
standard_logging_format = "${LOG_FORMAT:-json}"
request_logging = "${REQUEST_LOGGING:-true}"
auth_logging = "${AUTH_LOGGING:-true}"

# Error pages
error_template = "/etc/oauth2-proxy/templates/error.html"

# Banner (optional)
banner = "${BANNER_MESSAGE:-}"
footer = "${FOOTER_MESSAGE:-}"

# Force HTTPS (recommended for production)
force_https = "${FORCE_HTTPS:-true}"

# Metrics
metrics_address = "0.0.0.0:${METRICS_PORT:-4181}"
metrics_address = "${METRICS_ENABLED:-true}"
