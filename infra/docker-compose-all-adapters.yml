# OpenEvolve Federation Complete Docker Compose Configuration
#
# Following CLAUDE.md principles:
# - Law of Configuration Explicitness: All config via env vars (NO MAGIC DEFAULTS)
# - Service names: Use Docker service names for discovery
# - Timeouts: All operations bounded
# - Health checks: All services have /health endpoints
#
# Usage:
#   docker-compose -f docker-compose-all-adapters.yml up -d      # Start all services
#   docker-compose -f docker-compose-all-adapters.yml up <svc>   # Start specific service
#   docker-compose -f docker-compose-all-adapters.yml down        # Stop all services
#   docker-compose -f docker-compose-all-adapters.yml logs -f    # View logs
#
# Environment Configuration:
#   Create a .env file in this directory with all required variables
#   See .env.example for template

version: '3.8'

services:
  # ========================================
  # Core Infrastructure
  # ========================================
  event-bus:
    image: redis:7-alpine
    container_name: federation-event-bus
    hostname: event-bus
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      - TZ=UTC
    networks:
      - federation-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis-data:/data

  # ========================================
  # Python Adapters
  # ========================================
  curie-globalchem:
    build:
      context: ..
      dockerfile: glue/adapters/curie-globalchem-integration/Dockerfile
    container_name: curie-globalchem-adapter
    hostname: curie-globalchem
    ports:
      - "${CURIE_GLOBALCHEM_PORT:-5000}:5000"
    environment:
      # REQUIRED - Service will crash if missing
      - CURIE_GLOBALCHEM_API_URL=${CURIE_GLOBALCHEM_API_URL}
      - CURIE_GLOBALCHEM_API_KEY=${CURIE_GLOBALCHEM_API_KEY}

      # Optional with defaults
      - CURIE_GLOBALCHEM_TIMEOUT_MS=${CURIE_GLOBALCHEM_TIMEOUT_MS:-30000}
      - CURIE_GLOBALCHEM_MAX_RETRIES=${CURIE_GLOBALCHEM_MAX_RETRIES:-3}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - TZ=UTC

      # Event bus configuration
      - EVENT_BUS_URL=redis://event-bus:6379
      - EVENT_BUS_CHANNEL_PREFIX=curie-globalchem

    volumes:
      - curie-data:/data
      - ../glue/adapters/curie-globalchem-integration:/app/glue/adapters/curie-globalchem-integration:ro
    networks:
      - federation-network
    depends_on:
      event-bus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

