# LoongFlow Adapter Kubernetes Deployment Manifests
#
# Following CLAUDE.md principles:
# - Law of Configuration Explicitness: All config via env vars (NO MAGIC DEFAULTS)
# - Service names: Use Kubernetes service names for discovery
# - Timeouts: All operations bounded
# - Health checks: Liveness and readiness probes
# - High Availability: HPA + PDB for production
#
# Usage:
#   kubectl apply -f k8s-loongflow-deployment.yaml
#   kubectl get pods -n loongflow-system
#   kubectl logs -f deployment/loongflow-adapter -n loongflow-system
#   kubectl delete -f k8s-loongflow-deployment.yaml

---
apiVersion: v1
kind: Namespace
metadata:
  name: loongflow-system
  labels:
    name: loongflow-system
    app: openevolve-federation

---
# ConfigMap for LoongFlow Adapter Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: loongflow-adapter-config
  namespace: loongflow-system
data:
  # Adapter timeouts (milliseconds)
  LOONGFLOW_TIMEOUT_MS: "30000"
  LOONGFLOW_MAX_RETRIES: "3"
  LOONGFLOW_MAX_CONCURRENT_WORKFLOWS: "5"

  # Checkpointing
  LOONGFLOW_ENABLE_CHECKPOINTING: "true"

  # Service port
  PORT: "8040"

  # Logging configuration
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # Timezone (Law of UTC)
  TZ: "UTC"

  # Contract testing
  SKIP_CONTRACT_TESTS: "false"

  # Hybrid orchestration
  ENABLE_HYBRID_ORCHESTRATION: "true"
  ENABLE_PES_FALLBACK: "true"
  PES_TIMEOUT_MS: "60000"
  PES_MAX_ITERATIONS: "10"

  # Event bus configuration
  EVENT_BUS_URL: "redis://event-bus:6379"
  EVENT_BUS_CHANNEL_PREFIX: "loongflow"

---
# Secret for LoongFlow API connection
apiVersion: v1
kind: Secret
metadata:
  name: loongflow-adapter-secrets
  namespace: loongflow-system
type: Opaque
stringData:
  # LoongFlow Core API URL (internal Kubernetes service)
  LOONGFLOW_API_URL: "http://loongflow-core-service.loongflow-system.svc.cluster.local:8050"

---
# LoongFlow Adapter Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loongflow-adapter
  namespace: loongflow-system
  labels:
    app: loongflow-adapter
    component: adapter
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: loongflow-adapter
  template:
    metadata:
      labels:
        app: loongflow-adapter
        component: adapter
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8040"
        prometheus.io/path: "/metrics"
    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      # Init container to wait for LoongFlow core
      initContainers:
      - name: wait-for-loongflow-core
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            until nc -z -v -w30 loongflow-core-service 8050; do
              echo "Waiting for LoongFlow core service..."
              sleep 5
            done
            echo "LoongFlow core service is ready!"

      containers:
      - name: loongflow-adapter
        image: loongflow-adapter:latest
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 8040
          protocol: TCP

        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: loongflow-adapter-config

        # Environment variables from Secret
        env:
        - name: LOONGFLOW_API_URL
          valueFrom:
            secretKeyRef:
              name: loongflow-adapter-secrets
              key: LOONGFLOW_API_URL

        # Resource limits (Law of Configuration Explicitness)
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        # Volume mounts
        volumeMounts:
        - name: loongflow-data
          mountPath: /data
        - name: loongflow-logs
          mountPath: /var/log/loongflow-adapter

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
          successThreshold: 1

        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1

        # Startup probe
        startupProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
          successThreshold: 1

      # Volumes
      volumes:
      - name: loongflow-data
        persistentVolumeClaim:
          claimName: loongflow-data-pvc
      - name: loongflow-logs
        persistentVolumeClaim:
          claimName: loongflow-logs-pvc

      # Node affinity (optional, for production)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - loongflow-adapter
              topologyKey: kubernetes.io/hostname

---
# LoongFlow Adapter Service
apiVersion: v1
kind: Service
metadata:
  name: loongflow-adapter-service
  namespace: loongflow-system
  labels:
    app: loongflow-adapter
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
  - name: http
    port: 8040
    targetPort: http
    protocol: TCP
  selector:
    app: loongflow-adapter

---
# LoongFlow Adapter ServiceAccount (if RBAC is needed)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loongflow-adapter
  namespace: loongflow-system
  labels:
    app: loongflow-adapter

---
# Persistent Volume Claim for data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loongflow-data-pvc
  namespace: loongflow-system
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

---
# Persistent Volume Claim for logs
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loongflow-logs-pvc
  namespace: loongflow-system
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Gi
  storageClassName: standard

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loongflow-adapter-hpa
  namespace: loongflow-system
  labels:
    app: loongflow-adapter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loongflow-adapter
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 1
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

---
# Pod Disruption Budget for high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: loongflow-adapter-pdb
  namespace: loongflow-system
  labels:
    app: loongflow-adapter
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: loongflow-adapter

---
# NetworkPolicy (optional, for security)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loongflow-adapter-netpol
  namespace: loongflow-system
  labels:
    app: loongflow-adapter
spec:
  podSelector:
    matchLabels:
      app: loongflow-adapter
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: loongflow-system
    - podSelector:
        matchLabels:
          app: loongflow-core
    ports:
    - protocol: TCP
      port: 8040
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: loongflow-system
    - podSelector:
        matchLabels:
          app: loongflow-core
    ports:
    - protocol: TCP
      port: 8050
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 6379  # Redis/event-bus
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53    # DNS

---
# Prometheus ServiceMonitor (if using Prometheus Operator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loongflow-adapter
  namespace: loongflow-system
  labels:
    app: loongflow-adapter
spec:
  selector:
    matchLabels:
      app: loongflow-adapter
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
