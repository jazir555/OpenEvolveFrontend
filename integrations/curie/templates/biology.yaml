# Biology Experiment Templates for Curie
# Domain: Biology
# Covers molecular biology, genetics, biochemistry, cell biology, and microbiology

domain: biology
name: Biology Experiments
description: Automated experimentation framework for biology domains

# Experiment subfields
subfields:
  - molecular_biology
  - genetics
  - biochemistry
  - cell_biology
  - microbiology

# Standard equipment for biology experiments
standard_equipment:
  - biosafety_cabinet
  - incubator
  - centrifuge
  - microscope
  - pcr_machine
  - electrophoresis_system
  - spectrophotometer
  - autoclave
  - water_bath
  - shaker
  - freezer_minus_80
  - refrigerator
  - microplate_reader
  - flow_cytometer
  - sequencer

# Common materials
common_materials:
  - cell_lines
  - bacteria
  - enzymes
  - primers
  - vectors
  - antibodies
  - dyes
  - culture_media

# Protocol template for biology experiments
protocol_template:
  - step_number: 1
    title: Biosafety Preparation
    description: Review biosafety protocols and prepare containment
    action: prepare_biosafety
    parameters:
      biosafety_level: BSL-1
      sterilization_method: autoclave
      personal_protective_equipment: true
    materials: []
    equipment:
      - biosafety_cabinet
      - ppe
    duration: 300  # 5 minutes
    safety_notes:
      - Wear appropriate PPE (lab coat, gloves, safety glasses)
      - Work in biosafety cabinet when required
      - Follow sterile techniques
      - Disinfect work surfaces before and after
    validation_criteria:
      biosafety_prepared: true
      sterile_field_established: true

  - step_number: 2
    title: Media and Reagent Preparation
    description: Prepare culture media and experimental reagents
    action: prepare_media
    parameters:
      sterilization_method: autoclave
      temperature: 37  # Celsius
      ph: 7.4
    materials:
      - culture_media
      - supplements
      - antibiotics
    equipment:
      - autoclave
      - water_bath
      - ph_meter
      - balance
    duration: 1800  # 30 minutes
    safety_notes:
      - Autoclave all media and solutions
      - Use aseptic technique
      - Check pH before and after sterilization
      - Label all media clearly
    validation_criteria:
      media_prepared: true
      sterile: true
      ph_correct: true

  - step_number: 3
    title: Sample/Cell Preparation
    description: Prepare biological samples or cell cultures
    action: prepare_samples
    parameters:
      cell_density: 1000000  # cells/mL
      viability_threshold: 95  # percent
      passage_number: low
    materials:
      - cell_lines
      - bacteria
      - culture_media
    equipment:
      - biosafety_cabinet
      - incubator
      - microscope
      - hemocytometer
    duration: 3600  # 1 hour
    safety_notes:
      - Maintain sterile conditions
      - Handle biological materials carefully
      - Verify cell viability before experiment
      - Document passage numbers
    validation_criteria:
      samples_prepared: true
      viability_acceptable: true
      contamination_free: true

  - step_number: 4
    title: Experimental Setup
    description: Set up experimental conditions and controls
    action: setup_experiment
    parameters:
      replicates: 3
      controls: positive_negative
      randomization: true
    materials:
      - prepared_samples
      - culture_media
      - experimental_compounds
    equipment:
      - biosafety_cabinet
      - incubator
      - microplate_reader
    duration: 900  # 15 minutes
    safety_notes:
      - Include appropriate controls
      - Randomize sample placement
      - Label all samples clearly
      - Maintain sterile conditions
    validation_criteria:
      experiment_setup: true
      controls_included: true
      replicates_prepared: true

  - step_number: 5
    title: Treatment Application
    description: Apply experimental treatments
    action: apply_treatments
    parameters:
      treatment_duration: variable
      treatment_concentration: variable
      application_method: variable
    materials:
      - experimental_compounds
      - vectors
      - viruses
    equipment:
      - biosafety_cabinet
      - pipettes
    duration: 300  # 5 minutes
    safety_notes:
      - Apply treatments consistently
      - Document exact treatment times
      - Handle hazardous materials appropriately
      - Maintain sterile conditions
    validation_criteria:
      treatments_applied: true
      timing_recorded: true
      consistent_application: true

  - step_number: 6
    title: Incubation/Reaction
    description: Allow biological processes to occur
    action: incubation
    parameters:
      temperature: 37  # Celsius
      humidity: 95  # percent
      co2_level: 5  # percent
      duration: variable
    materials:
      - experimental_cultures
    equipment:
      - incubator
      - shaker
    duration: variable  # Minutes to days
    safety_notes:
      - Monitor incubator conditions
      - Check for contamination
      - Maintain proper temperature and humidity
      - Document any abnormalities
    validation_criteria:
      incubation_complete: true
      conditions_maintained: true
      contamination_absent: true

  - step_number: 7
    title: Sample Collection and Processing
    description: Collect and process samples for analysis
    action: process_samples
    parameters:
      processing_method: variable
      storage_temperature: -80  # Celsius
      preservation_method: variable
    materials:
      - cultured_samples
      - reagents
      - preservatives
    equipment:
      - centrifuge
      - freezer_minus_80
      - biosafety_cabinet
    duration: 1800  # 30 minutes
    safety_notes:
      - Follow proper sample handling procedures
      - Maintain cold chain if required
      - Use appropriate biosafety precautions
      - Label all samples clearly
    validation_criteria:
      samples_collected: true
      samples_processed: true
      samples_stored: true

  - step_number: 8
    title: Analysis
    description: Analyze samples using appropriate methods
    action: analyze_samples
    parameters:
      analytical_method: variable
      measurement_type: variable
      replicates: 3
    materials:
      - processed_samples
      - reagents
      - standards
    equipment:
      - spectrophotometer
      - microplate_reader
      - pcr_machine
      - electrophoresis_system
      - sequencer
    duration: 3600  # 1 hour
    safety_notes:
      - Follow equipment operating procedures
      - Include appropriate controls
      - Document all measurements
      - Handle hazardous waste properly
    validation_criteria:
      analysis_complete: true
      measurements_accurate: true
      data_quality_good: true

  - step_number: 9
    title: Data Analysis
    description: Analyze experimental data and statistics
    action: analyze_data
    parameters:
      statistical_tests: appropriate
      significance_level: 0.05
      software: standard
    materials: []
    equipment:
      - computers
    duration: 1800  # 30 minutes
    safety_notes: []
    validation_criteria:
      statistical_analysis_complete: true
      results_significant: true
      data_presented_clearly: true

  - step_number: 10
    title: Documentation and Cleanup
    description: Document results and clean up workspace
    action: document_and_cleanup
    parameters:
      documentation_format: standard
      waste_disposal: biohazard
      decontamination_method: autoclave
    materials: []
    equipment:
      - autoclave
      - biohazard_waste_containers
    duration: 900  # 15 minutes
    safety_notes:
      - Autoclave all biohazardous waste
      - Decontaminate work surfaces
      - Dispose of sharps properly
      - Clean and store equipment
    validation_criteria:
      documentation_complete: true
      workspace_decontaminated: true
      waste_disposed_properly: true

