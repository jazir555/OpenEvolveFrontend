# Validation templates
validation_templates:
  reproducibility_checks:
    - Maintain sterile conditions
    - Use consistent passage numbers
    - Control environmental conditions
    - Include biological and technical replicates
    - Verify cell viability and purity

  quality_control:
    - Test for contamination
    - Verify reagent quality
    - Include positive and negative controls
    - Monitor growth conditions
    - Validate experimental protocols

  statistical_validation:
    - Perform appropriate statistical tests
    - Calculate confidence intervals
    - Determine statistical power
    - Account for biological variability
    - Validate assumptions

# Common analysis methods
analysis_methods:
  - dna_rna_quantification
  - protein_quantification
  - enzyme_kinetics
  - cell_viability_assays
  - gene_expression_analysis
  - microscopy_analysis
  - flow_cytometry_analysis
  - statistical_analysis

# Documentation requirements
documentation_requirements:
  - experimental_design
  - materials_and_methods
  - cell_line_information
  - culture_conditions
  - treatment_protocol
  - measurements_and_observations
  - raw_data
  - statistical_analysis
  - results
  - conclusions
  - biosafety_considerations

# Biosafety considerations
biosafety:
  level_1:
    description: "Basic laboratory practices"
    practices:
      - standard_microbiological_practices
      - no_special_containment
    ppe:
      - lab_coat
      - gloves
      - eye_protection

  level_2:
    description: "Laboratory with moderate risk"
    practices:
      - limited_access
      - biosafety_cabinet
      - sharps_precautions
      - medical_surveillance
    ppe:
      - lab_coat
      - gloves
      - eye_protection
      - face_shield_as_needed
