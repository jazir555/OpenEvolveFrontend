# Chemistry Experiment Templates for Curie
# Domain: Chemistry
# Covers organic, inorganic, physical, analytical, and biochemistry

domain: chemistry
name: Chemistry Experiments
description: Automated experimentation framework for chemistry domains

# Experiment subfields
subfields:
  - organic_chemistry
  - inorganic_chemistry
  - physical_chemistry
  - analytical_chemistry
  - biochemistry

# Standard equipment for chemistry experiments
standard_equipment:
  - fume_hood
  - balance
  - hotplate
  - magnetic_stirrer
  - reflux_condenser
  - separatory_funnel
  - chromatography_system
  - spectrometer
  - nmr_spectrometer
  - mass_spectrometer
  - ph_meter
  - thermocouple

# Common materials
common_materials:
  - solvents
  - reagents
  - catalysts
  - indicators
  - standards

# Protocol template for chemistry experiments
protocol_template:
  - step_number: 1
    title: Safety Preparation
    description: Review safety data sheets and prepare safety equipment
    action: prepare_safety
    parameters:
      safety_level: standard
      emergency_equipment_checked: true
    materials: []
    equipment:
      - fume_hood
      - safety_equipment
    duration: 300  # 5 minutes
    safety_notes:
      - Wear appropriate PPE (lab coat, gloves, safety glasses)
      - Ensure proper ventilation
      - Locate emergency equipment
      - Review SDS for all chemicals
    validation_criteria:
      safety_prepared: true
      emergency_equipment_accessible: true

  - step_number: 2
    title: Glassware Preparation
    description: Clean and dry all glassware, verify integrity
    action: prepare_glassware
    parameters:
      cleaning_method: standard
      drying_method: oven
    materials:
      - glassware
    equipment:
      - oven
      - glassware
    duration: 600  # 10 minutes
    safety_notes:
      - Inspect glassware for cracks or chips
      - Use proper handling techniques
      - Allow hot glassware to cool slowly
    validation_criteria:
      glassware_clean: true
      glassware_intact: true

  - step_number: 3
    title: Reagent Preparation
    description: Prepare solutions and measure reagents
    action: prepare_reagents
    parameters:
      concentration_accuracy: 0.01  # M
      temperature_tolerance: 2  # Celsius
    materials:
      - solvents
      - reagents
    equipment:
      - balance
      - volumetric_glassware
      - ph_meter
    duration: 900  # 15 minutes
    safety_notes:
      - Work in fume hood when handling volatile chemicals
      - Add acid to water, not water to acid
      - Label all solutions clearly
    validation_criteria:
      reagents_prepared: true
      concentrations_verified: true
      ph_verified: true

  - step_number: 4
    title: Initial Measurements
    description: Record baseline measurements before reaction
    action: baseline_measurements
    parameters:
      temperature: 25  # Celsius
      pressure: ambient
      initial_ph: 7.0
    materials:
      - reagents
    equipment:
      - thermometer
      - ph_meter
      - spectrometer
    duration: 600  # 10 minutes
    safety_notes:
      - Record all initial conditions
      - Verify equipment calibration
    validation_criteria:
      baseline_recorded: true
      initial_conditions_stable: true

  - step_number: 5
    title: Reaction Setup
    description: Combine reagents and initiate reaction
    action: initiate_reaction
    parameters:
      mixing_method: magnetic_stirring
      stirring_rate: 300  # rpm
      temperature_control: true
      target_temperature: 25  # Celsius
    materials:
      - reagents
      - catalysts
    equipment:
      - round_bottom_flask
      - magnetic_stirrer
      - hotplate
      - reflux_condenser
      - thermometer
    duration: 300  # 5 minutes
    safety_notes:
      - Add reagents slowly and carefully
      - Monitor for exothermic reactions
      - Keep reaction vessel in fume hood
      - Be prepared for unexpected events
    validation_criteria:
      reaction_initiated: true
      mixing_adequate: true
      temperature_controlled: true

  - step_number: 6
    title: Reaction Monitoring
    description: Monitor reaction progress and conditions
    action: monitor_reaction
    parameters:
      monitoring_interval: 60  # seconds
      sampling_method: periodic
      analytical_methods:
        - tlc
        - spectroscopy
        - temperature
        - ph
    materials:
      - reaction_mixture
      - tlc_plates
      - eluents
    equipment:
      - tlc_chamber
      - spectrometer
      - thermometer
      - ph_meter
    duration: 3600  # 1 hour (varies by reaction)
    safety_notes:
      - Continue monitoring until reaction complete
      - Document all observations
      - Maintain temperature control
      - Watch for signs of side reactions
    validation_criteria:
      reaction_complete: true
      product_formation_confirmed: true
      side_reactions_minimal: true

  - step_number: 7
    title: Workup
    description: Isolate and purify product
    action: workup
    parameters:
      workup_method: extraction
      purification_method: recrystallization
      solvent_removal: rotary_evaporator
    materials:
      - reaction_mixture
      - extraction_solvents
      - drying_agents
      - recrystallization_solvent
    equipment:
      - separatory_funnel
      - rotary_evaporator
      - filtration_apparatus
    duration: 1800  # 30 minutes
    safety_notes:
      - Handle organic solvents in fume hood
      - Use proper waste disposal
      - Be cautious with vacuum equipment
    validation_criteria:
      product_isolated: true
      purity_acceptable: true

  - step_number: 8
    title: Product Characterization
    description: Characterize product using analytical techniques
    action: characterize_product
    parameters:
      analytical_techniques:
        - nmr
        - ir
        - mass_spec
        - melting_point
      reference_standards: true
    materials:
      - isolated_product
      - deuterated_solvents
      - standards
    equipment:
      - nmr_spectrometer
      - ir_spectrometer
      - mass_spectrometer
      - melting_point_apparatus
    duration: 3600  # 1 hour
    safety_notes:
      - Follow instrument operating procedures
      - Use appropriate sample preparation
    validation_criteria:
      characterization_complete: true
      product_identified: true
      purity_determined: true

  - step_number: 9
    title: Data Analysis
    description: Analyze experimental data and calculate yields
    action: analyze_data
    parameters:
      yield_calculation: true
      purity_analysis: true
      statistical_analysis: true
    materials: []
    equipment:
      - computers
    duration: 1800  # 30 minutes
    safety_notes: []
    validation_criteria:
      analysis_complete: true
      yield_calculated: true
      results_documented: true

  - step_number: 10
    title: Documentation and Cleanup
    description: Document results and clean up workspace
    action: document_and_cleanup
    parameters:
      documentation_format: standard
      waste_disposal: proper
    materials: []
    equipment:
      - waste_containers
    duration: 600  # 10 minutes
    safety_notes:
      - Dispose of waste properly
      - Clean all glassware
      - Store products appropriately
    validation_criteria:
      documentation_complete: true
      workspace_clean: true
      waste_disposed_properly: true

# Domain-specific parameter templates
parameter_templates:
  organic_chemistry:
    common_parameters:
      - functional_groups
      - reaction_mechanism
      - stereochemistry
      - regioselectivity
      - yield
    reaction_types:
      - substitution
      - addition
      - elimination
      - rearrangement
      - oxidation_reduction
      - pericyclic_reactions
    purification_methods:
      - distillation
      - recrystallization
      - chromatography
      - extraction

  inorganic_chemistry:
    common_parameters:
      - coordination_number
      - geometry
      - oxidation_state
      - ligand_field
      - magnetic_properties
    reaction_types:
      - synthesis
      - ligand_substitution
      - redox_reactions
      - coordination_complex_formation
    characterization_methods:
      - x_ray_crystallography
      - magnetic_measurements
      - electronic_spectroscopy

  physical_chemistry:
    common_parameters:
      - thermodynamics
      - kinetics
      - quantum_chemistry
      - statistical_mechanics
    measurement_types:
      - reaction_rates
      - equilibrium_constants
      - thermodynamic_parameters
      - spectroscopic_properties
    theoretical_considerations:
      - quantum_mechanical_calculations
      - molecular_modeling
      - computational_chemistry

  analytical_chemistry:
    common_parameters:
      - concentration
      - detection_limit
      - precision
      - accuracy
      - selectivity
    analysis_methods:
      - titration
      - spectroscopy
      - chromatography
      - electrochemical_methods
      - mass_spectrometry
    validation:
      - calibration_curves
      - quality_control_samples
      - method_validation

  biochemistry:
    common_parameters:
      - enzyme_activity
      - protein_structure
      - metabolic_pathways
      - binding_constants
    experimental_methods:
      - enzyme_kinetics
      - protein_purification
      - chromatography
      - spectroscopy
    safety_considerations:
      - biological_materials_handling
      - sterile_techniques
      - proper_disposal

# Validation templates
validation_templates:
  reproducibility_checks:
    - Verify reagent purity
    - Control reaction temperature
    - Monitor reaction time precisely
    - Use consistent workup procedures
    - Run control experiments

  analytical_validation:
    - Calibrate instruments
    - Run standards
    - Perform method validation
    - Calculate detection limits
    - Determine precision and accuracy

  statistical_validation:
    - Perform replicate measurements
    - Calculate confidence intervals
    - Determine reproducibility
    - Analyze variance
    - Validate assumptions

# Common analysis methods
analysis_methods:
  - yield_calculation
  - purity_analysis
  - structural_elucidation
  - kinetic_analysis
  - thermodynamic_analysis
  - spectroscopic_analysis
  - chromatographic_analysis

# Documentation requirements
documentation_requirements:
  - reaction_scheme
  - reagents_and_quantities
  - experimental_procedure
  - observations
  - analytical_data
  - results_and_discussion
  - conclusions
  - safety_considerations
  - waste_disposal
