project:
  name: Graphiti
  version: 0.1.0
  enabled: true

connection:
  # Backend: neo4j or falkordb
  backend: neo4j

  # Connection URI
  # Neo4j: bolt://localhost:7687
  # FalkorDB: redis://localhost:6379
  uri: bolt://localhost:7687

  # Neo4j credentials (not used for FalkorDB)
  user: neo4j
  password: ${NEO4J_PASSWORD}  # Set environment variable

features:
  # Track temporal metadata for all knowledge
  temporal_tracking: true

  # Enable hybrid search: semantic + BM25 + graph traversal
  hybrid_search: true

  # Temporal reasoning capabilities
  temporal_reasoning:
    enabled: true
    # Default time range for temporal queries (in hours)
    default_time_range_hours: 24
    # Track knowledge validity (valid_at, invalid_at)
    track_validity: true
    # Enable point-in-time queries
    point_in_time_queries: true

  # Hybrid search configuration
  hybrid_search:
    enabled: true
    # Search components to use
    components:
      use_bm25: true  # Keyword search
      use_vector: true  # Semantic search
      use_graph_traversal: true  # BFS for related entities
    # Reranking method: rrf, cross_encoder, weighted, none
    rerank_method: rrf
    # Reranking configuration
    reranking:
      # Reciprocal Rank Fusion parameter
      rrf_k: 60
      # Cross-encoder model (if using cross_encoder)
      cross_encoder_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
      # Weighted combination weights
      weights:
        bm25: 0.3
        vector: 0.5
        graph_traversal: 0.2

  # Contradiction detection
  contradiction_detection:
    enabled: true
    # Patterns to look for
    patterns:
      - "not "
      - "never "
      - "cannot "
      - "won't "
      - "however "
      - "but "
      - "contrary "
      - "opposite "
    # Minimum confidence threshold
    confidence_threshold: 0.5

  # Entity type mappings
  entity_mappings:
    solution_pattern: Procedure
    critique_insight: Requirement
    team_performance: Preference
    problem: Event
    workflow: Document
    agent: Organization
    tool: Technology
    technique: Methodology

  # Optional MCP server for isolation
  mcp_server: false

integration:
  # Auto-start on initialization
  auto_start: true

  # Enable caching for improved performance
  cache_enabled: true

  # Cache TTL in seconds
  cache_ttl: 3600

  # Fall back gracefully on errors
  fallback_on_error: true

performance:
  # Max concurrent workers
  max_workers: 4

  # Operation timeout in seconds
  timeout: 30

  # Batch size for bulk operations
  batch_size: 100

logging:
  # Logging level: DEBUG, INFO, WARNING, ERROR
  level: INFO

  # Log file path (optional, leave empty to log to console)
  file: ""
