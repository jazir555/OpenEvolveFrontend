# NeuroMANCER Integration Configuration
# This configuration controls the NeuroMANCER physics-informed optimization integration

project:
  name: NeuroMANCER
  version: 0.1.0
  description: Physics-informed optimization and system identification
  enabled: true

# Connection settings for the isolated PyTorch environment
connection:
  # Name of the conda environment containing PyTorch and NeuroMANCER
  # Create with: conda create -n neuromancer_env python=3.9 pytorch torchvision torchaudio
  pytorch_env: neuromancer_env

  # Device to use for computation
  # Options: 'cuda', 'cpu', 'cuda:0', 'cuda:1', etc.
  device: cpu

  # Optional: Path to NeuroMANCER installation
  # If None, assumes NeuroMANCER is installed in the conda environment
  neuromancer_path: null

  # Maximum number of parallel workers for optimization
  max_workers: 4

  # Timeout in seconds for optimization operations
  timeout: 30

# Feature flags for NeuroMANCER capabilities
features:
  # Physics-informed system identification from data
  system_identification: true

  # Constrained optimization with equality/inequality constraints
  constrained_optimization: true

  # Differentiable programming with automatic differentiation
  differentiable_programming: true

  # Physics-informed constraints (conservation laws, etc.)
  physics_informed: true

  # Hybrid solver combining LeanAide (symbolic) + NeuroMANCER (numerical)
  hybrid_solver: true

# Available problem templates
templates:
  - ode_problems        # Ordinary differential equations
  - pde_problems        # Partial differential equations
  - optimization_problems  # Constrained/unconstrained optimization
  - system_identification  # System identification from data
  - control_problems    # Optimal control problems

# Integration settings
integration:
  # Auto-start NeuroMANCER when needed
  auto_start: true

  # Enable LeanAide integration for hybrid symbolic-numerical solving
  leanaide_integration: true

  # Enable result caching
  cache_enabled: true

  # Cache time-to-live in seconds
  cache_ttl: 3600

  # Fall back to pure numerical solving if symbolic analysis fails
  fallback_on_error: true

# Performance tuning parameters
performance:
  # Number of parallel workers (must be <= connection.max_workers)
  num_workers: 4

  # Default batch size for optimization
  batch_size: 100

  # Learning rate for gradient-based optimization
  learning_rate: 0.001

  # Maximum number of optimization iterations
  max_iterations: 1000

  # Convergence tolerance
  tolerance: 1.0e-6

  # Random seed for reproducibility
  random_seed: 42

# Hybrid solver settings (LeanAide + NeuroMANCER)
hybrid_solver:
  # Hybrid mode: 'sequential', 'parallel', or 'adaptive'
  # - sequential: LeanAide first, then NeuroMANCER
  # - parallel: Both run independently, results combined
  # - adaptive: Iterative refinement between both
  mode: sequential

  # Maximum refinement iterations for adaptive mode
  max_iterations: 3

  # Convergence tolerance for adaptive refinement
  convergence_tolerance: 1.0e-6

  # Whether to verify solutions symbolically
  verify_solutions: true

# Logging settings
logging:
  # Log level: 'DEBUG', 'INFO', 'WARNING', 'ERROR'
  level: INFO

  # Log file path (null for stdout only)
  file: null

  # Whether to log detailed solver information
  verbose: false

# Solver-specific defaults
solvers:
  # ODE solver settings
  ode:
    # Default method: 'euler', 'rk4', 'neural_ode', 'automatic'
    method: automatic

    # Time step for fixed-step methods
    time_step: 0.01

    # Absolute error tolerance
    atol: 1.0e-8

    # Relative error tolerance
    rtol: 1.0e-6

  # PDE solver settings
  pde:
    # Number of collocation points for PINN
    num_collocation_points: 1000

    # Neural network architecture for PINN
    hidden_layers: [64, 64, 64]

    # Activation function
    activation: tanh

    # Number of training epochs
    epochs: 1000

  # Optimization solver settings
  optimization:
    # Method: 'gradient_descent', 'adam', 'lbfgs', 'interior_point'
    method: adam

    # Whether to use automatic differentiation
    use_autodiff: true

    # Penalty parameter for constraint violation
    penalty_parameter: 1000.0

  # System identification settings
  system_identification:
    # Model type: 'neural_ode', 'linear', 'nonlinear'
    model_type: neural_ode

    # Training/validation split ratio
    train_ratio: 0.8

    # Number of epochs for training
    epochs: 500

    # Early stopping patience
    early_stopping_patience: 50

# Error handling
error_handling:
  # Maximum number of retry attempts
  max_retries: 3

  # Retry delay in seconds
  retry_delay: 1.0

  # Whether to raise exceptions or return error results
  raise_on_error: false

  # Fallback to simpler solver if advanced solver fails
  fallback_to_simple: true
