# PDE Problem Template
# This template defines common partial differential equation problems

template_name: pde_problems
description: Partial differential equation problem templates

# Example problems
examples:

  # Heat equation (diffusion)
  heat_equation:
    type: pde
    name: Heat Equation
    description: Parabolic PDE modeling heat diffusion
    equation: ∂u/∂t = α∇²u
    variables:
      - name: u
        description: Temperature field
        initial_condition: u(x,0) = sin(πx)
      - name: alpha
        description: Thermal diffusivity
        value: 0.01
    domain:
      type: interval
      dimensions: 1
      bounds: [[0, 1]]
    time_span: [0, 1]
    boundary_conditions:
      - type: dirichlet
        location: x=0
        value: u(0,t) = 0
      - type: dirichlet
        location: x=1
        value: u(1,t) = 0
    method: pinn
    analytical_solution: u(x,t) = exp(-απ²t)sin(πx)

  # Wave equation
  wave_equation:
    type: pde
    name: Wave Equation
    description: Hyperbolic PDE modeling wave propagation
    equation: ∂²u/∂t² = c²∇²u
    variables:
      - name: u
        description: Wave amplitude
        initial_condition:
          position: u(x,0) = sin(πx)
          velocity: ∂u/∂t(x,0) = 0
      - name: c
        description: Wave speed
        value: 1.0
    domain:
      type: interval
      dimensions: 1
      bounds: [[0, 1]]
    time_span: [0, 2]
    boundary_conditions:
      - type: dirichlet
        location: x=0
        value: u(0,t) = 0
      - type: dirichlet
        location: x=1
        value: u(1,t) = 0
    method: pinn
    analytical_solution: u(x,t) = sin(πx)cos(πct)

  # Laplace equation (steady-state)
  laplace_equation:
    type: pde
    name: Laplace Equation
    description: Elliptic PDE for steady-state problems
    equation: ∇²u = 0
    variables:
      - name: u
        description: Potential field
    domain:
      type: rectangle
      dimensions: 2
      bounds: [[0, 1], [0, 1]]
    boundary_conditions:
      - type: dirichlet
        location: x=0
        value: u(0,y) = 0
      - type: dirichlet
        location: x=1
        value: u(1,y) = sin(πy)
      - type: dirichlet
        location: y=0
        value: u(x,0) = 0
      - type: dirichlet
        location: y=1
        value: u(x,1) = 0
    method: pinn
    analytical_solution: u(x,y) = sinh(πx)/sinh(π) * sin(πy)

  # Burgers' equation (nonlinear)
  burgers_equation:
    type: pde
    name: Burgers' Equation
    description: Nonlinear PDE modeling shock waves
    equation: ∂u/∂t + u∂u/∂x = ν∂²u/∂x²
    variables:
      - name: u
        description: Velocity field
        initial_condition: u(x,0) = -sin(πx)
      - name: nu
        description: Viscosity
        value: 0.01
    domain:
      type: interval
      dimensions: 1
      bounds: [[-1, 1]]
    time_span: [0, 1]
    boundary_conditions:
      - type: periodic
    method: pinn
    notes: Develops shock waves for small viscosity

  # Navier-Stokes (incompressible flow)
  navier_stokes:
    type: pde
    name: Navier-Stokes Equation
    description: Fluid flow equations
    equations:
      - ∂u/∂t + (u·∇)u = -∇p/ρ + ν∇²u
      - ∇·u = 0  # Incompressibility
    variables:
      - name: u
        description: Velocity field (vector)
        initial_condition: u(x,0) = (0, 0)
      - name: p
        description: Pressure field
      - name: rho
        description: Density
        value: 1.0
      - name: nu
        description: Kinematic viscosity
        value: 0.01
    domain:
      type: rectangle
      dimensions: 2
      bounds: [[0, 1], [0, 1]]
    time_span: [0, 1]
    boundary_conditions:
      - type: noslip
        location: all boundaries
        value: u = 0
    method: pinn
    notes: "Challenging due to pressure-velocity coupling"

  # Reaction-diffusion equation
  reaction_diffusion:
    type: pde
    name: Reaction-Diffusion Equation
    description: PDE with diffusion and reaction terms
    equation: ∂u/∂t = D∇²u + f(u)
    variables:
      - name: u
        description: Concentration field
        initial_condition: u(x,y,0) = exp(-10[(x-0.5)² + (y-0.5)²])
      - name: D
        description: Diffusion coefficient
        value: 0.01
      - name: reaction
        description: Reaction term f(u)
        type: fisher
        # Fisher equation: f(u) = ku(1-u)
        parameter: k = 1.0
    domain:
      type: rectangle
      dimensions: 2
      bounds: [[0, 1], [0, 1]]
    time_span: [0, 1]
    boundary_conditions:
      - type: neumann
        location: all boundaries
        value: ∂u/∂n = 0
    method: pinn
    notes: "Exhibits traveling wave solutions"

  # Schrödinger equation (quantum mechanics)
  schrodinger_equation:
    type: pde
    name: Schrödinger Equation
    description: Time-dependent Schrödinger equation
    equation: iℏ∂ψ/∂t = [-ℏ²/(2m)∇² + V]ψ
    variables:
      - name: psi
        description: Wave function (complex)
        initial_condition: ψ(x,0) = exp(-x²/2)
      - name: V
        description: Potential
        type: harmonic_oscillator
        V(x) = 0.5*x²
      - name: hbar
        description: Reduced Planck constant
        value: 1.0
      - name: m
        description: Particle mass
        value: 1.0
    domain:
      type: interval
      dimensions: 1
      bounds: [[-5, 5]]
    time_span: [0, 5]
    boundary_conditions:
      - type: dirichlet
        location: x=-5
        value: 0
      - type: dirichlet
        location: x=5
        value: 0
    method: pinn
    notes: "Requires complex-valued neural network"

# Problem categories
categories:
  parabolic:
    description: Time-dependent diffusion problems
    examples: [heat_equation, reaction_diffusion]
    characteristics: "First-order in time, second-order in space"

  hyperbolic:
    description: Wave propagation problems
    examples: [wave_equation]
    characteristics: "Second-order in both time and space"

  elliptic:
    description: Steady-state problems
    examples: [laplace_equation]
    characteristics: "No time dependence"

  nonlinear:
    description: Nonlinear PDEs
    examples: [burgers_equation, navier_stokes]
    characteristics: "Nonlinear terms in solution or derivatives"

  systems:
    description: Systems of coupled PDEs
    examples: [navier_stokes, schrodinger_equation]
    characteristics: "Multiple coupled equations"

# PINN (Physics-Informed Neural Network) configuration
pinn_config:
  # Network architecture
  architecture:
    hidden_layers: [64, 64, 64, 64]
    activation: tanh
    output_activation: linear

  # Training parameters
  training:
    epochs: 1000
    batch_size: 100
    learning_rate: 0.001
    optimizer: adam

  # Collocation points for physics loss
  collocation:
    # Number of interior collocation points
    num_interior: 1000

    # Number of boundary collocation points
    num_boundary: 100

    # Number of initial condition points
    num_initial: 100

    # Sampling strategy: 'random', 'latin_hypercube', 'grid'
    sampling_strategy: latin_hypercube

  # Loss weighting
  loss_weights:
    data: 1.0  # Data loss (if measurements available)
    physics: 1.0  # PDE residual loss
    boundary: 1.0  # Boundary condition loss
    initial: 1.0  # Initial condition loss

# Solver recommendations
solver_recommendations:
  linear_parabolic:
    method: pinn
    architecture: [32, 32, 32]
    epochs: 500
    reason: "Relatively simple, converges quickly"

  linear_hyperbolic:
    method: pinn
    architecture: [64, 64, 64]
    epochs: 1000
    reason: "Needs more capacity for wave solutions"

  nonlinear:
    method: pinn
    architecture: [128, 128, 128, 128]
    epochs: 5000
    learning_rate: 0.0001
    reason: "Requires deeper network and careful training"

  systems:
    method: pinn
    architecture: [64, 64, 64]
    epochs: 2000
    reason: "Multiple outputs require balanced training"

# Common boundary conditions
boundary_condition_types:
  dirichlet:
    description: Fixed value at boundary
    example: u(x,t) = f(x,t)

  neumann:
    description: Fixed derivative at boundary
    example: ∂u/∂n = g(x,t)

  robin:
    description: Linear combination of value and derivative
    example: a*u + b*∂u/∂n = h(x,t)

  periodic:
    description: Values match at opposite boundaries
    example: u(0,t) = u(L,t)

# Domain types
domain_types:
  interval:
    dimensions: 1
    bounds: [x_min, x_max]

  rectangle:
    dimensions: 2
    bounds: [[x_min, x_max], [y_min, y_max]]

  cuboid:
    dimensions: 3
    bounds: [[x_min, x_max], [y_min, y_max], [z_min, z_max]]

  custom:
    description: User-defined domain (e.g., circle, sphere)
    boundary_function: required

# Validation and testing
validation:
  # Compare with analytical solution if available
  analytical_comparison: true

  # Compute error metrics
  metrics:
    - L2_error
    - H1_error  # Energy norm
    - max_error
    - residual_norm

  # Visualization
  visualization:
    plot_solution: true
    plot_error: true
    plot_residual: true
