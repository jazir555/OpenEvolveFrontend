# OneKE Integration Configuration for OpenEvolve
# This file configures the OneKE schema-guided information extraction system

project:
  name: OneKE
  version: 0.1.0
  enabled: true
  description: Schema-guided knowledge extraction for OpenEvolve workflows

# Connection settings
connection:
  # Model category: ChatGPT, LLaMA, etc.
  model_category: ChatGPT

  # Model name or path
  model_name_or_path: gpt-4o-mini

  # API key (use environment variable for security)
  api_key: ${OPENAI_API_KEY}

  # Use Docker environment (alternative: Conda)
  docker: false

  # Conda environment name (if not using Docker)
  conda_env: oneke

  # Path to OneKE installation (optional, auto-detected if not set)
  oneke_path: ${ONEKE_PATH}

# Feature flags
features:
  # Named Entity Recognition
  ner: true

  # Relation Extraction
  re: true

  # Event Extraction
  ee: true

  # Triple Extraction (subject-relation-object)
  triple: true

  # Multi-agent extraction workflows
  multi_agent: true

# Schema definitions to load
schemas:
  - physics_concepts
  - chemical_entities
  - relations

# Integration settings
integration:
  # Auto-start OneKE server on initialization
  auto_start: true

  # Enable extraction result caching
  cache_enabled: true

  # Cache TTL in seconds
  cache_ttl: 3600

  # Use fallback extraction on error
  fallback_on_error: true

# Performance settings
performance:
  # Maximum parallel workers
  max_workers: 4

  # Request timeout in seconds
  timeout: 30

  # Batch size for batch extraction
  batch_size: 100

# Schema directory (relative to this config file)
schema_directory: ./schemas

# Logging
logging:
  level: INFO
  file: oneke_integration.log
