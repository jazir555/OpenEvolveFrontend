# Enhanced OneKE Configuration
# Configuration for reflection, quality enhancement, and case-based learning

reflection:
  enabled: true
  iterations: 3          # Number of reflection cycles
  num_samples: 3         # Number of samples for self-consistency
  temperature: 0.3       # Temperature for sampling

quality_enhancement:
  strategies:
    - reflection          # Use reflection agent
    - validation          # Schema validation
    - cases              # Case-based retrieval
    - consistency        # Self-consistency checking
  min_quality_threshold: 0.7   # Minimum quality for auto-acceptance
  auto_refine: true            # Automatically refine low-quality extractions

case_repository:
  storage_path: "data/oneke_cases.json"
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  min_similarity: 0.7          # Minimum similarity for case retrieval
  auto_save: true
  save_interval: 100           # Save every 100 cases

learning:
  enabled: true
  feedback_required: false     # Require human feedback for learning
  learning_rate: 0.1
  case_limit: 10000            # Maximum cases to store

# Advanced settings
advanced:
  # Reflection settings
  reflection:
    consistency_threshold: 0.7      # Minimum agreement ratio for consistency
    quality_improvement_threshold: 0.05  # Minimum improvement to keep refinement

  # Case retrieval settings
  case_retrieval:
    default_top_k: 5               # Default number of cases to retrieve
    domain_weight: 0.3             # Weight for domain matching
    quality_weight: 0.4            # Weight for quality score
    similarity_weight: 0.3         # Weight for semantic similarity

  # Quality scoring weights
  quality_weights:
    completeness: 0.3
    accuracy: 0.3
    consistency: 0.2
    confidence: 0.2

  # Validation settings
  validation:
    strict_mode: false             # Whether to reject invalid extractions
    auto_fix: true                 # Automatically fix validation errors

# Domain-specific settings
domains:
  physics:
    strategies:
      - reflection
      - cases
      - consistency
    min_quality_threshold: 0.75
    case_similarity_threshold: 0.75

  chemistry:
    strategies:
      - reflection
      - validation
      - cases
    min_quality_threshold: 0.75
    case_similarity_threshold: 0.75

  mathematics:
    strategies:
      - reflection
      - consistency
      - validation
    min_quality_threshold: 0.8
    case_similarity_threshold: 0.8

  software_engineering:
    strategies:
      - reflection
      - cases
      - validation
    min_quality_threshold: 0.7
    case_similarity_threshold: 0.7

  general:
    strategies:
      - reflection
      - validation
    min_quality_threshold: 0.65
    case_similarity_threshold: 0.65
