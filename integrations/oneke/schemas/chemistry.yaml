# Chemical Entities Schema for OneKE
# This schema guides extraction of chemical knowledge from workflows

name: chemical_entities
description: Extract chemical substances, reactions, and properties

entity_types:
  - name: substance
    description: Chemical substances and compounds
    examples:
      - water
      - carbon dioxide
      - benzene
      - protein
      - polymer

  - name: element
    description: Chemical elements
    examples:
      - hydrogen
      - carbon
      - oxygen
      - nitrogen

  - name: functional_group
    description: Organic functional groups
    examples:
      - hydroxyl group
      - carbonyl group
      - amino group
      - carboxyl group

  - name: reaction
    description: Chemical reactions
    examples:
      - combustion
      - oxidation
      - reduction
      - substitution
      - addition

  - name: catalyst
    description: Catalysts and enzymes
    examples:
      - platinum catalyst
      - enzyme
      - transition metal complex

  - name: property
    description: Chemical and physical properties
    examples:
      - boiling point
      - melting point
      - solubility
      - acidity
      - reactivity

  - name: structure
    description: Molecular structures
    examples:
      - linear
      - branched
      - cyclic
      - aromatic

relation_types:
  - name: contains
    description: Substance contains element or group
    examples:
      - Water contains hydrogen
      - Benzene contains aromatic ring

  - name: undergoes
    description: Substance undergoes reaction
    examples:
      - Methane undergoes combustion
      - Substrate undergoes enzymatic reaction

  - name: catalyzes
    description: Catalyst catalyzes reaction
    examples:
      - Platinum catalyzes hydrogenation
      - Enzyme catalyzes metabolic reaction

  - name: has_property
    description: Substance has property
    examples:
      - Water has boiling point 100°C
      - Acid has low pH

  - name: reacts_with
    description: Two substances react with each other
    examples:
      - Acid reacts with base
      - Oxidizer reacts with fuel

  - name: decomposes_to
    description: Substance decomposes into products
    examples:
      - Hydrogen peroxide decomposes to water and oxygen

event_types:
  - name: chemical_reaction
    description: Chemical reaction events
    attributes:
      - reactants
      - products
      - conditions
      - yield

  - name: phase_transition
    description: Phase changes
    attributes:
      - initial_phase
      - final_phase
      - temperature
      - pressure

  - name: synthesis
    description: Chemical synthesis events
    attributes:
      - target_compound
      - precursors
      - method

constraints:
  # Focus on relevant chemistry domains
  domains:
    - organic_chemistry
    - inorganic_chemistry
    - biochemistry
    - materials_chemistry

  # Minimum confidence threshold
  min_confidence: 0.7

examples:
  - text: |
      The combustion of methane (CH4) with oxygen produces carbon
      dioxide and water: CH4 + 2O2 → CO2 + 2H2O. This reaction
      releases 890 kJ/mol of heat.

    entities:
      - text: methane
        type: substance

      - text: oxygen
        type: substance

      - text: carbon dioxide
        type: substance

      - text: water
        type: substance

      - text: combustion
        type: reaction

    relations:
      - source: methane
        type: reacts_with
        target: oxygen

      - source: methane
        type: undergoes
        target: combustion

  - text: |
      The enzyme catalase catalyzes the decomposition of hydrogen
      peroxide into water and oxygen: 2H2O2 → 2H2O + O2.

    entities:
      - text: catalase
        type: catalyst

      - text: hydrogen peroxide
        type: substance

      - text: water
        type: substance

      - text: oxygen
        type: substance

      - text: decomposition
        type: reaction

    relations:
      - source: catalase
        type: catalyzes
        target: decomposition

      - source: hydrogen peroxide
        type: undergoes
        target: decomposition
