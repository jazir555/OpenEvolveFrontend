# Physics Concepts Schema for OneKE
# This schema guides extraction of physics domain knowledge from workflows

name: physics_concepts
description: Extract physics concepts, observables, dynamics, and quantum mechanical concepts

entity_types:
  - name: quantum_system
    description: Quantum mechanical systems (particles, oscillators, spins)
    examples:
      - harmonic oscillator
      - hydrogen atom
      - spin-1/2 system
      - quantum field

  - name: observable
    description: Physical observables that can be measured
    examples:
      - energy
      - momentum
      - position
      - angular momentum
      - spin

  - name: state
    description: Quantum states and wavefunctions
    examples:
      - ground state
      - excited state
      - superposition
      - entangled state
      - coherent state

  - name: operator
    description: Mathematical operators representing physical quantities
    examples:
      - Hamiltonian
      - momentum operator
      - creation/annihilation operators
      - Pauli matrices

  - name: dynamic_equation
    description: Equations governing time evolution
    examples:
      - Schrödinger equation
      - Heisenberg equation
      - master equation
      - Lindblad equation

  - name: approximation_method
    description: Approximation techniques in physics
    examples:
      - perturbation theory
      - variational method
      - WKB approximation
      - mean field theory

  - name: symmetry
    description: Symmetries and conservation laws
    examples:
      - translational invariance
      - rotational symmetry
      - gauge symmetry
      - time reversal

relation_types:
  - name: describes
    description: Observable describes a property of a system
    examples:
      - Energy describes harmonic oscillator

  - name: evolves_by
    description: State evolves by an equation
    examples:
      - Wavefunction evolves by Schrödinger equation

  - name: acts_on
    description: Operator acts on a state
    examples:
      - Hamiltonian acts on quantum state

  - name: approximates
    description: Method approximates a system
    examples:
      - Perturbation theory approximates anharmonic oscillator

  - name: conserves
    description: Symmetry leads to conservation
    examples:
      - Translational invariance conserves momentum

  - name: couples
    description: Two systems are coupled
    examples:
      - Two oscillators couple through interaction

event_types:
  - name: measurement
    description: Quantum measurement events
    attributes:
      - observable
      - outcome
      - probability

  - name: state_preparation
    description: Preparation of quantum states
    attributes:
      - initial_state
      - method

  - name: evolution
    description: Time evolution events
    attributes:
      - duration
      - equation

constraints:
  # Focus on quantum and computational physics
  domains:
    - quantum_mechanics
    - computational_physics
    - statistical_mechanics

  # Minimum confidence threshold
  min_confidence: 0.7

examples:
  - text: |
      The quantum harmonic oscillator is described by the Hamiltonian
      H = (p^2/2m) + (1/2)mω^2x^2. The ground state wavefunction is
      a Gaussian. Energy eigenvalues are E_n = ℏω(n + 1/2).

    entities:
      - text: quantum harmonic oscillator
        type: quantum_system

      - text: Hamiltonian
        type: operator

      - text: ground state
        type: state

      - text: wavefunction
        type: state

    relations:
      - source: Hamiltonian
        type: describes
        target: quantum harmonic oscillator

      - source: Hamiltonian
        type: acts_on
        target: ground state

  - text: |
      We use perturbation theory to approximate the energy levels of
      the anharmonic oscillator. The first-order correction gives
      ΔE = <n|V|n>.

    entities:
      - text: perturbation theory
        type: approximation_method

      - text: anharmonic oscillator
        type: quantum_system

      - text: energy levels
        type: observable

    relations:
      - source: perturbation theory
        type: approximates
        target: anharmonic oscillator
