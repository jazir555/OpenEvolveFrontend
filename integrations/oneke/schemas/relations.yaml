# Relations Schema for OneKE
# This schema guides extraction of relationships between concepts

name: relations
description: Extract causal, compositional, and dependency relations

entity_types:
  - name: concept
    description: General concepts and entities
    examples:
      - algorithm
      - model
      - system
      - process

  - name: property
    description: Properties and attributes
    examples:
      - complexity
      - accuracy
      - performance
      - scalability

  - name: constraint
    description: Constraints and requirements
    examples:
      - time limit
      - memory limit
      - requirement
      - restriction

relation_types:
  - name: causes
    description: Causal relationship
    examples:
      - Optimization causes performance improvement
      - Error causes failure

  - name: enables
    description: Enablement relationship
    examples:
      - GPU enables parallel processing
      - API enables integration

  - name: requires
    description: Dependency relationship
    examples:
      - Training requires data
      - Inference requires model

  - name: improves
    description: Improvement relationship
    examples:
      - Optimization improves speed
      - Regularization improves generalization

  - name: reduces
    description: Reduction relationship
    examples:
      - Compression reduces size
      - Pruning reduces complexity

  - name: part_of
    description: Compositional relationship
    examples:
      - Layer is part of network
      - Function is part of module

  - name: similar_to
    description: Similarity relationship
    examples:
      - CNN similar to vision transformer
      - Method A similar to method B

  - name: different_from
    description: Difference relationship
    examples:
      - Classification different from regression
      - Supervised different from unsupervised

  - name: applies_to
    description: Application relationship
    examples:
      - Algorithm applies to problem
      - Technique applies to domain

  - name: characterized_by
    description: Characterization relationship
    examples:
      - Model characterized by accuracy
      - System characterized by latency

constraints:
  # Relation types to focus on
  priority_relations:
    - causes
    - enables
    - requires
    - improves

  # Minimum confidence threshold
  min_confidence: 0.6

examples:
  - text: |
      We use gradient descent to optimize the neural network parameters.
      This approach reduces the loss function and improves model accuracy.
      However, training requires large amounts of data and computational
      resources.

    entities:
      - text: gradient descent
        type: concept

      - text: neural network
        type: concept

      - text: loss function
        type: property

      - text: model accuracy
        type: property

      - text: data
        type: constraint

      - text: computational resources
        type: constraint

    relations:
      - source: gradient descent
        type: applies_to
        target: neural network

      - source: gradient descent
        type: reduces
        target: loss function

      - source: gradient descent
        type: improves
        target: model accuracy

      - source: training
        type: requires
        target: data

      - source: training
        type: requires
        target: computational resources

  - text: |
      The modular architecture enables easy extension of the system.
      Each component is part of a larger framework and can be updated
      independently. This design improves maintainability and reduces
      coupling between modules.

    entities:
      - text: modular architecture
        type: concept

      - text: extension
        type: concept

      - text: component
        type: concept

      - text: framework
        type: concept

      - text: maintainability
        type: property

      - text: coupling
        type: property

    relations:
      - source: modular architecture
        type: enables
        target: extension

      - source: component
        type: part_of
        target: framework

      - source: modular architecture
        type: improves
        target: maintainability

      - source: modular architecture
        type: reduces
        target: coupling
