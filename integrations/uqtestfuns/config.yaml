project:
  name: uqtestfuns
  version: 0.1.0
  enabled: true

connection:
  # uqtestfuns is pure Python, no connection needed
  # Install with: pip install uqtestfuns

features:
  test_functions: true
  probabilistic_inputs: true
  uncertainty_propagation: true
  sensitivity_analysis: true

test_functions:
  # Available test functions from uqtestfuns
  # Add more as needed for your use cases
  - ishigami          # Classic sensitivity analysis test function
  - ackley            # Multimodal optimization test function
  - rosenbrock        # Valley-shaped optimization test function
  - branin            # 2D test function for global optimization
  - sphere            # Simple convex optimization test function
  - styblinski-tang   # Fourth-degree polynomial test function
  - michalewicz       # Multimodal test function with sharp ridges
  - otlcircuit        # Analog circuit test function
  - wing-weight       # Aircraft design test function
  - piston            # Engineering design test function
  - sobol-g           # Sobol's G-function
  - friedman          # Friedman's test function
  - marriage          # Marriage function
  - bohachevsky       # Bohachevsky's test function
  - colville          # Colville's test function
  - dixon-price       # Dixon-Price test function
  - goldstein-price   # Goldstein-Price test function
  - hartmann          # Hartmann's test function
  - trid              # Trid function
  - wolfe             # Wolfe function
  - wood              # Wood's test function

integration:
  auto_start: true
  cache_enabled: true
  cache_ttl: 3600
  fallback_on_error: true

performance:
  max_workers: 4
  timeout: 30
  batch_size: 100

sampling:
  default_method: monte_carlo
  available_methods:
    - monte_carlo
    - latin_hypercube
    - sobol
    - halton
    - grid

sensitivity:
  default_method: sobol
  available_methods:
    - sobol
    - morris
    - fast
    - delta

validation:
  enabled: true
  confidence_level: 0.95
  significance_level: 0.05

caching:
  function_cache_size: 100
  result_cache_size: 50
  ttl_seconds: 3600

logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
