# Unified MCP Gateway Configuration
# This file configures the gateway that routes tool calls to multiple MCP servers

gateway:
  host: "0.0.0.0"
  port: 8080
  log_level: "INFO"
  max_workers: 10
  request_timeout: 120  # seconds
  enable_cors: true

servers:
  kggen:
    enabled: true
    url: "http://localhost:8001"
    timeout: 30
    namespace: "kggen"
    description: "kg-gen knowledge graph memory system"
    health_check_interval: 60  # seconds

  graphiti:
    enabled: true
    url: "http://localhost:8002"
    timeout: 30
    namespace: "graphiti"
    description: "Graphiti knowledge graph system"
    health_check_interval: 60

  openevolve:
    enabled: true
    url: "http://localhost:8003"
    timeout: 30
    namespace: "openevolve"
    description: "OpenEvolve evolutionary computation system"
    health_check_interval: 60

  crewai:
    enabled: true
    url: "http://localhost:8004"
    timeout: 45
    namespace: "crewai"
    description: "CrewAI orchestration and delegation system"
    health_check_interval: 60

  roma:
    enabled: true
    url: "http://localhost:8005"
    timeout: 45
    namespace: "roma"
    description: "ROMA recursive meta-agent system"
    health_check_interval: 60

  ace:
    enabled: true
    url: "http://localhost:8006"
    timeout: 30
    namespace: "ace"
    description: "ACE (Agentic Context Engine) learning system"
    health_check_interval: 60

tool_registry:
  categorization_enabled: true
  versioning_enabled: true
  deprecation_grace_period: 30  # days
  cache_ttl: 300  # seconds (5 minutes)

routing:
  load_balancing: "round_robin"  # round_robin, least_connections, random
  circuit_breaker_threshold: 5
  circuit_breaker_timeout: 60  # seconds
  fallback_enabled: true
  max_retries: 3
  retry_delay: 1  # seconds

monitoring:
  metrics_enabled: true
  log_tool_calls: true
  alert_on_failures: true
  analytics_retention_days: 30
  performance_tracking: true

cache:
  enabled: true
  backend: "memory"  # memory, redis
  ttl: 300  # seconds
  max_size: 1000  # number of entries

namespaces:
  # Tool namespace prefixes
  # Tools will be exposed as: namespace/tool_name
  kggen: "kggen"
  graphiti: "graphiti"
  openevolve: "openevolve"
  crewai: "crewai"
  roma: "roma"
  ace: "ace"

security:
  api_key_required: false
  rate_limiting:
    enabled: true
    requests_per_minute: 100
  max_request_size: 10485760  # 10MB
