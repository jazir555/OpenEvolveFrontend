global:
  # Global defaults
  resolve_timeout: 5m
  # Slack webhook URL (set via environment variable)
  slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

# Route configuration
route:
  # Default receiver for all alerts
  receiver: 'default'

  # Group alerts by these labels
  group_by: ['alertname', 'bubble', 'severity']

  # Wait time before sending first notification
  group_wait: 10s

  # Wait time before sending notification about new alerts in group
  group_interval: 10s

  # Wait time before sending notification after last alert
  repeat_interval: 12h

  # Child routes
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 5m
      routes:
        # Security critical alerts
        - match:
            team: security
          receiver: 'security-team'
          group_wait: 0s
          repeat_interval: 2m

    # Warning alerts
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 1h

# Inhibition rules
inhibit_rules:
  # Inhibit warning alerts if critical alert is firing for same bubble
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['bubble', 'alertname']

  # Inhibit circuit breaker alerts if service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '(CircuitBreakerOpen|HighErrorRate)'
    equal: ['instance']

# Receivers configuration
receivers:
  - name: 'default'
    slack_configs:
      - channel: '#bubblelab-alerts'
        title: 'BubbleLab Alert: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Severity:* {{ .Labels.severity }}
          *Bubble:* {{ .Labels.bubble }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook_url }}
          {{ end }}
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        actions:
          - type: button
            text: 'View in Grafana'
            url: '{{ .ExternalURL }}'
          - type: button
            text: 'Runbook'
            url: '{{ .Annotations.runbook_url }}'

  - name: 'critical-alerts'
    slack_configs:
      - channel: '#bubblelab-critical'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Severity:* {{ .Labels.severity }}
          *Bubble:* {{ .Labels.bubble }}
          *Instance:* {{ .Labels.instance }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Runbook:* {{ .Annotations.runbook_url }}
          *Started:* {{ .StartsAt }}
          {{ end }}
        send_resolved: true
        color: 'danger'
        username: 'BubbleLab AlertManager'
        icon_emoji: ':rotating_light:'
        actions:
          - type: button
            text: 'Acknowledge'
            url: '{{ .ExternalURL }}'
          - type: button
            text: 'View Dashboard'
            url: 'http://grafana:3000/d/bubblelab-overview'

  - name: 'security-team'
    slack_configs:
      - channel: '#security-alerts'
        title: '🔒 SECURITY: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Security Alert:* {{ .Labels.alertname }}
          *Severity:* {{ .Labels.severity }}
          *Bubble:* {{ .Labels.bubble }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Immediate Action Required*
          {{ end }}
        send_resolved: true
        color: 'danger'
        username: 'BubbleLab Security'
        icon_emoji: ':lock:'

  - name: 'warning-alerts'
    slack_configs:
      - channel: '#bubblelab-warnings'
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Severity:* {{ .Labels.severity }}
          *Bubble:* {{ .Labels.bubble }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
        color: 'warning'
        username: 'BubbleLab AlertManager'
        icon_emoji: ':warning:'

  # Email receiver configuration (optional)
  - name: 'email-alerts'
    email_configs:
      - to: 'platform-team@bubblelab.ai'
        from: 'alertmanager@bubblelab.ai'
        smarthost: 'smtp.gmail.com:587'
        auth_username: 'alertmanager@bubblelab.ai'
        auth_password: '${SMTP_PASSWORD}'
        headers:
          Subject: 'BubbleLab Alert: {{ .GroupLabels.alertname }}'
        html: >-
          {{ range .Alerts }}
          <h2>{{ .Labels.alertname }}</h2>
          <p><strong>Severity:</strong> {{ .Labels.severity }}</p>
          <p><strong>Bubble:</strong> {{ .Labels.bubble }}</p>
          <p><strong>Summary:</strong> {{ .Annotations.summary }}</p>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Runbook:</strong> <a href="{{ .Annotations.runbook_url }}">View</a></p>
          <hr>
          {{ end }}

# Templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Time intervals
time_intervals:
  - name: 'business-hours'
    time_intervals:
      - times:
          - start_time: '09:00'
            end_time: '17:00'
        weekdays: ['monday:friday']

  - name: 'off-hours'
    time_intervals:
      - times:
          - start_time: '17:00'
            end_time: '09:00'
        weekdays: ['monday:friday']
      - weekdays: ['saturday:sunday']

