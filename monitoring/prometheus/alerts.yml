groups:
  # ============================================================================
  # CRITICAL ALERTS (P0)
  # ============================================================================
  - name: bubblelab.critical
    interval: 30s
    rules:
      # High Error Rate Alert
      - alert: HighErrorRate
        expr: |
          sum(rate(bubble_error_total[5m])) by (bubble)
          /
          sum(rate(bubble_operation_total[5m])) by (bubble)
          > 0.1
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Error rate above 10% for {{ $labels.bubble }}"
          description: "Bubble {{ $labels.bubble }} has an error rate of {{ $value | humanizePercentage }} for the last 5 minutes"
          runbook_url: "https://docs.bubblelab.ai/runbooks/high-error-rate"

      # Circuit Breaker Open Alert
      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state{state="open"} == 1
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Circuit breaker open for {{ $labels.bubble }}"
          description: "Circuit breaker for bubble {{ $labels.bubble }} is open. Requests are being rejected."
          runbook_url: "https://docs.bubblelab.ai/runbooks/circuit-breaker-open"

      # High Authentication Failure Rate
      - alert: HighAuthFailureRate
        expr: |
          sum(rate(bubble_authentication_error_total[1m])) by (bubble)
          > 50/60
        for: 2m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "High authentication failure rate for {{ $labels.bubble }}"
          description: "Bubble {{ $labels.bubble }} is experiencing {{ $value | humanize }} authentication failures per minute"
          runbook_url: "https://docs.bubblelab.ai/runbooks/high-auth-failures"

      # Service Down Alert
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} on {{ $labels.instance }} has been down for more than 2 minutes"
          runbook_url: "https://docs.bubblelab.ai/runbooks/service-down"

      # Database Connection Failure
      - alert: DatabaseConnectionFailure
        expr: |
          sum(rate(bubble_error_total{error_type="database_error"}[1m])) by (bubble)
          > 10/60
        for: 3m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Database connection failures for {{ $labels.bubble }}"
          description: "Bubble {{ $labels.bubble }} is experiencing database connection errors at {{ $value | humanize }} errors/min"
          runbook_url: "https://docs.bubblelab.ai/runbooks/database-connection-failure"

      # Memory Exhaustion
      - alert: MemoryExhaustion
        expr: |
          sum(bubble_memory_usage_bytes) by (bubble)
          /
          sum(bubble_memory_limit_bytes) by (bubble)
          > 0.95
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Memory exhaustion for {{ $labels.bubble }}"
          description: "Bubble {{ $labels.bubble }} is using {{ $value | humanizePercentage }} of available memory"
          runbook_url: "https://docs.bubblelab.ai/runbooks/memory-exhaustion"

  # ============================================================================
  # WARNING ALERTS (P1)
  # ============================================================================
  - name: bubblelab.warning
    interval: 30s
    rules:
      # Slow Operations (P95)
      - alert: SlowOperations
        expr: |
          histogram_quantile(0.95,
            sum(rate(bubble_operation_duration_seconds_bucket[5m])) by (le, bubble)
          ) > 30
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "P95 latency above 30s for {{ $labels.bubble }}"
          description: "Bubble {{ $labels.bubble }} has P95 latency of {{ $value | humanizeDuration }}"
          runbook_url: "https://docs.bubblelab.ai/runbooks/slow-operations"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: |
          sum(bubble_memory_usage_bytes) by (bubble)
          /
          sum(bubble_memory_limit_bytes) by (bubble)
          > 0.8
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Memory usage above 80% for {{ $labels.bubble }}"
          description: "Bubble {{ $labels.bubble }} is using {{ $value | humanizePercentage }} of available memory"
          runbook_url: "https://docs.bubblelab.ai/runbooks/high-memory-usage"

      # Rate Limit Breach
      - alert: RateLimitBreach
        expr: |
          sum(increase(rate_limit_exceeded_total[5m])) by (bubble)
          > 100
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Rate limit breaches for {{ $labels.bubble }}"
          description: "Bubble {{ $labels.bubble }} has exceeded rate limits {{ $value | humanize }} times in the last 5 minutes"
          runbook_url: "https://docs.bubblelab.ai/runbooks/rate-limit-breach"

      # High Retry Rate
      - alert: HighRetryRate
        expr: |
          sum(rate(bubble_operation_retry_total[5m])) by (bubble)
          /
          sum(rate(bubble_operation_total[5m])) by (bubble)
          > 0.05
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High retry rate for {{ $labels.bubble }}"
          description: "Bubble {{ $labels.bubble }} has a retry rate of {{ $value | humanizePercentage }}"
          runbook_url: "https://docs.bubblelab.ai/runbooks/high-retry-rate"

      # Database Connection Pool Exhaustion
      - alert: DatabaseConnectionPoolExhaustion
        expr: |
          sum(db_connection_pool_usage{pool_type="active"}) by (bubble)
          /
          sum(db_connection_pool_usage{pool_type="max"}) by (bubble)
          > 0.9
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Database connection pool near exhaustion for {{ $labels.bubble }}"
          description: "Bubble {{ $labels.bubble }} is using {{ $value | humanizePercentage }} of database connection pool"
          runbook_url: "https://docs.bubblelab.ai/runbooks/db-pool-exhaustion"

      # Increasing Error Rate Trend
      - alert: IncreasingErrorRate
        expr: |
          predict_linear(
            sum(rate(bubble_error_total[5m])) by (bubble)[30m:5m],
            10*60
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Error rate increasing for {{ $labels.bubble }}"
          description: "Bubble {{ $labels.bubble }} error rate is predicted to exceed 5% in the next 10 minutes"
          runbook_url: "https://docs.bubblelab.ai/runbooks/increasing-error-rate"

  # ============================================================================
  # SECURITY ALERTS (P0)
  # ============================================================================
  - name: bubblelab.security
    interval: 30s
    rules:
      # SQL Injection Attempts
      - alert: SQLInjectionAttempts
        expr: |
          sum(increase(sql_injection_blocked_total[5m])) by (bubble)
          > 10
        for: 2m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "SQL injection attempts detected on {{ $labels.bubble }}"
          description: "Bubble {{ $labels.bubble }} has blocked {{ $value | humanize }} SQL injection attempts in the last 5 minutes"
          runbook_url: "https://docs.bubblelab.ai/runbooks/sql-injection-attempts"

      # XSS Attempts
      - alert: XSSAttempts
        expr: |
          sum(increase(xss_blocked_total[5m])) by (bubble)
          > 10
        for: 2m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "XSS attempts detected on {{ $labels.bubble }}"
          description: "Bubble {{ $labels.bubble }} has blocked {{ $value | humanize }} XSS attempts in the last 5 minutes"
          runbook_url: "https://docs.bubblelab.ai/runbooks/xss-attempts"

      # Unauthorized Access Spike
      - alert: UnauthorizedAccessSpike
        expr: |
          sum(increase(unauthorized_access_total[5m])) by (bubble)
          > 50
        for: 2m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Unauthorized access spike on {{ $labels.bubble }}"
          description: "Bubble {{ $labels.bubble }} has detected {{ $value | humanize }} unauthorized access attempts in the last 5 minutes"
          runbook_url: "https://docs.bubblelab.ai/runbooks/unauthorized-access-spike"

      # Validation Error Spike
      - alert: ValidationErrorSpike
        expr: |
          sum(increase(bubble_validation_error_total[5m])) by (bubble)
          > 100
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "Validation error spike on {{ $labels.bubble }}"
          description: "Bubble {{ $labels.bubble }} has experienced {{ $value | humanize }} validation errors in the last 5 minutes"
          runbook_url: "https://docs.bubblelab.ai/runbooks/validation-error-spike"

  # ============================================================================
  # PERFORMANCE ALERTS (P1)
  # ============================================================================
  - name: bubblelab.performance
    interval: 30s
    rules:
      # High P99 Latency
      - alert: HighP99Latency
        expr: |
          histogram_quantile(0.99,
            sum(rate(bubble_operation_duration_seconds_bucket[5m])) by (le, bubble)
          ) > 60
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "P99 latency above 60s for {{ $labels.bubble }}"
          description: "Bubble {{ $labels.bubble }} has P99 latency of {{ $value | humanizeDuration }}"
          runbook_url: "https://docs.bubblelab.ai/runbooks/high-p99-latency"

      # Low Throughput
      - alert: LowThroughput
        expr: |
          sum(rate(bubble_operation_total{status="success"}[5m])) by (bubble)
          < 1/60
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Low throughput for {{ $labels.bubble }}"
          description: "Bubble {{ $labels.bubble }} is processing less than 1 successful operation per minute"
          runbook_url: "https://docs.bubblelab.ai/runbooks/low-throughput"

      # Active Operations Backlog
      - alert: ActiveOperationsBacklog
        expr: |
          sum(bubble_active_operations) by (bubble)
          > 1000
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Active operations backlog for {{ $labels.bubble }}"
          description: "Bubble {{ $labels.bubble }} has {{ $value | humanize }} active operations"
          runbook_url: "https://docs.bubblelab.ai/runbooks/operations-backlog"

  # ============================================================================
  # AVAILABILITY ALERTS (P0)
  # ============================================================================
  - name: bubblelab.availability
    interval: 30s
    rules:
      # Health Check Failure
      - alert: HealthCheckFailure
        expr: |
          sum(up{job="bubblelab"}) by (instance)
          < 1
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Health check failing for {{ $labels.instance }}"
          description: "Instance {{ $labels.instance }} health check has been failing for 2 minutes"
          runbook_url: "https://docs.bubblelab.ai/runbooks/health-check-failure"

      # Readiness Check Failure
      - alert: ReadinessCheckFailure
        expr: |
          sum(up{job="bubblelab-readiness"}) by (instance)
          < 1
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Readiness check failing for {{ $labels.instance }}"
          description: "Instance {{ $labels.instance }} is not ready to serve traffic"
          runbook_url: "https://docs.bubblelab.ai/runbooks/readiness-check-failure"
