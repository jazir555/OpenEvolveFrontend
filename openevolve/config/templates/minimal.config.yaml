# Minimal Configuration Template
# Essential parameters only - good for quick start

# Core
max_iterations: 30
population_size: 20
evolution_mode: standard

# LLM
model_id: gpt-4o-mini
temperature: 0.7

# Features
enable_planning: true
enable_memory: false
qd_enabled: false
enable_gauntlet: false

# Logging
log_level: INFO

# Output
save_final_results: true
output_dir: ./output

# Performance
parallel_workers: 1
