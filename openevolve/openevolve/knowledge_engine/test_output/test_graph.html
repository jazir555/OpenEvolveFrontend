<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Graph Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #graph {
            width: 1200px;
            height: 800px;
            border: 1px solid #ccc;
            background: #fafafa;
        }
        .node {
            stroke: #fff;
            stroke-width: 1.5px;
            cursor: pointer;
        }
        .node:hover {
            stroke: #000;
            stroke-width: 2.5px;
        }
        .link {
            stroke-opacity: 0.6;
        }
        .link.solid {
            stroke-dasharray: none;
        }
        .link.dashed {
            stroke-dasharray: 5, 5;
        }
        .label {
            font-size: 10px;
            pointer-events: none;
            text-anchor: middle;
        }
        #tooltip {
            position: absolute;
            padding: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            border-radius: 5px;
            pointer-events: none;
            display: none;
            z-index: 1000;
        }
        #legend {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        #stats {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="graph"></div>
    <div id="tooltip"></div>
    <div id="legend">
        <strong>Communities</strong><br/>
        <div id="legend-items"></div>
    </div>
    <div id="stats">
        <strong>Statistics</strong><br/>
        <div id="stats-content"></div>
    </div>

    <script>
        // Graph data
        const graphData = {"nodes": [{"id": "Alice", "community": 0, "color": "#0072B2", "size": 12.370322551008115, "centrality": 0.36851612755040575, "degree": 2}, {"id": "Bob", "community": 0, "color": "#0072B2", "size": 12.92940968307805, "centrality": 0.3964704841539025, "degree": 2}, {"id": "Company", "community": 1, "color": "#D55E00", "size": 18.614692185640624, "centrality": 0.6807346092820312, "degree": 3}, {"id": "Cupertino", "community": 1, "color": "#D55E00", "size": 8.521915003118288, "centrality": 0.17609575015591444, "degree": 1}, {"id": "Steve", "community": 0, "color": "#0072B2", "size": 12.92940968307805, "centrality": 0.3964704841539025, "degree": 2}], "edges": [{"source": "Alice", "target": "Bob", "predicate": "knows", "confidence": 1.0, "type": "solid"}, {"source": "Alice", "target": "Steve", "predicate": "colleague_of", "confidence": 1.0, "type": "solid"}, {"source": "Bob", "target": "Company", "predicate": "works_for", "confidence": 1.0, "type": "solid"}, {"source": "Company", "target": "Cupertino", "predicate": "located_in", "confidence": 1.0, "type": "solid"}, {"source": "Company", "target": "Steve", "predicate": "founded", "confidence": 1.0, "type": "solid"}], "options": {"width": 1200, "height": 800, "showLabels": true, "enableZoom": true, "enablePhysics": true}};

        // Setup SVG
        const width = 1200;
        const height = 800;

        const svg = d3.select("#graph")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

        // Zoom behavior
        
        const zoom = d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (event) => {
                container.attr("transform", event.transform);
            });
        

        // Create container for zoom
        const container = svg.append("g");

        svg.call(zoom);

        // Force simulation
        const simulation = d3.forceSimulation(graphData.nodes)
            .force("link", d3.forceLink(graphData.edges).id(d => d.id).distance(100))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(d => d.size + 5));

        // Create edges
        const link = container.append("g")
            .attr("class", "links")
            .selectAll("line")
            .data(graphData.edges)
            .enter().append("line")
            .attr("class", d => `link ${d.type}`)
            .attr("stroke", "#999")
            .attr("stroke-width", d => Math.sqrt(d.confidence) * 2);

        // Create nodes
        const node = container.append("g")
            .attr("class", "nodes")
            .selectAll("circle")
            .data(graphData.nodes)
            .enter().append("circle")
            .attr("class", "node")
            .attr("r", d => d.size)
            .attr("fill", d => d.color)
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        // Add labels (if enabled)
        
            const label = container.append("g")
                .attr("class", "labels")
                .selectAll("text")
                .data(graphData.nodes)
                .enter().append("text")
                .attr("class", "label")
                .text(d => d.id);
            

        // Tooltip
        const tooltip = d3.select("#tooltip");

        node.on("mouseover", function(event, d) {
            tooltip.style("display", "block")
                .html(`<strong>${d.id}</strong><br/>
                       Community: ${d.community}<br/>
                       Centrality: ${d.centrality.toFixed(3)}<br/>
                       Degree: ${d.degree}`);
        }).on("mousemove", function(event) {
            tooltip.style("left", (event.pageX + 10) + "px")
                  .style("top", (event.pageY - 10) + "px");
        }).on("mouseout", function() {
            tooltip.style("display", "none");
        });

        // Update positions on tick
        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);

            
            label
                .attr("x", d => d.x)
                .attr("y", d => d.y + d.size + 12);
            
        });

        // Drag functions
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        // Legend
        const communities = [...new Set(graphData.nodes.map(d => d.community))];
        const legendItems = d3.select("#legend-items");
        communities.forEach(comm => {
            const color = graphData.nodes.find(d => d.community === comm).color;
            legendItems.append("div")
                .style("display", "flex")
                .style("align-items", "center")
                .style("margin", "5px 0")
                .html(`<div style="width: 15px; height: 15px; background: ${color}; margin-right: 5px; border-radius: 50%;"></div>
                       Community ${comm}`);
        });

        // Statistics
        const stats = d3.select("#stats-content");
        stats.html(`
            Nodes: ${graphData.nodes.length}<br/>
            Edges: ${graphData.edges.length}<br/>
            Communities: ${communities.length}<br/>
            Density: ${(graphData.edges.length / (graphData.nodes.length * (graphData.nodes.length - 1) / 2)).toFixed(3)}<br/>
            Avg Degree: ${(graphData.edges.length * 2 / graphData.nodes.length).toFixed(2)}
        `);
    </script>
</body>
</html>
