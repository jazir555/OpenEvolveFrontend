[pytest]
# Pytest configuration for PES test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = .

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may use external resources)
    slow: Slow-running tests
    benchmark: Performance benchmarks
    async: Tests that use async/await

# Coverage options
addopts =
    # Show local variables in tracebacks
    -l
    # Show summary of test results
    -ra
    # Show extra test summary info for all tests
    --tb=short
    # Don't capture output (makes debugging easier)
    -s

# Ignore paths
norecursedir =
    .git
    .tox
    dist
    build
    *.egg-info
    __pycache__

# Timeout settings (if pytest-timeout installed)
# timeout = 300

# Asyncio mode (if pytest-asyncio installed)
asyncio_mode = auto

# Warnings
filterwarnings =
    # Ignore specific warnings during testing
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Minimum version
minversion = 7.0

# Required plugins
required_plugins =
    pytest_asyncio
