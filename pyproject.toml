[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openevolve"
version = "0.1.0"
description = "OpenEvolve: AI-Powered Content Evolution Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "OpenEvolve Team"}
]

# =============================================================================
# CODE QUALITY TOOLS CONFIGURATION
# =============================================================================

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",  # Parallel test execution

    # Code Formatting
    "black>=23.0.0",
    "isort>=5.12.0",

    # Linting
    "flake8>=6.0.0",
    "pylint>=2.17.0",
    "flake8-docstrings>=1.7.0",
    "flake8-bugbear>=23.0.0",
    "flake8-comprehensions>=3.14.0",

    # Type Checking
    "mypy>=1.0.0",

    # Security
    "bandit[toml]>=1.7.0",

    # Pre-commit hooks
    "pre-commit>=3.0.0",
]

# =============================================================================
# BLACK CONFIGURATION
# =============================================================================
[tool.black]
line-length = 100
target-version = ['py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | node_modules
)/
'''

# =============================================================================
# ISORT CONFIGURATION
# =============================================================================
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["openevolve", "crewai", "roma", "bubblelab"]
known_third_party = ["openai", "anthropic", "flask", "numpy", "pyyaml"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# =============================================================================
# FLAKE8 CONFIGURATION
# =============================================================================
[tool.flake8]
max-line-length = 100
extend-ignore = [
    "E203",  # Whitespace before ':' (conflicts with Black)
    "W503",  # Line break before binary operator (conflicts with Black)
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "node_modules",
    ".tox",
]
enable-extensions = "G"
per-file-ignores = [
    "__init__.py:F401",  # Allow unused imports in __init__.py
]

# =============================================================================
# PYLINT CONFIGURATION
# =============================================================================
[tool.pylint.messages_control]
disable = [
    "C0111",  # Missing docstrings (too strict for WIP)
    "C0103",  # Invalid variable names (sometimes short names are clearer)
    "R0903",  # Too few public methods
    "R0913",  # Too many arguments
    "W0212",  # Access to protected member
]
max-line-length = 100

[tool.pylint.format]
max-line-length = 100
max-module-lines = 2000

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "id", "_", "db"]

# =============================================================================
# MYPY CONFIGURATION
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_optional = true
disallow_untyped_defs = false  # Set to true in production
disallow_incomplete_defs = false  # Set to true in production
check_untyped_defs = true
show_error_codes = true
show_column_numbers = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "openai.*",
    "anthropic.*",
    "flask.*",
]
ignore_missing_imports = true

# =============================================================================
# PYTEST CONFIGURATION
# =============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=87",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring external services",
    "unit: marks tests as unit tests (fast, isolated)",
    "postgres: marks tests requiring PostgreSQL",
    "qdrant: marks tests requiring Qdrant",
    "redis: marks tests requiring Redis",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

# =============================================================================
# BANDIT SECURITY LINTER CONFIGURATION
# =============================================================================
[tool.bandit]
exclude_dirs = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "node_modules",
    "tests",
]
skips = [
    "B101",  # Allow assert statements (they're useful for development)
    "B601",  # Parameterized shell calls (sometimes necessary)
]

# =============================================================================
# COVERAGE CONFIGURATION
# =============================================================================
[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/dist-packages/*",
    "*/venv/*",
    "*/.venv/*",
    "setup.py",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# =============================================================================
# PRE-COMMIT HOOKS CONFIGURATION
# =============================================================================
# See .pre-commit-config.yaml for hook definitions
# This section documents what's configured
# =============================================================================
[tool.pre-commit]
# Hooks configured in .pre-commit-config.yaml:
# - black: Python code formatting
# - isort: Import sorting
# - flake8: Python linting
# - mypy: Type checking
# - bandit: Security scanning
# - trailing-whitespace: Trim trailing whitespace
# - end-of-file-fixer: Ensure files end with newline
# - check-yaml: Validate YAML syntax
# - check-toml: Validate TOML syntax
# - check-json: Validate JSON syntax
