[pytest]
# Pytest configuration to prevent crashes and warnings
minversion = 7.0

# Asyncio configuration to prevent deprecation warnings
asyncio_default_fixture_loop_scope = function

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore paths
norecursedir = .git .tox dist build *.egg venv openevolve_test_env node_modules

# Markers
markers =
    integration: integration tests
    unit: unit tests
    slow: slow running tests
    requires_cuda: tests requiring CUDA GPU
    requires_gpu: tests requiring GPU
    large_model: tests loading large models

# Timeout configuration (timeout tests that hang)
timeout = 300
timeout_method = thread

# Coverage configuration
addopts =
    -v
    --strict-markers
    --tb=short
    -W ignore::DeprecationWarning
    -W ignore::PendingDeprecationWarning
    -W ignore::UserWarning
