; pytest configuration for LeanAide integration tests
; Place this file as pytest.ini or use with --override-ini

[pytest]
; Python test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; Minimum version
minversion = 7.0

; Configure test paths
testpaths = .

; Markers
markers =
    unit: Unit tests for individual components (fast, no external dependencies)
    integration: Integration tests for end-to-end workflows (slower, may require server)
    mock: Tests using mocking for offline testing (no server required)
    server: Tests requiring LeanAide server to be running
    slow: Tests that take longer to run (can be skipped with -m "not slow")
    async: Async tests that require pytest-asyncio

; Async configuration
asyncio_mode = auto

; Output configuration
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

; Coverage configuration (when using pytest-cov)
[coverage:run]
source =
    leanaide_client.py
    leanaide_mcp_tools.py
    leanaide_hephaestus_bridge.py
omit =
    */tests/*
    */test_*.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
