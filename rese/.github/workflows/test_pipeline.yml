name: RESE Testing Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'

jobs:
  # ============================================================================
  # Unit Tests
  # ============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        path: rese

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd rese
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-xdist pytest-timeout
        pip install numpy scipy scikit-learn
        pip install networkx matplotlib
        # Install additional dependencies
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run unit tests
      run: |
        cd rese
        pytest tests/ -m "unit" -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./rese/coverage.xml
        flags: unit-tests
        name: codecov-umbrella
        fail_ci_if_error: false

  # ============================================================================
  # Integration Tests
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 60

    strategy:
      matrix:
        phase: [phase1, phase2, phase3, phase4, full_pipeline]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        path: rese

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd rese
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-xdist
        pip install numpy scipy scikit-learn networkx

    - name: Run integration tests for ${{ matrix.phase }}
      run: |
        cd rese
        pytest tests/test_integration/ -m "${{ matrix.phase }}" -v --tb=short

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: integration-test-results-${{ matrix.phase }}
        path: rese/test-results/

  # ============================================================================
  # Performance Tests
  # ============================================================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        path: rese

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd rese
        python -m pip install --upgrade pip
        pip install pytest pytest-benchmark
        pip install numpy scipy scikit-learn
        pip install tracemalloc

    - name: Run performance tests
      run: |
        cd rese
        pytest tests/test_performance/ -v --tb=short --benchmark-only

    - name: Check performance regression
      run: |
        cd rese
        # Check if performance metrics meet thresholds
        python tests/scripts/check_performance_regression.py

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: rese/benchmark-results/

  # ============================================================================
  # Validation Tests
  # ============================================================================
  validation-tests:
    name: Validation Tests (KEY INNOVATIONS)
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        path: rese

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd rese
        python -m pip install --upgrade pip
        pip install pytest
        pip install numpy scipy scikit-learn

    - name: Run validation tests
      run: |
        cd rese
        pytest tests/test_validation/ -v --tb=short

    - name: Validate KEY INNOVATIONS
      run: |
        cd rese
        python tests/scripts/validate_innovations.py

    - name: Upload validation results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: validation-results
        path: rese/validation-results/

  # ============================================================================
  # Coverage Report
  # ============================================================================
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        path: rese

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd rese
        pip install pytest pytest-cov

    - name: Run all tests with coverage
      run: |
        cd rese
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=html --cov-report=json

    - name: Check coverage threshold
      run: |
        cd rese
        coverage report --fail-under=80

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./rese/coverage.xml
        flags: all-tests
        fail_ci_if_error: false

    - name: Upload HTML coverage report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: rese/htmlcov/

  # ============================================================================
  # Build and Test Summary
  # ============================================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, performance-tests, validation-tests, coverage-report]
    if: always()

    steps:
    - name: Check all jobs
      run: |
        echo "Unit Tests: ${{ needs.unit-tests.result }}"
        echo "Integration Tests: ${{ needs.integration-tests.result }}"
        echo "Performance Tests: ${{ needs.performance-tests.result }}"
        echo "Validation Tests: ${{ needs.validation-tests.result }}"
        echo "Coverage Report: ${{ needs.coverage-report.result }}"

        if [ "${{ needs.unit-tests.result }}" != "success" ] || \
           [ "${{ needs.integration-tests.result }}" != "success" ] || \
           [ "${{ needs.validation-tests.result }}" != "success" ]; then
          echo "Some tests failed!"
          exit 1
        fi

    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: test-artifacts/

    - name: Generate summary
      run: |
        echo "## RESE Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Unit Tests: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Performance Tests: ${{ needs.performance-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Validation Tests: ${{ needs.validation-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Coverage: ${{ needs.coverage-report.result }}" >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # Performance Regression Detection
  # ============================================================================
  performance-regression-check:
    name: Performance Regression Detection
    runs-on: ubuntu-latest
    needs: performance-tests
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        path: rese

    - name: Download benchmark results
      uses: actions/download-artifact@v3
      with:
        name: benchmark-results
        path: rese/benchmark-results/

    - name: Compare with baseline
      run: |
        cd rese
        python tests/scripts/compare_benchmarks.py \
          --current benchmark-results/ \
          --baseline .github/baselines/benchmark_baseline.json \
          --tolerance 0.1

    - name: Create issue on regression
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Performance Regression Detected',
            body: 'Performance tests indicate regression compared to baseline.',
            labels: ['performance', 'regression']
          })
