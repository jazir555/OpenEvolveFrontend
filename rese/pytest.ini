[pytest]
# Pytest Configuration for RESE Testing Infrastructure

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.0

# Default options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov-report=term-missing
    --cov-report=html
    --html=test_reports.html
    --self-contained-html

# Markers
markers =
    unit: Unit tests (test individual components)
    integration: Integration tests (test component interactions)
    performance: Performance tests (load, stress, benchmark)
    validation: Validation tests (KEY INNOVATIONS validation)
    slow: Slow-running tests (> 1 minute)
    phase1: Phase I (Φ₁.₅) tests
    phase2: Phase II (I_mech, Ψ₃) tests
    phase3: Phase III (Γ₁) tests
    phase4: Phase IV (Δ₃, DITO) tests
    core: Core component tests (SCE, Lean4 Bridge, etc.)

# Coverage configuration
[coverage:run]
source = .
omit =
    tests/*
    */tests/*
    .github/*
    .venv/*
    venv/*
    */__pycache__/*
    */site-packages/*
    setup.py
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout
timeout = 300

# Parallel execution
# addopts = -n auto

# Required plugins
required_plugins =
    pytest-cov
    pytest-html
    pytest-timeout
