# ROMA Knowledge Graph Plugin Configuration
# This file configures the roma_kg_plugin for ROMA

# Plugin metadata
plugin:
  name: "roma_kg_plugin"
  version: "1.0.0"
  enabled: true
  priority: 10

# Knowledge engine integration
knowledge_engine:
  # Path to knowledge engine (relative to ROMA root or absolute)
  path: "../knowledge_engine"

  # Connection settings
  connection:
    timeout: 30  # seconds
    max_retries: 3
    retry_delay: 1  # seconds

  # Query settings
  query:
    default_limit: 100
    max_limit: 10000
    timeout: 10  # seconds

# Visualization settings
visualization:
  # Graph rendering
  max_nodes: 1000  # Maximum nodes to display
  max_edges: 5000  # Maximum edges to display

  # Layout algorithm: spring, circular, random, kamada_kawai
  layout_algorithm: "spring"

  # Node sizing: centrality, degree, uniform
  node_sizing: "centrality"

  # Display dimensions
  default_width: 80   # characters
  default_height: 20  # characters

  # Color schemes: default, dark, light
  color_scheme: "default"

  # Show labels on nodes
  show_labels: true

  # Label truncation length
  max_label_length: 20

# Analytics settings
analytics:
  # Enable charts (requires asciichartpy)
  enable_charts: true

  # Cache metrics
  cache_metrics: true

  # Cache TTL (seconds)
  cache_ttl: 300

  # Cache size (number of metric sets)
  cache_size: 100

  # Update interval (seconds)
  update_interval: 60

  # Temporal analysis
  enable_temporal: true

  # Time buckets for temporal analysis
  time_buckets:
    - "hour"
    - "day"
    - "week"
    - "month"

# Exploration settings
exploration:
  # Default depth for neighborhood exploration
  default_depth: 2

  # Maximum depth
  max_depth: 5

  # Traversal algorithm: bfs, dfs
  traversal_algorithm: "bfs"

  # Path finding algorithm: dijkstra, bfs, astar
  path_algorithm: "dijkstra"

  # Maximum path length
  max_path_length: 10

# Export settings
export:
  # Supported formats
  formats:
    - "json"
    - "gexf"
    - "csv"
    - "graphml"

  # Default format
  default_format: "json"

  # Output directory (relative to ROMA root or absolute)
  output_directory: "./exports"

  # Compression
  compression: false

  # Include metadata
  include_metadata: true

  # Include communities
  include_communities: true

  # Include temporal data
  include_temporal: true

# Performance settings
performance:
  # Parallel processing
  enable_parallel: true

  # Number of worker threads (0 = auto)
  num_workers: 0

  # Batch size for bulk operations
  batch_size: 1000

# Logging settings
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"

  # Log file (relative to ROMA root or absolute)
  file: "./logs/roma_kg_plugin.log"

  # Console logging
  console: true

  # Structured logging (JSON)
  structured: false

# Menu settings
menus:
  # Enable hierarchical menus
  enable_hierarchical: true

  # Show keyboard shortcuts
  show_shortcuts: true

# Command settings
commands:
  # Command prefix
  prefix: "/kg"

  # Enable command completion
  enable_completion: true

  # Command history size
  history_size: 1000

  # Enable command aliases
  enable_aliases: true

  # Aliases
  aliases:
    search: "s"
    explore: "e"
    path: "p"
    communities: "c"
    stats: "st"
    export: "ex"
    timeline: "t"
    analyze: "a"

# Panel settings
panels:
  # Knowledge Graph Panel
  knowledge_graph:
    enabled: true
    title: "Knowledge Graph"
    shortcut: "kg"
    refresh_interval: 0  # 0 = manual refresh

  # Analytics Dashboard
  analytics:
    enabled: true
    title: "Analytics"
    shortcut: "an"
    refresh_interval: 60  # seconds

# Cache settings
cache:
  # Enable caching
  enabled: true

  # Cache directory
  directory: "./cache/roma_kg_plugin"

  # Maximum cache size (MB)
  max_size_mb: 100

  # Cache TTL (seconds)
  ttl: 3600

  # Cache eviction policy: lru, fifo
  eviction_policy: "lru"

# Security settings
security:
  # Enable access control
  enable_access_control: false

  # Allowed operations (empty = all allowed)
  allowed_operations: []

  # Rate limiting (requests per minute)
  rate_limit: 60

# Integration settings
integration:
  # ROMA client settings
  roma_client:
    timeout: 30
    max_retries: 3

  # Plugin communication
  plugin_communication:
    enabled: true
    timeout: 10
