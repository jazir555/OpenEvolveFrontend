# Load Test Configuration
# This file defines parameters for all load test scenarios

# Read-Heavy Workload Configuration
# Tests system performance under mostly search/query operations
read_heavy:
  users: [10, 50, 100, 500]          # Number of concurrent users to test
  spawn_rate: 10                      # Users spawned per second
  duration: 60                        # Test duration in seconds
  target_throughput: 100              # Target operations per second
  max_error_rate: 0.01                # Maximum acceptable error rate (1%)
  operation_mix:
    search: 0.9                       # 90% search operations
    write: 0.1                        # 10% write operations

# Write-Heavy Workload Configuration
# Tests system performance under mostly write operations
write_heavy:
  users: [5, 25, 50, 100]             # Number of concurrent users
  spawn_rate: 5                       # Users spawned per second
  duration: 60                        # Test duration in seconds
  target_throughput: 50               # Target operations per second
  max_error_rate: 0.05                # Maximum acceptable error rate (5%)
  operation_mix:
    write: 0.8                        # 80% write operations
    search: 0.2                       # 20% search operations

# Spike Test Configuration
# Tests system resilience to sudden traffic increases
spike_test:
  base_users: 10                      # Initial number of users
  spike_users: [50, 100, 200]         # Peak number of users during spike
  spike_duration: 30                  # Duration of spike in seconds
  max_response_time_degradation: 0.5  # Max acceptable response time increase (50%)
  ramp_up_time: 5                     # Time to ramp up to spike (seconds)

# Endurance Test Configuration
# Tests system stability under sustained load
endurance:
  users: 20                           # Number of concurrent users
  duration: 300                       # Test duration in seconds (5 minutes)
  max_memory_growth: 0.5              # Maximum acceptable memory growth (500 MB)
  max_performance_degradation: 0.2    # Max performance degradation over time (20%)
  sampling_interval: 30               # Performance sampling interval (seconds)

# Locust Configuration
# Settings for Locust-based load testing
locust:
  host: http://localhost:8080         # Target host
  users: 100                          # Number of simulated users
  spawn_rate: 10                      # Users spawned per second
  run_time: 5m                        # Test duration (5 minutes)
  headless: true                      # Run without web UI
  html_report: locust_report.html     # Output HTML report

# Logging Configuration
logging:
  level: INFO                         # Log level (DEBUG, INFO, WARNING, ERROR)
  file: load_test.log                 # Log file path
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'

# Alert Thresholds
# Thresholds for generating alerts during testing
thresholds:
  critical:
    error_rate: 0.1                   # 10% error rate
    response_time: 5.0                # 5 second response time
    memory_growth: 1.0                # 1 GB memory growth

  warning:
    error_rate: 0.05                  # 5% error rate
    response_time: 2.0                # 2 second response time
    memory_growth: 0.5                # 500 MB memory growth

# Reporting Configuration
reporting:
  output_dir: load_test_results       # Directory for result files
  generate_html: true                 # Generate HTML reports
  generate_json: true                 # Generate JSON reports
  include_charts: true                # Include performance charts
  save_raw_data: true                 # Save raw test data
